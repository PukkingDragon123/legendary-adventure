    const U = V3.norm(u);
    const W = V3.norm(V3.sub(w, V3.scale(U, V3.dot(w, U))));
    return M3.cols(U, V3.cross(W, U), W);
  }

  /* ---------- body: a smooth asymmetric egg made of four quarter-ellipsoids that share one centre and
     tilt (front/rear lengths, top/bottom heights, common width). Each draws only its own quadrant, so
     the pieces meet with matching cross-sections and normals: no creases. Fitted to the official
     silhouette (big domed head, long taper to a mid-height tail). ---------- */
  const EGG = { c: [683, 0, 0], rxf: 580, rxr: 1657, ryt: 540, ryb: 540, rz: 575, a: 0.1 };
  {
    // put the lowest point of the belly on the ground (y = 0)
    const ca = Math.cos(EGG.a), sa = Math.sin(EGG.a);
    let lo = Infinity;
    for (let i = 0; i < 720; i++) {
      const t = (i / 720) * 2 * Math.PI, ct = Math.cos(t), st = Math.sin(t);
      const lx = ct * (ct >= 0 ? EGG.rxf : EGG.rxr), ly = st * (st >= 0 ? EGG.ryt : EGG.ryb);
      lo = Math.min(lo, sa * lx + ca * ly);
    }
    EGG.c[1] = -lo;
  }
  const QUADS = EGG.ryt === EGG.ryb ? [
    { id: 'F', r: [EGG.rxf, EGG.ryt, EGG.rz], sx: 1, sy: 0 },
    { id: 'R', r: [EGG.rxr, EGG.ryt, EGG.rz], sx: -1, sy: 0 },
  ] : [
    { id: 'FT', r: [EGG.rxf, EGG.ryt, EGG.rz], sx: 1, sy: 1 },
    { id: 'FB', r: [EGG.rxf, EGG.ryb, EGG.rz], sx: 1, sy: -1 },
    { id: 'RT', r: [EGG.rxr, EGG.ryt, EGG.rz], sx: -1, sy: 1 },
    { id: 'RB', r: [EGG.rxr, EGG.ryb, EGG.rz], sx: -1, sy: -1 },
  ];
  for (const Q of QUADS) {
    Q.c = EGG.c; Q.a = EGG.a;
    Q.R = M3.rz(EGG.a);
    Q.L = M3.mul(Q.R, M3.diag(...Q.r));
    Q.Li = M3.inv(Q.L);
  }
  const FT = QUADS[0];
  const toLocal = (E, p) => M3.v(E.Li, V3.sub(p, E.c));
  const toModel = (E, q) => V3.add(E.c, M3.v(E.L, q));
  const inQuad = (Q, q) => q[0] * Q.sx >= -1e-6 && q[1] * Q.sy >= -1e-6;
  // quadrant containing the (in-plane) model point, and its unit-sphere direction there (near side)
  function quadDir(x, y, zSign = 1) {
    for (const Q of QUADS) {
      const q = toLocal(Q, [x, y, 0]);
      if (!inQuad(Q, q)) continue;
      return { Q, s: V3.norm([q[0], q[1], zSign * Math.sqrt(Math.max(0, 1 - q[0] * q[0] - q[1] * q[1]))]) };
    }
    return { Q: FT, s: [0, 1, 0] };
  }
  const REAR_POLE = toModel(QUADS.find((Q) => Q.sx < 0), [-1, 0, 0]);

  // jaw line / belly boundary: height as a function of x (lookup table, Catmull-Rom through JAW)
  const JAW = [[-1100, 455], [-700, 468], [-300, 515], [100, 605], [400, 710], [700, 815], [900, 868], [1100, 915], [1320, 950]];
  const JAW_T = new Float32Array(260);
  for (let i = 0; i < 260; i++) {
    const x = -1100 + i * 10;
    let k = 0;
    while (k < JAW.length - 2 && x > JAW[k + 1][0]) k++;
    const p0 = JAW[Math.max(0, k - 1)], p1 = JAW[k], p2 = JAW[k + 1], p3 = JAW[Math.min(JAW.length - 1, k + 2)];
    const t = clamp((x - p1[0]) / (p2[0] - p1[0]), 0, 1), t2 = t * t, t3 = t2 * t;
    JAW_T[i] = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
  }
  const jawY = (x) => { const f = clamp((x + 1100) / 10, 0, 258.99), i = f | 0; return JAW_T[i] + (JAW_T[i + 1] - JAW_T[i]) * (f - i); };

  /* ---------- belly grooves: curves where the body surface meets planes through a tilted axis
     (from the lower rear, where they converge, to a point high in front of the snout, so their
     front ends fan out below the jaw line). Stored in FT's local coordinates + model normals. ---------- */
  const GROOVES = (() => {
    const Rp = [-780, 420, 0], Fp = [1450, 1060, 0];
    const a = V3.norm(V3.sub(Fp, Rp)), b1 = [a[1], -a[0], 0], b2 = [0, 0, 1];
    const len = Math.hypot(Fp[0] - Rp[0], Fp[1] - Rp[1]);
    const cosPhi = [0.93, 0.8, 0.65, 0.5, 0.34, 0.18];
    const out = [];
    cosPhi.forEach((cp, gi) => {
      const sp = Math.sqrt(1 - cp * cp);
      for (const zs of [1, -1]) {
        const d = V3.add(V3.scale(b1, cp), V3.scale(b2, sp * zs));
        let cur = [];
        const flush = () => { if (cur.length > 2) out.push(cur); cur = []; };
        for (let t = -200; t <= len; t += 16) {
          const A = V3.add(Rp, V3.scale(a, t));
          let best = -1, bestE = null;
          for (const E of QUADS) {
            const o = toLocal(E, A), dl = M3.v(E.Li, d);
            const qa = V3.dot(dl, dl), qb = 2 * V3.dot(o, dl), qc = V3.dot(o, o) - 1;
            const disc = qb * qb - 4 * qa * qc;
            if (disc < 0) continue;
            const s = (-qb + Math.sqrt(disc)) / (2 * qa);
            if (s > best && inQuad(E, V3.add(o, V3.scale(dl, s)))) { best = s; bestE = E; }
          }
          if (best <= 0) { flush(); continue; }
          const P = V3.add(A, V3.scale(d, best));
          const ql = toLocal(bestE, P), Li = bestE.Li;
          const n = V3.norm([Li[0] * ql[0] + Li[3] * ql[1] + Li[6] * ql[2], Li[1] * ql[0] + Li[4] * ql[1] + Li[7] * ql[2], Li[2] * ql[0] + Li[5] * ql[1] + Li[8] * ql[2]]);
          if (P[1] < jawY(P[0]) - 22 && P[0] > Rp[0] + 90 + gi * 30) cur.push({ q: toLocal(FT, P), n });

  /* ---------- fins and flukes (plates, baked at 2-unit resolution) ---------- */
  // swept-back dorsal fin: a long low blade (u = forward, v = up; base on the back, tip pointing back)
  const DORSAL = bakeShape(Shape2D.poly([[135, -40], [112, 22], [45, 82], [-60, 128], [-200, 156], [-335, 166], [-300, 122], [-236, 84], [-165, 40], [-115, -40]], code(FIN)), 2);
  const DORSAL_LINES = [
    { pts: [[0, 30, 0], [-130, 88, 0], [-290, 136, 0]], mat: FIN, useLn: true },
  ];
  // pectoral flipper (u = back along the body, v = down)
  const PECT = bakeShape(Shape2D.poly([[-10, -40], [60, -36], [170, -14], [270, 30], [300, 58], [230, 60], [120, 40], [20, 36], [-20, 10]], code(FIN)), 2);
  // tail lobes (u = backward, v = up): long blue upper blade, small grey lower spike
  // both lobes in one plate (no overlapping coplanar plates): blue above the split line, grey below
  const FLUKE_UP_P = Shape2D.catmull([[-40, -60], [70, -40], [200, 10], [330, 60], [420, 96], [310, 100], [170, 82], [50, 62], [-40, 50]], true, 8);
  const FLUKE_LO_P = Shape2D.catmull([[-40, 30], [60, 16], [140, -20], [210, -66], [145, -68], [60, -52], [-40, -40]], true, 8);
  const FLUKES = bakeShape({
    bb: [-45, -75, 425, 105],
    test(u, v) {
      const up = Shape2D.inPoly(u, v, FLUKE_UP_P), lo = Shape2D.inPoly(u, v, FLUKE_LO_P);
      if (!up && !lo) return 0;
      if (up && lo) return v > 4 - 0.25 * u ? code(FIN) : code(BELLY);
      return up ? code(FIN) : code(BELLY);
    },
  }, 2);

  // body top height at x (for seating the dorsal fins)
  function topAt(x) {
    let best = 0;
    for (const Q of QUADS) {
      for (let i = 0; i <= 400; i++) {
        const th = (i / 400) * Math.PI;
        const q = [Math.cos(th), Math.sin(th), 0];
        if (!inQuad(Q, q)) continue;
        const p = toModel(Q, q);
        if (Math.abs(p[0] - x) < 8) best = Math.max(best, p[1]);
      }
    }
    return best;
  }
  const FIN_POS = [{ x: -110, s: 1 }, { x: -500, s: 0.84 }].map((d) => Object.assign(d, { y: topAt(d.x) - 12 * d.s }));

  const EYE_D = quadDir(700, 895), EYE_S = EYE_D.s, EYE_SF = [EYE_S[0], EYE_S[1], -EYE_S[2]];
  const EYE_TV = V3.norm(V3.sub([0, 1, 0], V3.scale(EYE_S, EYE_S[1]))), EYE_TU = V3.cross(EYE_TV, EYE_S);
  let EYE_DECAL = false, EYE_KIND = 'open';
  const BLOW_D = quadDir(640, 1085);
  const PECT_D = quadDir(520, 735);
  const PECT_AT = V3.add(toModel(PECT_D.Q, PECT_D.s), [0, 0, -12]);

  let HL = null, HLl = [0, 1, 0]; // highlight direction in model space / in the egg's local frame (set per render)
  // points covering one octant-pair of the unit sphere (x, y >= 0, both z signs), for bounding quarter prims
  const QUAD_SAMPLES = [];
  for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) {
    const th = (i / 12) * (Math.PI / 2), ph = (j / 12) * Math.PI; // th: angle in the x-y quadrant, ph: around it
    const c = Math.cos(th), sn = Math.sin(th);
    for (const zs of [1, -1]) {
      const sp = Math.sin(ph), cp = Math.cos(ph);
      // meridian from the x-y quadrant point toward +/-z
      QUAD_SAMPLES.push([c * sp, sn * sp, zs * Math.abs(cp)]);
    }
  }

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const bl = clamp(P.blow, 0, 1), mo = clamp(P.mouth, 0, 1), roll = clamp(P.roll || 0, -0.6, 0.6);
    const prims = [];
    // squash before spouting (anchored at the belly) and roll about the long axis
    const D = M3.diag(1 + 0.05 * bl, 1 - 0.1 * bl, 1 + 0.05 * bl);
    const root = chain(F(D, [0, 0, 0]), T(0, 560, 0), R(M3.rx(roll)), T(0, -560, 0));
    const mouthA = mo * 0.14;
    const bodyMat = (E) => {
      const ca = Math.cos(E.a), sa = Math.sin(E.a), rx = E.r[0], ry = E.r[1], rz = E.r[2];
      return (s) => {
        const lx = s[0] * rx, ly = s[1] * ry;
        const x = E.c[0] + ca * lx - sa * ly, y = E.c[1] + sa * lx + ca * ly;
        const yb = jawY(x);
        if (y < yb) {
          // open mouth: a dark wedge below the jaw line at the front, tongue at its floor
          if (mouthA > 0.003 && x > 560) {
            const k = (x - 560) / 700, h = mouthA * 900 * k * Math.min(1, k * 3);
            if (y > yb - h) return code(y < yb - h * 0.62 ? TONGUE : MOUTH);
          }
          return code(BELLY);
        }

  // flank chevron, hook and the ridge behind the head
  stroke(SIDE, smooth([[8, 190], [44, 150], [92, 108], [84, 72], [72, 34]], false, 6), 10);
  stroke(SIDE, smooth([[26, 146], [-4, 152], [-36, 150], [-44, 118], [-46, 92]], false, 6), 10);
  // volumes (x,y,z centre, radii, z-rotation) for white patches and slits; mirrored in z
  const PATCHES = [
    { c: [258, 136, 72], r: [72, 30, 36], rot: -0.26 },
    { c: [176, 124, 86], r: [24, 13, 30], rot: -0.2 },
  ];
  const SLITS = [
    { c: [46, 72, 104], r: [6, 26, 30], rot: -0.48 },
    { c: [16, 88, 100], r: [5.5, 21, 30], rot: -0.48 },
  ];
  for (const V of PATCHES.concat(SLITS)) { V.co = Math.cos(V.rot); V.si = Math.sin(V.rot); V.ix = 1 / V.r[0]; V.iy = 1 / V.r[1]; V.iz = 1 / V.r[2]; }
  const inVol = (V, X, Y, Z) => {
    const dz = (Math.abs(Z) - V.c[2]) * V.iz;
    if (dz > 1 || dz < -1) return false;
    const dx = X - V.c[0], dy = Y - V.c[1];
    const lx = (dx * V.co + dy * V.si) * V.ix, ly = (dy * V.co - dx * V.si) * V.iy;
    return lx * lx + ly * ly + dz * dz < 1;
  };
  // eye (side-view ellipse decal on the head; both sides)
  const EYE = { x: 318, y: 80, ax: 20, ay: 12 };
  const HEAD = { c: [186, 92, 0], r: [208, 114, 116], tilt: -0.1 };

  /* ---------- pectoral fin: outline + line pattern in fin space (u root->tip, v across) ---------- */
  const FIN_OUT = smooth([[0, 40], [50, 62], [110, 96], [170, 118], [220, 124], [250, 102], [266, 56], [270, 0], [264, -54], [248, -102], [214, -124], [164, -118], [104, -92], [50, -60], [0, -42], [-30, 0]], true, 8);
  const FIN_IN = grid(-40, -140, 290, 140, 1);
  fill(FIN_IN, FIN_OUT, 1);
  const FIN_LN = grid(-40, -140, 290, 140, 1, Float32Array, 99);
  stroke(FIN_LN, ellipsePts(108, -2, 56, 48), 10);
  for (const l of [
    [[138, 38], [160, 58], [200, 72], [242, 94]],
    [[162, 16], [212, 26], [262, 32]],
    [[162, -20], [212, -28], [262, -32]],
    [[138, -44], [160, -64], [200, -76], [242, -96]],
    [[208, 25], [216, -27]],
  ]) stroke(FIN_LN, l, 10);
  const FIN_PK = pack(FIN_IN, FIN_LN, 0, 7);
  const FIN_E = { cu: 145, cv: 0, ru: 200, rv: 150, rw: 14 };
  const CLAWS = [
    { u: 238, v: 96, a: 0.46 },
    { u: 262, v: 34, a: 0.15 },
    { u: 262, v: -34, a: -0.15 },
    { u: 240, v: -98, a: -0.46 },
  ];
  const CLAW_OUT = smooth([[-24, 15], [12, 17.5], [26, 15.5], [31, 6], [31, -6], [26, -15.5], [12, -17.5], [-24, -15]], true, 6);
  const CLAW_G = grid(-28, -20, 35, 20, 0.5);
  fill(CLAW_G, CLAW_OUT, 1);
  const CLAW_PK = pack(CLAW_G, null, 0, 4.5);
  const CLAW_E = { ru: 45, rv: 26, rw: 8.5 };

  /* ---------- dorsal fin (side view, x back.., y up), thin axis = z ---------- */
  const DORSAL_OUT = smooth([[168, 150], [150, 196], [118, 232], [78, 262], [62, 266], [66, 240], [70, 212], [62, 186], [40, 150]], true, 8);
  const DORSAL_G = grid(20, 130, 190, 280, 1);
  fill(DORSAL_G, DORSAL_OUT, 1);
  const DORSAL_LN = grid(20, 130, 190, 280, 1, Float32Array, 99);
  stroke(DORSAL_LN, smooth([[164, 176], [148, 200], [118, 232], [82, 258]], false, 6), 10);
  const DORSAL_PK = pack(DORSAL_G, DORSAL_LN, -4, 3);
  const DORSAL_E = { cx: 104, cy: 205, rx: 96, ry: 78, rz: 9 };

  /* ---------- tail streamers (fin space: u back, v up) ---------- */
  function shellOf(poly, rw) {
    const b = bbox(poly);
    const g = grid(b[0] - 2, b[1] - 2, b[2] + 2, b[3] + 2, 1);
    fill(g, poly, 1);
    return { g, poly, cu: (b[0] + b[2]) / 2, cv: (b[1] + b[3]) / 2, ru: ((b[2] - b[0]) / 2) * 1.42 + 2, rv: ((b[3] - b[1]) / 2) * 1.42 + 2, rw };
  }
  // union outline of a segmented streamer, used for seamless bevels
  function unionOf(...parts) {
    const bb = parts.map((p) => bbox(p.poly));
    const g = grid(Math.min(...bb.map((b) => b[0])) - 8, Math.min(...bb.map((b) => b[1])) - 8, Math.max(...bb.map((b) => b[2])) + 8, Math.max(...bb.map((b) => b[3])) + 8, 1);
    for (const p of parts) fill(g, p.poly, 1);
    for (const p of parts) p.full = g;
  }
  // upper (hooked) fins: rising part + backward part; lower streamers: root + tip
  const UP_A = shellOf(ribbon([[0, -22], [4, 18], [18, 52], [44, 78]], 64, 52), 8);
  const UP_B = shellOf(ribbon([[36, 74], [80, 89], [126, 95], [164, 97]], 52, 36, { a: 24, d: 14, b: 7 }), 7);
  const LO_A = shellOf(ribbon([[-24, 0], [40, -2], [125, -6]], 56, 42), 8);
  const LO_B = shellOf(ribbon([[115, -6], [182, -8], [244, -6]], 42, 33, { a: 26, d: 15, b: 9 }), 7);
  unionOf(UP_A, UP_B);
  unionOf(LO_A, LO_B);
  for (const E of [UP_A, UP_B, LO_A, LO_B]) E.pk = pack(E.g, null, -2.2, 5, E.full);

  const DEFAULT = { fin: 0, tail: 0, mouth: 0, eyes: 'open', glow: 0, headPitch: 0, roll: 0, side: 1 };
  let LWH = 2.8, LW8 = 22.4; // half line width (model units, and *8 for packed grids), set per render

  const MZ = M3.diag(1, 1, -1);
  const mirrorF = (f) => ({ L: M3.mul(MZ, f.L), t: M3.v(MZ, f.t) });
  const pivot = (p, M) => chain(T(p[0], p[1], p[2]), R(M), T(-p[0], -p[1], -p[2]));
  // ellipsoid with explicit local axes (columns u, w, v scaled by radii) in a parent frame
  const shell = (parent, center, u, w, v, r, o) => {
    const L = M3.mul(parent.L, M3.cols(V3.scale(u, r[0]), V3.scale(w, r[1]), V3.scale(v, r[2])));
    return { kind: 'ell', part: o.part, grp: o.grp, c: V3.add(parent.t, M3.v(parent.L, center)), L, mat: o.mat };
  };
  // Clipped thin "shell": test(s0,s1,s2) gives the material of the nearest surface point or 0.
  // The renderer only shades the nearest hit, so when that point is clipped away we march the
  // view ray's chord through the ellipsoid (direction from the renderer's prim.Li) and accept the
  // first sample inside the outline: edge-on fins keep their true silhouette. Face-on the chord
  // keeps the same (u, v), so nothing changes there.
  const clipped = (prim, test, edge, thin, R) => {
    let li = null, cw = 1, dx = 0, dy = 0, dz = 0, dt = 0;
    prim.mat = (s) => {
      const m = test(s[0], s[1], s[2]);
      if (m) return m;
      const Li = prim.Li;
      if (Li !== li) {
        // once per render: view direction in local space, and |cos| between view and fin normal
        li = Li;
        const t3 = thin * 3;
        cw = Math.abs(Li[t3 + 2]) / Math.hypot(Li[t3], Li[t3 + 1], Li[t3 + 2]);
        const il = 1 / Math.hypot(Li[2], Li[5], Li[8]);
        dx = Li[2] * il; dy = Li[5] * il; dz = Li[8] * il;
        dt = thin === 0 ? dx : thin === 1 ? dy : dz;
      }
      if (cw > 0.5) return 0; // within 60 degrees of face-on: the surface clip is already right
      const k = 2 * (s[0] * dx + s[1] * dy + s[2] * dz);
      // samples ~3 units apart along the chord's travel across the fin plane
      const n = Math.min(8, Math.floor((k * Math.sqrt(Math.max(0, 1 - dt * dt)) * R) / 3));
      for (let j = 1; j <= n; j++) {
        const t = (k * j) / (n + 1);
        const e = edge(s[0] - t * dx, s[1] - t * dy, s[2] - t * dz);
        if (e) return e;
      }
      return 0;
    };
    return prim;
  };

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const prims = [];
    const root = pivot([0, 100, 0], M3.rx(P.roll));

    // --- skin: shared decal logic in rest-pose coordinates
    const eyeK = P.eyes;
    const cRED = code(RED), cRED2 = code(RED, -2), cEYEK = code(EYEK), cEYEY = code(EYEY), cEYEW = code(EYEW);
    const cPALE = code(PALE), cBELLY = code(BELLY), cBODY = code(BODY), cCORE = code(RED, 1);
    const glow = P.glow > 0.25;
    const eyeMat = (X, Y) => {
      const ex = (X - EYE.x) / EYE.ax, ey = (Y - EYE.y) / EYE.ay;
      const e2 = ex * ex + ey * ey;
      if (eyeK === 'angry' && ex > -1.15 && ex < 1.05 && ey > 0.5 - 0.62 * ex && ey < 1.35 - 0.62 * ex && e2 < 2.2) return cRED2;
      if (e2 >= 1) return 0;
      if (eyeK === 'closed') return Math.abs(ey - (-0.02 - 0.32 * (1 - ex * ex))) < 0.2 && Math.abs(ex) < 0.86 ? cEYEK : cRED;
      if (eyeK === 'angry') {
        const cut = 0.28 - 0.62 * ex;
        if (ey > cut + 0.36) return cRED2;
        if (ey > cut) return cEYEK;
      }
      const ix = (X - (EYE.x + 3)) / 8.5, iy = (Y - EYE.y) / 8.5;
      if (ix * ix + iy * iy < 1) {
        if ((X - (EYE.x + 1.5)) ** 2 + (Y - (EYE.y + 3.5)) ** 2 < 5.5) return cEYEW;
        const px = (X - (EYE.x + 4.5)) / 4.6, py = (Y - (EYE.y - 0.5)) / 5.2;
        return px * px + py * py < 1 ? cEYEK : cEYEY;
      }
      return cRED;
    };
    // shared skin decals in rest-pose coordinates; vols = the white volumes this ellipsoid can touch
    const skin = (X, Y, Z, ny, az, head, vols, gi) => {
      if (az > 0.1 && gi >= 0) {
        if (head) {
          if (az > 0.3 && X > EYE.x - 26 && X < EYE.x + 26 && Y > EYE.y - 14 && Y < EYE.y + 22) {
            const e = eyeMat(X, Y);
            if (e) return e;
          }
          const dl = LIPA[gi];
          if (dl < 2 * LWH) return glow && dl > 0.4 * LWH && dl < 1.3 * LWH ? cCORE : cRED;
        }
        const d = SIDEA[gi];
        if (d < LWH) return glow && d < 0.45 * LWH ? cCORE : cRED;
      }
      for (let i = 0; i < vols.length; i++) if (inVol(vols[i], X, Y, Z)) return cPALE;
      return ny < -0.55 ? cBELLY : cBODY;
    };
    // body ellipsoid: rest centre c, radii r, optional rest tilt about z (radians)
    const bodyEll = (frame, c, r, part, head, tilt = 0) => {
      const [cx, cy, cz] = c, [rx, ry, rz] = r;
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      const rm = Math.max(rx, ry);
      const vols = PATCHES.concat(SLITS).filter((V) => Math.abs(V.c[0] - cx) < rm + V.r[0] + 10 && Math.abs(V.c[1] - cy) < rm + V.r[1] + 10);
      const f = chain(frame, T(cx, cy, cz), R(M3.rz(tilt)));
      return ell(f, r, {
        part, grp: 1,
        mat: (s) => {
          const lx = rx * s[0], ly = ry * s[1];
          const X = cx + lx * ct - ly * st, Y = cy + lx * st + ly * ct;
          const gx = Math.floor(X - SG.u0), gy = Math.floor(Y - SG.v0);
          const gi = gx >= 0 && gy >= 0 && gx < SG.gw && gy < SG.gh ? gy * SG.gw + gx : -1;
          if (head && gi >= 0 && JAWA[gi]) return 0;
          const ax = s[0] / rx, ay = s[1] / ry, nz = s[2] / rz;
          const ny = ax * st + ay * ct, nx = ax * ct - ay * st;
          const il = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
          return skin(X, Y, cz + rz * s[2], ny * il, Math.abs(nz) * il, head, vols, gi);
        },
      });
    };

    // --- head group (pitches about the neck): the big front ellipsoid carries the head
    const mouthK = Math.max(0, Math.min(1, P.mouth || 0));
    const headF = chain(root, pivot([150, 96, 0], M3.rz(P.headPitch)));
    const headPrim = bodyEll(headF, HEAD.c, HEAD.r, 1, true, HEAD.tilt);
    prims.push(headPrim);
    // lower jaw hinged behind the mouth corner
    const jawF = chain(headF, pivot([208, 70, 0], M3.rz(-0.34 * mouthK)));
    prims.push(ell(chain(jawF, T(292, 50, 0)), [106, 48, 78], {
      part: 3, grp: 2,
      mat: (s) => (s[1] < -0.72 ? code(PALE, -1) : code(PALE)),
    }));
    // mouth interior (only needed while the jaw is open)
    if (mouthK > 0.02) prims.push(ell(chain(headF, T(290, 62, 0)), [96, 26, 70], {
      part: 4, grp: 3,
      mat: (s) => (s[1] < 0.1 && Math.abs(s[2]) < 0.6 && s[0] > -0.5 ? code(TONGUE) : code(MOUTH)),
    }));

    // --- body (static mid, rear chain waves with the tail phase)
    const ph = P.tail;
    prims.push(bodyEll(root, [40, 104, 0], [140, 84, 102], 5, false));
    const rearF = chain(root, pivot([-30, 112, 0], M3.rz(0.05 * Math.sin(ph))));
    prims.push(bodyEll(rearF, [-70, 114, 0], [84, 44, 50], 7, false));
    const stockF = chain(rearF, pivot([-110, 114, 0], M3.rz(0.08 * Math.sin(ph - 0.7))));
    prims.push(bodyEll(stockF, [-122, 114, 0], [52, 26, 28], 8, false));

    // --- dorsal fin
    {
      const E = DORSAL_E;
      const cEdge = code(FIN, -1);
      const DB = [code(FIN, -1), code(FIN, 0), code(FIN, 1)];
      prims.push(clipped(ell(chain(root, T(E.cx, E.cy, 0)), [E.rx, E.ry, E.rz], { part: 9, grp: 4, mat: null }), (a, b, c) => {
        const v = pk(DORSAL_PK, E.cx + E.rx * a, E.cy + E.ry * b);
        if (!v) return 0;
        const d = v >> 3;
        if (d < LW8) return glow && d < 0.45 * LW8 ? cCORE : cRED;
        const bv = ((v >> 1) & 3) - (c > -0.3 && c < 0.3 ? 1 : 0);
        return DB[bv < 0 ? 0 : bv];
      }, (a, b) => (pk(DORSAL_PK, E.cx + E.rx * a, E.cy + E.ry * b) ? cEdge : 0), 2, E.rx));
    }

    // --- pectoral fins (near, far = mirror); sweep: fin=+1 up/forward, -1 down/back
    const sw = Math.max(-1, Math.min(1, P.fin));
    const R0 = M3.mul(M3.ry(0.72), M3.mul(M3.rz(0.38), M3.rx(-0.95)));
    // k = extra tuck for the fin on the far side of the camera (side cheat), so it never spikes out
    const finFrame = (k) => {
      const lift = -0.55 * sw * (sw < 0 ? 1 - 0.85 * k : 1) - 0.2 * k;
      const sc = 1 - 0.42 * k;
      return { L: M3.mul(M3.mul(M3.ry(0.3 * sw - 0.45 * k), M3.rx(lift)), M3.mul(R0, M3.diag(sc, sc, sc))), t: [185, 48, 78 - 14 * k] };
    };
    const finParts = [];
    for (const sd of [1, -1]) {
      let f = finFrame(Math.max(0, -sd * (P.side ?? 1)) * (1 - 0.7 * Math.max(0, sw)));
      if (sd < 0) f = mirrorF(f);
      const fr = chain(root, f);
      const u = [-1, 0, 0], v = [0, 1, 0], w = [0, 0, 1];
      const E = FIN_E;
      const gid = sd > 0 ? 5 : 6;
      const cFinEdge = code(FIN, -1);
      const FB = [code(FIN, -1), code(FIN, 0), code(FIN, 1)], cFINU = code(FINU);
      prims.push(clipped(shell(fr, V3.add(V3.scale(u, E.cu), V3.scale(v, E.cv)), u, w, v, [E.ru, E.rw, E.rv], { part: 10 + (sd < 0 ? 1 : 0), grp: gid, mat: null }), (a, b, c) => {
        const pv = pk(FIN_PK, E.cu + E.ru * a, E.cv + E.rv * c);
        if (!pv) return 0;
        if (b < 0) return cFINU;
        const d = pv >> 3;
        if (d < LW8) return glow && d < 0.45 * LW8 ? cCORE : cRED;
        return FB[(pv >> 1) & 3];
      }, (a, b, c) => (pk(FIN_PK, E.cu + E.ru * a, E.cv + E.rv * c) ? cFinEdge : 0), 1, E.ru));
      // claws
      CLAWS.forEach((c, k) => {
        const ca = Math.cos(c.a), sa = Math.sin(c.a);
        const cu = V3.add(V3.scale(u, ca), V3.scale(v, sa));
        const cv = V3.add(V3.scale(u, -sa), V3.scale(v, ca));
        const ctr = V3.add(V3.add(V3.scale(u, c.u), V3.scale(v, c.v)), V3.add(V3.scale(cu, 16), V3.scale(w, -3)));
        const cClawEdge = code(CLAW, -1), CB = [code(CLAW, -1), code(CLAW, 0), code(CLAW, 1)];
        prims.push(clipped(shell(fr, ctr, cu, w, cv, [CLAW_E.ru, CLAW_E.rw, CLAW_E.rv], { part: 12 + k + (sd < 0 ? 4 : 0), grp: 7 + (sd < 0 ? 1 : 0), mat: null }), (a, b, c) => {
          const pv = pk(CLAW_PK, CLAW_E.ru * a, CLAW_E.rv * c);
          if (!pv) return 0;
          return b < 0 ? cClawEdge : CB[(pv >> 1) & 3];
        }, (a, b, c) => (pk(CLAW_PK, CLAW_E.ru * a, CLAW_E.rv * c) ? cClawEdge : 0), 1, CLAW_E.ru));
      });
      finParts.push(fr);
    }

    // --- tail streamers: vertical fan of four ribbons (upper hooked pair, lower pair)
    const tailFin = (parentF, rootP, pitch, splay, segs, gid, partBase) => {
      const base = chain(parentF, T(...rootP), R(M3.ry(splay)), R(M3.rz(pitch)));
      let fr = chain(base, R(M3.rz(0.1 * Math.sin(ph - 1.4))));
      segs.forEach((sg, k) => {
        if (k > 0) fr = chain(fr, pivot([sg.j[0], sg.j[1], 0], M3.rz(0.14 * Math.sin(ph - 2.1 - k * 0.5))));
        const E = sg.e;
        // fin space: u back (-x), v up (+y), w = z
        const cTailEdge = code(TAILF), TB = [code(TAILF, -1), code(TAILF, 0), code(TAILF, 1)];
        prims.push(clipped(shell(fr, [-E.cu, E.cv, 0], [-1, 0, 0], [0, 0, 1], [0, 1, 0], [E.ru, E.rw, E.rv], { part: partBase + k, grp: gid, mat: null }), (a, b, c) => {
          const pv = pk(E.pk, E.cu + E.ru * a, E.cv + E.rv * c);
          return pv ? TB[(pv >> 1) & 3] : 0;
        }, (a, b, c) => (pk(E.pk, E.cu + E.ru * a, E.cv + E.rv * c) ? cTailEdge : 0), 1, E.ru));
      });
      return fr;
    };
    const upSeg = [{ e: UP_A }, { e: UP_B, j: [-40, 76] }];
    const loSeg = [{ e: LO_A }, { e: LO_B, j: [-120, -6] }];
    tailFin(stockF, [-100, 134, 8], 0.1, 0.2, upSeg, 9, 20);
    tailFin(stockF, [-106, 132, -8], -0.12, -0.2, upSeg, 10, 22);
    const loN = tailFin(stockF, [-150, 114, 6], 0.03, 0.18, loSeg, 11, 24);
    tailFin(stockF, [-150, 110, -6], 0.22, -0.18, loSeg, 12, 26);

    // --- anchors
    const eyeS = (() => {
      const t = HEAD.tilt, dx = EYE.x - HEAD.c[0], dy = EYE.y - HEAD.c[1];
      const lx = dx * Math.cos(t) + dy * Math.sin(t), ly = -dx * Math.sin(t) + dy * Math.cos(t);
      const s0 = lx / HEAD.r[0], s1 = ly / HEAD.r[1];
      return [s0, s1, Math.sqrt(Math.max(0, 1 - s0 * s0 - s1 * s1))];
    })();
    const anchors = {
      eye: { p: V3.add(headPrim.c, M3.v(headPrim.L, eyeS)), s: eyeS },
      mouth: V3.scale(V3.add(V3.add(headF.t, M3.v(headF.L, [394, 70, 0])), V3.add(jawF.t, M3.v(jawF.L, [392, 66, 0]))), 0.5),
      finTipN: V3.add(finParts[0].t, M3.v(finParts[0].L, [-280, 0, 0])),
      finTipF: V3.add(finParts[1].t, M3.v(finParts[1].L, [-280, 0, 0])),
      tail: V3.add(loN.t, M3.v(loN.L, [-250, -6, 0])),
      head: V3.add(headF.t, M3.v(headF.L, [300, 110, 0])),
    };
    return {
      autoSide: !pose || pose.side === undefined,
      prims, anchors, pose: P, headPrim, stamps: [], dots: [],
      pri: { 1: 1, 2: 2, 3: 0, 4: 2, 5: 3, 6: 3, 7: 2, 8: 2, 9: 2, 10: 2, 11: 2, 12: 2 },
      glossy: GLOSSY, baseMat: BODY, shadowSteps: 0,
    };
  }

  // Render into a tight buffer around the model's projected bounds (same bbox maths as the
  // renderer, so the pixels are identical), then place it in the full sprite buffer. The shared
  // renderer's full-buffer passes then only touch pixels near Kyogre, not the whole big buffer.
  function render(model, opt) {
    // `side` mirrors the camera cheats; when the caller did not pass it, derive it from the yaw
    // exactly like the game does (side = clamp(3 cos yaw, -1, 1)) and rebuild if it differs
    if (model.autoSide) {
      const sd = Math.max(-1, Math.min(1, 3 * Math.cos(opt.yaw ?? 1.05)));
      if (Math.abs(sd - model.pose.side) > 1e-6) model = build(Object.assign({}, model.pose, { side: sd }));
    }
    const sc = opt.scale || 1;
    LWH = 0.5 * Math.max(5.4, 1.7 / sc) * (1 + 0.3 * Math.min(1, model.pose.glow || 0));
    LW8 = LWH * 8;

        const f = chain(root, T(0 - k * 3, 39, 8.5 * sd), R(M3.ry(sd * (0.42 + 0.12 * k))), R(M3.rx(sd * 0.22)), R(M3.rz(Math.PI / 2 + b.a - 0.12 * roar)));

        const bl = { kind: 'ell', part: 12 + k + (sd < 0 ? 3 : 0), grp: 12 + (sd < 0 ? 1 : 0), c: pt(f, [B.cu, 0, 0]), L: M3.mul(f.L, M3.cols([B.ru, 0, 0], [0, 0, B.rw], [0, B.rv, 0])), mat: null };
        prims.push(clipped(bl, (a, bb, c) => {
          const uu = B.cu + B.ru * a, vv = B.rv * c;
          if (!at(B.g, uu, vv, 0)) return 0;
          return code(SILVER, vv > W * 0.18 ? 1 : vv < -W * 0.25 ? -1 : 0);
        }, (a, bb, c) => (at(B.g, B.cu + B.ru * a, B.rv * c, 0) ? cSILVER : 0), 1, B.ru));
      });
    }

    // --- chest shield + gem (faces forward)
    const chestF = chain(root, T(13, 28, 0), R(M3.rz(0.22)));
    const shield = { kind: 'ell', part: 16, grp: 16, c: chestF.t, L: M3.mul(chestF.L, M3.cols([SHIELD_E.ru, 0, 0], [0, SHIELD_E.rv, 0], [0, 0, SHIELD_E.rw])), mat: (s) => (s[0] < 0 || !at(SHIELD_G, SHIELD_E.rw * s[2], SHIELD_E.rv * s[1], 0) ? 0 : code(SILVER, s[0] < 0.45 || SHIELD_E.rv * s[1] > 10.5 ? -1 : 0)) };
    prims.push(shield);
    const gemF = chain(chestF, T(SHIELD_E.ru + 0.4, 1, 0), R(M3.cols([0, 0, 1], [0, 1, 0], [-1, 0, 0])));
    prims.push(plate(gemF, gemShape, { part: 17, grp: 17, thick: 1 }));
    if (P.gem > 0.3) prims.push(plate(chain(gemF, T(0, 0, 0.3)), haloShape, { part: 18, grp: 16, thick: 1 }));

    // --- head (pitch/yaw at the neck; roar lifts it)
    const headF = chain(root, pivot([8, 46, 0], M3.mul(M3.rz(P.headPitch + 0.32 * roar), M3.ry(P.headYaw))));
    const cranium = navy(headF, [12, 62, 0], [18.5, 17, 18], 20, 20, 0, (s) => {
      // silver visor band across the brow (front half only)
      if (s[0] > 0.12 && s[1] > -0.24 + 0.1 * s[0] && s[1] < 0.06 + 0.1 * s[0]) return cSILVER;
      // ridge from the visor up the forehead to the crest
      if (s[0] > 0.3 && s[1] > 0 && Math.abs(s[2]) < 0.1 + 0.06 * s[1]) return cSILVER;
      return 0;
    });
    prims.push(cranium);
    // upper jaw / snout
    prims.push(navy(headF, [27, 55.5, 0], [11, 8, 10.5], 21, 20, 0, (s) => (s[1] > 0.55 && Math.abs(s[2]) < 0.55 ? cSILVER : 0)));
    // lower jaw
    const jawF = chain(headF, pivot([14, 52, 0], M3.rz(-0.68 * mouth)));
    prims.push(ell(chain(jawF, T(24, 49.5, 0)), [9.5, 4, 8.2], { part: 22, grp: 21, mat: (s) => (s[1] < -0.2 ? cSILVER : cBODY) }));
    // mouth interior: rides halfway down with the jaw and grows with the opening
    if (mouth > 0.03) prims.push(ell(chain(headF, pivot([14, 52, 0], M3.rz(-0.34 * mouth)), T(24.5, 50.5, 0)), [9.4, 2 + 3.4 * mouth, 7.4], { part: 23, grp: 22, mat: (s) => (s[1] < -0.1 && Math.abs(s[2]) < 0.62 && s[0] > -0.6 ? code(TONGUE) : code(MOUTH)) }));
    // fangs
    for (const sd of [1, -1]) prims.push(plate(chain(headF, T(33, 50.6, 4.2 * sd), R(M3.ry(-sd * 0.9))), FANGS, { part: 24, grp: 23, thick: 1 }));
    // crest (raised by the roar)
    const crestF = chain(headF, pivot([8, 76, 0], M3.mul(M3.ry(0.3 * (P.side ?? 1)), M3.rz(-0.42 * roar))));
    // crest: clipped thin shell (crisp fin outline; chord fallback keeps it solid head-on)
    const CE = CREST_E;
    prims.push(clipped(ell(chain(crestF, T(CE.cx, CE.cy, 0)), [CE.rx, CE.ry, CE.rz], { part: 25, grp: 24, mat: null }), (a, b, c) => {
      const X = CE.cx + CE.rx * a, Y = CE.cy + CE.ry * b;
      if (!at(CREST_G, X, Y, 0)) return 0;
      if (Math.abs(c) > 0.3 && at(CREST_LN, X, Y, 99) < 0.85) return cCYAN;
      return code(SILVER, bevel(CREST_G, X, Y, 1.1, 1.5));
    }, (a, b) => (at(CREST_G, CE.cx + CE.rx * a, CE.cy + CE.ry * b, 0) ? cSILVER : 0), 2, CE.rx));

    // --- anchors + eye stamps
    const eyeS = (az, v) => { const c = Math.sqrt(1 - v * v); return [c * Math.cos(az), v, c * Math.sin(az)]; };
    const eN = eyeS(0.62, -0.1), eF = eyeS(-0.62, -0.1);
    const anchors = {
      gem: pt(gemF, [0, 0, 0]),
      mouth: V3.scale(V3.add(pt(headF, [35, 51.5, 0]), pt(jawF, [32.5, 51.5, 0])), 0.5),
      top: pt(crestF, [-23, 95.5, 0]),
      head: pt(headF, [12, 62, 0]),
      eyeN: { p: V3.add(cranium.c, M3.v(cranium.L, eN)), s: eN },
      eyeF: { p: V3.add(cranium.c, M3.v(cranium.L, eF)), s: eF },
    };
    return {
      autoSide: !pose || pose.side === undefined,
      prims, anchors, pose: P,
      stamps: [
        { at: Object.assign({ prim: cranium }, anchors.eyeN), set: EYES, colors: EYEC, kind: P.eyes },
        { at: Object.assign({ prim: cranium }, anchors.eyeF), set: EYES, colors: EYEC, kind: P.eyes, flipX: true },
      ],
      dots: [],
      pri: { 1: 0, 5: 2, 6: 1, 7: 1, 8: 1, 9: 1, 10: 2, 11: 2, 12: 3, 13: 3, 16: 2, 17: 3, 20: 1, 21: 2, 22: 0, 23: 3, 24: 3 },
      glossy: GLOSSY, baseMat: BODY, shadowSteps: 0, // contact shadows are baked (cheaper first renders)
    };
  }

  // Render into a tight buffer around the model's projected bounds (same bbox maths as the
  // renderer, so pixels are identical), then place it in the full sprite buffer.
  function render(model, opt) {
    // `side` mirrors the camera cheats; when the caller did not pass it, derive it from the yaw
    // exactly like the game does (side = clamp(3 cos yaw, -1, 1)) and rebuild if it differs
    if (model.autoSide) {
      const sd = Math.max(-1, Math.min(1, 3 * Math.cos(opt.yaw ?? 1.05)));
      if (Math.abs(sd - model.pose.side) > 1e-6) model = build(Object.assign({}, model.pose, { side: sd }));
    }
    const sc = opt.scale || 1;
    LWH = 0.5 * Math.max(1.7, 1.25 / sc);
    const set = sc >= 1.5 ? EYES_L : EYES;
    for (const st of model.stamps) st.set = set;
    let pal = opt.pal || PAL;
    const g = Math.min(1, model.pose.gem || 0);
    if (g > 0) {
      const e = pal[GEM];
      pal = Object.assign({}, pal, { [GEM]: { r: e.r.map((c, i) => PX.mix(c, GEM_GLOW[i], g)), od: e.od, ol: PX.mix(e.ol, GEM_GLOW[1], g * 0.5), ln: PX.mix(e.ln, GEM_GLOW[0], g * 0.6) } });
    }
    const { yaw = 1.05, pitch = 0.16, W = 96, H = 96, ox = 48, oy = 82 } = opt;
    const V = M3.mul(M3.rx(pitch), M3.mul(M3.ry(-yaw), M3.diag(sc, sc, sc)));
    // nearest primitives first: hidden pixels then fail the depth test before any mat() call
    // (draw order only affects overdraw, not the image)
    const zs = new Map();
    for (const p of model.prims) zs.set(p, V[6] * p.c[0] + V[7] * p.c[1] + V[8] * p.c[2]);
    model.prims.sort((a, b) => zs.get(b) - zs.get(a));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const grow = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
    for (const p of model.prims) {
      const cv = M3.v(V, p.c), Lv = M3.mul(V, p.L);
      if (p.kind === 'ell') {
        const rx = Math.hypot(Lv[0], Lv[1], Lv[2]), ry = Math.hypot(Lv[3], Lv[4], Lv[5]);
        grow(ox + cv[0] - rx, oy - cv[1] - ry); grow(ox + cv[0] + rx, oy - cv[1] + ry);
      } else {
        const [a, b, c, d] = p.shape.bb;
        for (const [u, v] of [[a, b], [a, d], [c, b], [c, d]]) for (const w of [-p.thick, p.thick]) {
          const q = V3.add(cv, M3.v(Lv, [u, v, w]));
          grow(ox + q[0], oy - q[1]);
        }
      }
    }
    const X0 = Math.max(0, Math.floor(x0) - 3), Y0 = Math.max(0, Math.floor(y0) - 3);
    const X1 = Math.min(W - 1, Math.ceil(x1) + 3), Y1 = Math.min(H - 1, Math.ceil(y1) + 3);
    if (X1 < X0 || Y1 < Y0) return Creature.render(model, Object.assign({}, opt, { pal }));
    const w = X1 - X0 + 1, h = Y1 - Y0 + 1;
    const r = Creature.render(model, Object.assign({}, opt, { pal, W: w, H: h, ox: ox - X0, oy: oy - Y0 }));
    const buf = new PX.Buf(W, H), depth = new Float32Array(W * H).fill(-1e9), part = new Uint8Array(W * H);
    for (let y = 0; y < h; y++) {
      const src = y * w, dst = (y + Y0) * W + X0;
      buf.d.set(r.buf.d.subarray(src, src + w), dst);
      depth.set(r.depth.subarray(src, src + w), dst);
      part.set(r.part.subarray(src, src + w), dst);
    }
    const anchors = {};
    for (const k in r.anchors) { const a = r.anchors[k]; anchors[k] = [a[0] + X0, a[1] + Y0, a[2]]; }
    return { buf, depth, part, W, H, ox, oy, anchors };
  }

  // heightM is the chibi's rendered height (~95 units); the Pokédex height is 5.4 m
  return { build, render, PAL, MAT, DEFAULT, meta: { heightM: 0.54, pokedexM: 5.4, bw: 120, bh: 140, oy: 0.85 } };
})();

/* ------------------------------------------------------------------
   World — layout of the island cross-section and the five hours.
   World units are art pixels at zoom 1. y grows downward.
------------------------------------------------------------------- */
const World = (() => {
  const W = 3600, H = 1320;
  const SEA = 560;       // still-water level
  const HORIZON = 468;   // far horizon line of the backdrop sea

  // terrain profile (x, ground y) — dunes, beach, reef slope, deep trench
  const GP = [
    [-40, 500], [120, 497], [300, 506], [470, 522], [700, 536], [920, 548], [1080, 556], [1180, 566],
    [1330, 596], [1500, 650], [1700, 740], [1900, 812], [2100, 842], [2320, 850], [2520, 856], [2640, 884],
    [2740, 990], [2880, 1150], [3100, 1206], [3400, 1214], [3660, 1216],
  ];
  const ground = new Float32Array(W + 2);
  (() => {
    const pts = GP;
    let k = 0;
    for (let x = 0; x <= W + 1; x++) {
      while (k < pts.length - 2 && x > pts[k + 1][0]) k++;
      const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(pts.length - 1, k + 2)];
      const t = (x - p1[0]) / (p2[0] - p1[0]);
      const t2 = t * t, t3 = t2 * t;
      ground[x] = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
    }
  })();
  let shoreX = 0;
  for (let x = 0; x < W; x++) if (ground[x] >= SEA) { shoreX = x; break; }
  const groundAt = (x) => {
    if (x <= 0) return ground[0];
    if (x >= W) return ground[W];
    const i = Math.floor(x), f = x - i;
    return ground[i] * (1 - f) + ground[i + 1] * f;
  };
  const slopeAt = (x) => groundAt(x + 2) - groundAt(x - 2);

  // placements
  const PALMS = [{ x: 150, h: 430, lean: -0.18, seed: 3 }, { x: 402, h: 470, lean: 0.12, seed: 8 }, { x: 668, h: 400, lean: -0.08, seed: 14 }];
  const BEACH_ROCKS = [
    { x: 842, w: 58, h: 34, seed: 1 }, { x: 896, w: 92, h: 56, seed: 2 }, { x: 962, w: 50, h: 30, seed: 3 },
    { x: 1004, w: 70, h: 42, seed: 4 }, { x: 790, w: 40, h: 24, seed: 5 },
  ];
  const WALREIN_ROCK = { x: 1262, w: 190, h: 112, seed: 6 };
  const REEF_ROCKS = [{ x: 1668, w: 110, h: 70, seed: 7 }, { x: 2360, w: 140, h: 80, seed: 8 }, { x: 2580, w: 90, h: 60, seed: 9 }];
  const PIER = { x0: 1360, x1: 1880, deck: 496, posts: [1380, 1470, 1560, 1650, 1740, 1830, 1872] };

  return { W, H, SEA, HORIZON, ground, groundAt, slopeAt, shoreX, PALMS, BEACH_ROCKS, WALREIN_ROCK, REEF_ROCKS, PIER };
})();

  /* ---- animated kelp strand ---- */

        fb.ellipse(X + 0.5, Y + 0.5, b.r + 0.6, b.r * 0.7 + 0.6, pal[I.ROL]);
        fb.ellipse(X + 0.5, Y + 0.5, b.r, b.r * 0.7, pal[I.ROCK + 2 + (b.seed % 2)]);
        fb.set(X - 1, Y - 1, pal[I.ROCK + 4]);
      } else if (b.kind === 'shell') {
        for (const [dx, dy] of [[-2, 0], [-1, -1], [0, -1], [1, -1], [2, 0], [-1, 0], [0, 0], [1, 0], [0, 1]]) fb.set(X + dx, Y + dy, pal[I.SHELL]);
        fb.set(X, Y - 1, pal[I.WHITE]);
      } else if (b.kind === 'helix' || b.kind === 'dome') {
        // fossils: a spiral shell and a domed shell, set in a pale stone
        fb.ellipse(X + 0.5, Y + 0.5, 15, 12, pal[I.SOL]);
        fb.ellipse(X + 0.5, Y + 0.5, 14, 11, pal[I.SAND + 1]);
        if (b.kind === 'helix') {
          for (let a = 0; a < 16; a += 0.05) {
            const rr = 1 + a * 0.62;
            fb.set(Math.round(X + Math.cos(a) * rr), Math.round(Y + Math.sin(a) * rr * 0.85), pal[a > 14 ? I.ROL : I.ROCK + 1]);
          }
        } else {
          fb.ellipse(X + 0.5, Y + 2.5, 9, 7, pal[I.ROCK + 1]);
          fb.ellipse(X + 0.5, Y + 3.5, 7, 5, pal[I.ROCK + 2]);
          for (let x = -8; x <= 8; x++) fb.set(X + x, Y + 5, pal[I.ROL]);
          fb.set(X - 3, Y + 3, pal[I.ROL]); fb.set(X + 3, Y + 3, pal[I.ROL]);
        }
        if (b.shine > 0) { b.shine -= 1 / 60; if ((Math.floor(t * 10) & 1) === 0) Scenery.star(fb, X + 8, Y - 8, 2, PX.hex('#ffffff'), PX.hex('#ffe066')); }
      } else if (b.kind === 'bottle') {
        for (let y = -10; y <= 8; y++) for (let x = -4; x <= 4; x++) {
          const neck = y < -4;
          if (neck && Math.abs(x) > 1) continue;
          if (!neck && x * x / 16 + (y - 2) * (y - 2) / 64 > 1.05) continue;
          fb.set(X + x, Y + y, Math.abs(x) >= (neck ? 1 : 3) ? pal[I.INK] : x < 0 ? pal[I.GLASS] : pal[I.WHITE]);
        }
        fb.set(X, Y - 11, pal[I.WOOD + 2]); fb.set(X, Y - 12, pal[I.WOOD + 3]);
        for (let y = 0; y < 5; y++) fb.set(X - 1 + (y & 1), Y + y, pal[I.SAND + 3]);
        if (b.shine > 0) { b.shine -= 1 / 60; if ((Math.floor(t * 10) & 1) === 0) Scenery.star(fb, X + 6, Y - 12, 2, PX.hex('#ffffff'), PX.hex('#9fe8ff')); }
      }
    }
  }
  function pokeBuried(wx, wy) {
    for (const b of S.buried) {
      if (b.kind !== 'helix' && b.kind !== 'dome' && b.kind !== 'bottle') continue;
      if (Math.hypot(wx - b.x, wy - b.y) < 16) { b.shine = 1.2; return b; }
    }
    return null;
  }

  function drawCastleRubble(fb, cx, cy, P, pal) {
    const gy = World.groundAt(S.castle.x);
    for (let x = -34; x <= 34; x++) {
      const h = Math.round((1 - Math.abs(x) / 34) * 12 * (1 - S.castleHP) + 2 + (hash2(x, 3, 3) * 3));
      for (let y = 0; y < h; y++) fb.set(S.castle.x + x - cx, Math.round(gy) - y - cy, pal[I.SAND + (y === h - 1 ? 3 : 2)]);
    }
  }

  // items layer (coconuts etc.) — drawn with creatures
  function drawItems(fb, cx, cy, P, t) {
    for (const c of S.coconuts) {
      if (c.state === 'gone' || c.state === 'held' || c.state === 'tree') continue;
      if (c.x - cx < -20 || c.x - cx > fb.w + 20 || c.y - cy < -20 || c.y - cy > fb.h + 20) continue;
      drawCoconut(fb, cx, cy, c, P, t);
    }
  }

  // front layer: palm crowns and dune grass
  function drawFront(fb, cx, cy, P, t) {
    const pal = Props.palette(P);
    for (const p of S.palms) {
      const f = Math.floor(t * 2.4 + p.seed) % p.m.frames.length;
      const fx = Math.round(p.gx + p.m.crownX - p.m.bx - p.m.ccx) - cx + Math.round(Math.sin(p.shake * 40) * p.shake * 10);
      const fy = Math.round(p.gy + p.m.crownY - p.m.by - p.m.ccy + 4) - cy;
      if (fx < fb.w && fx + 360 > 0 && fy < fb.h && fy + 250 > 0) Props.blit(fb, p.m.frames[f], fx, fy, pal);
    }
    // coconuts still on the palms hang in front of the fronds
    for (const c of S.coconuts) if (c.state === 'tree' && c.x - cx > -20 && c.x - cx < fb.w + 20 && c.y - cy > -20 && c.y - cy < fb.h + 20) drawCoconut(fb, cx, cy, c, P, t);
    for (const g of S.grass) if (g.x - cx > -30 && g.x - cx < fb.w + 30) Props.drawGrass(fb, cx, cy, g.x, World.groundAt(g.x) + 1, g.n, g.seed, t, P);
  }

  return { S, init, drawBack, drawItems, drawFront, drawCoconut, pokeBuried };
})();

/* ==== src/game/fx.js ==== */
/* ------------------------------------------------------------------
   FX — cartoon / anime effects in world space. No letters anywhere
   except Dialga's "yo" bubble.
------------------------------------------------------------------- */
const FX = (() => {
  const { hex, bayer4, hash2 } = PX;
  const C = {
    k: hex('#1a1c2c'), w: hex('#ffffff'), r: hex('#ff4a6a'), l: hex('#ffc2cf'), b: hex('#5ab8ff'), c: hex('#b8e8ff'),
    y: hex('#ffd83a'), o: hex('#ff9a2a'), g: hex('#8a8a9a'), p: hex('#c080ff'), a: hex('#e82a3a'), n: hex('#2a2c48'),
  };
  const ICON = {
    heart: ['.rr.rr.', 'rlrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'],
    note: ['...kk', '..kkk', '..k.k', '..k..', '.kk..', 'kkk..', '.k...'],
    sweat: ['.b..', '.bb.', 'bcbb', 'bcbb', 'bbbb', '.bb.'],
    anger: ['aa.aa', 'a...a', '.....', 'a...a', 'aa.aa'],
    swirl: ['.kkkk..', 'k....k.', 'k.kk..k', 'k.k.k.k', 'k..k..k', '.k...k.', '..kkk..'],
    bulb: ['..yyy..', '.yyyyy.', 'yywyyyy', 'yyyyyyy', '.yyyyy.', '..yyy..', '..ggg..', '..ggg..'],
    star: ['...y...', '...y...', 'yyyyyyy', '.yyyyy.', '..yyy..', '.yy.yy.', 'yy...yy'],
    drop: ['..b..', '.bcb.', 'bccbb', 'bcbbb', '.bbb.'],
    shock: ['y...y...y', '.y..y..y.', '..y.y.y..', '.........', 'yyy...yyy', '.........', '..y.y.y..', '.y..y..y.', 'y...y...y'],
    tear: ['.b.', 'bcb', 'bbb'],
    music2: ['..kkkk', '..k..k', '..k..k', '.kk.kk', 'kkkkkk', '.k..k.'],
    sparkle: ['...w...', '...w...', '..www..', 'wwwwwww', '..www..', '...w...', '...w...'],
  };
  const GLYPH = { y: ['k...k', 'k...k', '.k.k.', '..k..', '..k..', '.k...', 'k....'], o: ['.....', '.kkk.', 'k...k', 'k...k', 'k...k', 'k...k', '.kkk.'] };

  const list = [];
  const add = (p) => { list.push(Object.assign({ age: 0, life: 1, vx: 0, vy: 0, g: 0, layer: 1 }, p)); return p; };

  function stamp(fb, spr, x, y, cx, cy, fade = 0) {
    const w = spr[0].length;
    for (let r = 0; r < spr.length; r++)
      for (let c = 0; c < w; c++) {
        const ch = spr[r][c];
        if (ch === '.') continue;
        const X = Math.round(x) + c - cx, Y = Math.round(y) + r - cy;
        if (fade > 0 && bayer4(X, Y) < fade) continue;
        fb.set(X, Y, C[ch]);
      }
  }
  // emote bubble with a pictogram, following a getter for the anchor point
  function emote(icon, at, o = {}) {
    return add({ type: 'emote', icon, at, life: o.life ?? 1.6, layer: 3 });
  }
  function bubbleRect(fb, x, y, w, h, cx, cy, fade) {
    for (let yy = 0; yy < h; yy++)
      for (let xx = 0; xx < w; xx++) {
        const corner = (xx === 0 || xx === w - 1) && (yy === 0 || yy === h - 1);
        if (corner) continue;
        const edge = xx === 0 || yy === 0 || xx === w - 1 || yy === h - 1 || ((xx === 1 || xx === w - 2) && (yy === 1 || yy === h - 2) && false);
        const X = x + xx - cx, Y = y + yy - cy;
        if (fade > 0 && bayer4(X, Y) < fade) continue;
        fb.set(X, Y, edge ? C.k : C.w);
      }
    // tail
    for (let k = 0; k < 3; k++) { fb.set(x + 3 + k - cx, y + h + k - cy - 1, k === 2 ? C.k : C.w); fb.set(x + 2 + k - cx, y + h + k - cy - 1, C.k); fb.set(x + 4 + k - cx, y + h + k - cy - 1, C.k); }
  }

  function update(dt) {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.age += dt;
      if (p.delay) { p.delay -= dt; p.age -= dt; if (p.delay > 0) continue; p.delay = 0; }
      if (p.age >= p.life) { if (p.onDie) p.onDie(p); list.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.drag) { p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt); }
      if (p.floor !== undefined && p.vy > 0 && p.y >= p.floor) { if (p.onFloor) p.onFloor(p); list.splice(i, 1); }
      else if (p.ceil !== undefined && p.y <= p.ceil) { if (p.onCeil) p.onCeil(p); list.splice(i, 1); }
    }
  }

  function draw(fb, cx, cy, layer, t) {
    for (const p of list) {
      if (p.layer !== layer || p.delay > 0) continue;
      const k = p.age / p.life;
      const x = Math.round(p.x) - cx, y = Math.round(p.y) - cy;
      if (p.type !== 'emote' && p.type !== 'say' && (x < -40 || y < -40 || x > fb.w + 40 || y > fb.h + 40)) continue;
      switch (p.type) {
        case 'drop': fb.set(x, y, p.c); if (p.size > 1) fb.set(x, y - Math.sign(p.vy || 1), p.c2 || p.c); break;
        case 'bubble': {
          const r = p.r || 1.5;
          if (r < 1.2) { fb.set(x, y, p.c); break; }
          fb.ring(x + 0.5, y + 0.5, r, r, p.c);
          fb.set(x - 1, y - 1, C.w);
          break;
        }
        case 'ripple': {
          const rx = p.r0 + (p.r1 - p.r0) * (1 - (1 - k) * (1 - k)), ry = rx * (p.flat || 0.3);
          fb.ring(x, y, rx, ry, p.c, (X, Y, a) => (k < 0.4 || bayer4(X, Y) > (k - 0.4) * 1.6) && (Math.sin(a) > -0.2 || (X + Y) % 2 === 0));
          break;
        }
        case 'spark': {
          const s = Math.round(Math.sin(k * Math.PI) * p.size);
          if (s <= 0) fb.set(x, y, p.c2 || p.c); else Scenery.star(fb, x, y, s, p.c, p.c2);
          break;
        }
        case 'burst': {
          // comic impact star: spiky polygon, white core, yellow rim, radial ticks
          const R = p.r * (0.6 + Math.sin(Math.min(1, k * 2.2) * Math.PI / 2) * 0.6);
          const spikes = p.spikes || 8;
          for (let yy = -R - 2; yy <= R + 2; yy++)
            for (let xx = -R - 2; xx <= R + 2; xx++) {
              const a = Math.atan2(yy, xx), d = Math.hypot(xx, yy);
              const rr = R * (0.62 + 0.38 * Math.abs(Math.cos((a * spikes) / 2)));
              if (d > rr) continue;
              if (k > 0.55 && bayer4(x + xx, y + yy) < (k - 0.55) * 2.2) continue;
              fb.set(x + xx, y + yy, d > rr - 1.5 ? C.o : d > rr * 0.55 ? C.y : C.w);
            }
          break;
        }
        case 'dust': {
          const r = p.r * (0.5 + k * 0.9);
          for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) {
            if (xx * xx + yy * yy > r * r) continue;
            if (bayer4(x + xx, y + yy) < k * 1.1) continue;
            fb.set(x + xx, y + yy, xx + yy < -r * 0.3 ? p.c2 || p.c : p.c);
          }
          break;
        }
        case 'ring': {
          const r = p.r0 + (p.r1 - p.r0) * Math.sin(k * Math.PI / 2);
          fb.ring(x, y, r, r * (p.flat || 1), p.c, (X, Y) => bayer4(X, Y) > k * 0.9);
          if (p.thick) fb.ring(x, y, r - 1, (r - 1) * (p.flat || 1), p.c2 || p.c, (X, Y) => bayer4(X, Y) > k);
          break;
        }
        case 'icon': stamp(fb, ICON[p.icon], p.x - ICON[p.icon][0].length / 2, p.y, cx, cy, k > 0.6 ? (k - 0.6) * 2.4 : 0); break;
        case 'confetti': {
          const c = p.c;
          const flip = Math.sin(p.age * 12 + p.ph) > 0;
          fb.set(x, y, c); if (flip) fb.set(x + 1, y, c); else fb.set(x, y + 1, c);
          break;
        }
        case 'speed': {
          const len = p.len * (1 - k);
          for (let j = 0; j < len; j++) if (bayer4(x - j * p.dx, y) > k) fb.set(x - Math.round(j * p.dx), y - Math.round(j * p.dy), p.c);
          break;
        }
        case 'dizzy': {
          const o = p.at();
          for (let s = 0; s < 3; s++) {
            const a = p.age * 5 + (s * Math.PI * 2) / 3;
            const sx = Math.round(o[0] + Math.cos(a) * p.rx) - cx, sy = Math.round(o[1] + Math.sin(a) * p.rx * 0.35) - cy;
            if (Math.sin(a) < 0 && (s + Math.floor(p.age * 10)) % 2) continue;
            Scenery.star(fb, sx, sy, 1, C.y, C.o);
          }
          break;
        }
        case 'emote': {
          const o = p.at();
          const pop = k < 0.12 ? Math.round((1 - k / 0.12) * 4) : 0;
          const bx = Math.round(o[0]) + 4, by = Math.round(o[1]) - 16 - pop;
          const ic = ICON[p.icon];
          const w = Math.max(11, ic[0].length + 6), h = Math.max(10, ic.length + 5);
          const fade = k > 0.82 ? (k - 0.82) * 5 : 0;
          bubbleRect(fb, bx, by, w, h, cx, cy, fade);
          stamp(fb, ic, bx + Math.floor((w - ic[0].length) / 2), by + Math.floor((h - ic.length) / 2), cx, cy, fade);
          break;
        }
        case 'say': {
          // Dialga's speech bubble: the only words in the game
          const o = p.at();
          const pop = k < 0.1 ? Math.round((1 - k / 0.1) * 6) : 0;
          const wob = Math.round(Math.sin(p.age * 9) * (k < 0.3 ? 1 : 0));
          const bx = Math.round(o[0]) + 6, by = Math.round(o[1]) - 24 - pop + wob;
          const w = 21, h = 14;
          const fade = k > 0.85 ? (k - 0.85) * 6 : 0;
          bubbleRect(fb, bx, by, w, h, cx, cy, fade);
          stamp(fb, GLYPH.y, bx + 4, by + 3, cx, cy, fade);
          stamp(fb, GLYPH.o, bx + 11, by + 3, cx, cy, fade);
          break;
        }
        case 'fn': p.draw(fb, p, k, cx, cy, t); break;
      }
    }
  }

  /* ---- composite effects ---- */
  function splashAt(x, y, o = {}) {
    const power = o.power ?? 1, n = o.n ?? 16;
    const c = o.c ?? C.w, c2 = o.c2 ?? hex('#8fd6ee');
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      add({ type: 'drop', x: x + Math.cos(a) * 5, y: y - 1, vx: Math.cos(a) * (30 + Math.random() * 50) * power, vy: -(70 + Math.random() * 110) * power, g: 430, life: 2, c, c2, size: Math.random() < 0.5 ? 2 : 1, floor: y + 2, layer: 2,
        onFloor: (p) => add({ type: 'ripple', x: p.x, y: y + 1, r0: 0.5, r1: 3, flat: 0.35, life: 0.4, c: o.ring ?? hex('#e8fbff'), layer: 2 }) });
    }
    for (let i = 0; i < 10 * power; i++) {
      const side = i % 2 ? 1 : -1, a = -Math.PI / 2 + side * (0.25 + Math.random() * 0.4);
      const sp = (120 + Math.random() * 90) * power;
      add({ type: 'drop', x: x + side * (4 + Math.random() * 6), y: y - 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 560, life: 2, c, c2, size: 2, floor: y + 2, layer: 2 });
    }
    add({ type: 'ripple', x, y: y + 1, r0: 6, r1: 30 * power, flat: 0.3, life: 1.1, c: o.ring ?? hex('#e8fbff'), layer: 2 });
    add({ type: 'ripple', x, y: y + 1, r0: 3, r1: 16 * power, flat: 0.3, life: 0.8, c: o.ring ?? hex('#e8fbff'), layer: 2 });
  }
  function bonk(x, y, r = 9) {
    add({ type: 'burst', x, y, r, life: 0.32, layer: 3 });
    for (let i = 0; i < 6; i++) { const a = Math.random() * 6.28; add({ type: 'speed', x: x + Math.cos(a) * r * 1.4, y: y + Math.sin(a) * r * 1.4, dx: -Math.cos(a), dy: -Math.sin(a), len: 6, life: 0.25, c: C.w, layer: 3 }); }
  }
  function poof(x, y, c, c2, n = 6, r = 5) {
    for (let i = 0; i < n; i++) add({ type: 'dust', x: x + (Math.random() - 0.5) * r * 3, y: y - Math.random() * r, vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 20, r: r * (0.6 + Math.random() * 0.6), life: 0.5 + Math.random() * 0.3, c, c2, layer: 2 });
  }
  function sparkles(x, y, n = 6, spread = 24, c = C.w, c2 = C.y) {
    for (let i = 0; i < n; i++) add({ type: 'spark', x: x + (Math.random() - 0.5) * spread, y: y + (Math.random() - 0.5) * spread * 0.8, size: 1 + Math.floor(Math.random() * 3), life: 0.45 + Math.random() * 0.4, c, c2, layer: 3 });
  }
  function floatIcon(icon, x, y, o = {}) { return add({ type: 'icon', icon, x, y, vx: (Math.random() - 0.5) * 10, vy: -18, life: o.life ?? 1.2, layer: 3 }); }
  function confetti(x, y, n = 40) {
    const cols = [C.r, C.y, C.b, C.p, C.o, hex('#6aff8a')];
    for (let i = 0; i < n; i++) add({ type: 'confetti', x, y, vx: (Math.random() - 0.5) * 220, vy: -120 - Math.random() * 160, g: 260, drag: 0.35, life: 2.2 + Math.random(), c: cols[i % cols.length], ph: Math.random() * 6, layer: 3 });
  }
  function bubbles(x, y, n = 5, ceil) {
    for (let i = 0; i < n; i++) add({ type: 'bubble', x: x + (Math.random() - 0.5) * 8, y: y - Math.random() * 6, vx: (Math.random() - 0.5) * 6, vy: -20 - Math.random() * 25, r: Math.random() < 0.4 ? 2.5 : 1, life: 4, c: hex('#e0faff'), ceil, layer: 2 });
  }
  function say(at, life = 2.6) { return add({ type: 'say', at, life, layer: 4 }); }

  return { list, add, update, draw, emote, splashAt, bonk, poof, sparkles, floatIcon, confetti, bubbles, say, ICON, C, stamp };
})();

/* ==== src/game/critters.js ==== */
/* ------------------------------------------------------------------
   Critters — living things in the world. A Critter wraps a species
   model (Mudkip, Spheal, …): pose → cached, time-graded, cropped
   sprite; world placement; pixel-exact hit tests; anchors.
------------------------------------------------------------------- */
const Critters = (() => {
  const { clamp, lerp } = Scenery;

  /* ---- global sprite cache (LRU by bytes) ---- */
  const cache = new Map();
  let bytes = 0;
  const BUDGET = ((typeof navigator !== 'undefined' && navigator.deviceMemory) || 8) >= 4 ? 110 * 1024 * 1024 : 50 * 1024 * 1024;
  function cacheGet(k) {
    const s = cache.get(k);
    if (s) { cache.delete(k); cache.set(k, s); }
    return s;
  }
  function cachePut(k, s) {
    cache.set(k, s);
    bytes += s.bytes;
    while (bytes > BUDGET && cache.size > 1) {
      const [ok, ov] = cache.entries().next().value;
      cache.delete(ok);
      bytes -= ov.bytes;
    }
  }
  function dropTime(key) {
    for (const [k, v] of cache) if (v.time === key) { cache.delete(k); bytes -= v.bytes; }
  }

  /* ---- per-frame render budget: new poses wait if a frame is already busy ---- */
  const Budget = { left: 14, reset(ms = 14) { this.left = ms; }, warm: false };

  // crop a Creature render to its silhouette box (keeps blits and memory small)
  function crop(r, time) {
    const { buf } = r;
    const W = buf.w, H = buf.h, d = buf.d;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) if (d[row + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; y1 = y; }
    }
    if (x1 < 0) { x0 = y0 = 0; x1 = y1 = 0; }
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    const out = new Uint32Array(w * h);
    for (let y = 0; y < h; y++) out.set(d.subarray((y0 + y) * W + x0, (y0 + y) * W + x0 + w), y * w);
    return { d: out, w, h, x0, y0, anchors: r.anchors, bytes: w * h * 4 + 200, time };
  }

  /* ---- render workers: creature sprites are ray-cast off the main thread ---- */
  const Pool = {
    workers: [], ready: false, queue: new Map(), pending: new Set(), names: new Map(),
    init(src) {
      try {
        if (!src || typeof Worker === 'undefined') return;
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));

/* ==== src/game/life.js ==== */
/* ------------------------------------------------------------------
   Life — behaviours. Every creature runs a "brain": a generator that

const Life = (() => {
  const { clamp, lerp } = Scenery;

  }

    list() { return Scene.S.coconuts; },

    near(x, maxD, f = () => true) {

    bite(c) {
      if (!c.cracked) return false;

      for (let i = 0; i < 3; i++) FX.add({ type: 'drop', x: c.x + rnd(-6, 6), y: c.y - 4, vx: rnd(-40, 40), vy: rnd(-90, -30), g: 400, life: 0.8, c: PX.hex('#fbf6e6'), size: 1, floor: c.y + 5, layer: 2 });

    },
    update(dt, t) {
      const mons = Game.mons;
      for (const c of Scene.S.coconuts) {
        switch (c.state) {
          case 'tree': {
            const p = c.palm;
            c.x = p.gx + c.slot.dx + Math.sin(p.shake * 40) * p.shake * 9;
            c.y = p.gy + c.slot.dy + 4 + Math.sin(t * 2.4 + p.seed) * 1;
            if (c.regrow > 0) { c.regrow -= dt; }
            break;
          }
          case 'fall': case 'ground': {
            const g0 = gy(c.x);
            if (c.state === 'fall') {
              c.vy += 760 * dt;
              // someone who juggles might catch it on their nose
              let caught = false;
              if (c.vy > 60) for (const m of mons) if (m.catchNut && m.catchNut(c)) { caught = true; break; }
              if (caught) break;
              // bonk heads on the way down
              if (c.vy > 120) for (const m of mons) {
                if (!m.solid || !m.visible || m.mode === 'dive' || m === c.bonked) continue;
                const hp = m.headPt();
                if (Math.abs(hp[0] - c.x) < 14 + m.width() * 0.12 && c.y > hp[1] - 10 && c.y < hp[1] + 14) {
                  c.bonked = m; c.vy = -rnd(160, 220); c.vx = (c.x < m.x ? -1 : 1) * rnd(50, 90); c.w = c.vx * 0.1;
                  FX.bonk(c.x, hp[1] - 2, 10);
                  Game.sfx('bonk', c.x, 1);
                  m.onBonk(c);
                  break;
                }
              }
            } else {
              c.vx += World.slopeAt(c.x) * 80 * dt;
              c.vx *= Math.pow(0.25, dt);
              if (Math.abs(c.vx) < 1.5) c.vx = 0;
            }
            c.x += c.vx * dt; c.y += c.vy * dt;
            c.rot += (c.vx / c.r) * dt;
            if (c.x < 10) { c.x = 10; c.vx = Math.abs(c.vx); }
            const g = gy(c.x);
            const s = sy(c.x);
            if (g > s + 6 && c.y > s) {
              // into the sea
              if (c.vy > 100) FX.splashAt(c.x, s, { power: 0.55, n: 10 });
              if (c.vy > 100) Game.sfx('plop', c.x, 0.8);
              c.state = 'float'; c.vy *= 0.2;
              break;
            }
            if (c.y + c.r > g) {
              c.y = g - c.r;
              if (c.vy > 140) {
                FX.poof(c.x, g, Game.pal().sand[3], Game.pal().sand[2], 4, 4);
                Game.sfx('thud', c.x, Math.min(1, c.vy / 500));
                c.vy = -c.vy * 0.32; c.vx += World.slopeAt(c.x) * 20;
              } else { c.vy = 0; c.state = 'ground'; c.bonked = null; }
            }
            break;
          }
          case 'float': {
            const s = sy(c.x);
            const target = s - c.r * 0.35 + Math.sin(t * 2 + c.k) * 1.2;
            c.vy += (target - c.y) * 30 * dt; c.vy *= Math.pow(0.05, dt);
            c.vx = lerp(c.vx, (World.shoreX + 30 - c.x > 0 ? 8 : -8), dt * 0.5);
            c.x += c.vx * dt; c.y += c.vy * dt; c.rot += Math.sin(t + c.k) * dt * 0.5;
            if (!wet(c.x, 5)) { c.state = 'ground'; c.vy = 0; }
            break;
          }
          case 'held': {
            const h = c.holder;
            if (!h || !h.holdPt) { c.state = 'fall'; break; }
            const p = h.holdPt(c);
            c.x = p[0]; c.y = p[1]; c.vx = c.vy = 0;
            break;
          }
          case 'fade': {
            c.fade -= dt;
            if (c.fade <= 0) { c.state = 'gone'; c.regrow = rnd(14, 26); }
            break;
          }
          case 'gone': {
            c.regrow -= dt;

              Object.assign(c, { state: 'tree', cracked: false, bites: 0, halfOff: 0, vx: 0, vy: 0, rot: 0, claim: null, holder: null, bonked: null, meat: 0 });

            }
            break;
          }
        }
        if (c.cracked && c.halfOff < 5) c.halfOff = Math.min(5, c.halfOff + dt * 20);
      }
    },
  };

  /* ---- shiny Mudkip palette: lavender body, same orange gills ---- */
  const SHINY = (() => {
    const out = {};
    const M = Mudkip.MAT;
    for (const k in Mudkip.PAL) {
      const e = Mudkip.PAL[k];
      const shift = +k === M.BODY || +k === M.FIN || +k === M.FINEDGE || +k === M.TAIL;
      const belly = +k === M.BELLY;
      const f = (c) => {
        if (!shift && !belly) return c;
        const [r, g, b] = PX.rgbOf(c);
        const [h, s, l] = PX.rgb2hsl(r, g, b);
        const [R, G, B] = PX.hsl2rgb(shift ? 0.74 : 0.7, shift ? s * 0.62 : s * 0.3, shift ? l * 0.98 + 0.02 : l);
        return PX.pack(R, G, B);
      };
      out[k] = { r: e.r.map(f), od: f(e.od), ol: f(e.ol), ln: f(e.ln) };
    }
    return out;
  })();

  /* ================================================================

  class MudkipMon extends Mon {

    }

    holdPt() { return this.at('mouth', this.dir * 4, -2); }

    physics(dt, t) {

    }

    animate(dt, t) {

    brain() { return this.life(); }
    *life() {

        if (Scene.S.castleHP <= 0.5 && Game.t - Scene.S.castleT > 3) opts.push([4, () => this.rebuildCastle()]);
        opts.push([1.6, () => this.wander()]);
        opts.push([1.2, () => this.swimTrip()]);
        opts.push([1.2, () => this.idleLook()]);
        opts.push([0.6, () => this.dig()]);
        opts.push([0.5, () => this.visit()]);

      yield* this.faceTo(chance(0.5) ? 1 : -1, false);

    }
    *rebuildCastle() {

        if (Math.random() < dt * 8) FX.poof(S.castle.x + rnd(-20, 20), gy(S.castle.x) - rnd(0, 10), pal.sand[3], pal.sand[2], 1, 3);

    // chase and kick the beach ball, passing to a friend when one is around
    *playBall() {

        if (!b || b.holder || wet(b.x, 8) || Game.hour() === 'night') return;
        // predict where the ball comes down to head height
        let px = b.x;
        if (Math.abs(b.vy) > 30 || Math.abs(b.vx) > 20) {
          const hh = gy(b.x) - 44;
          const a = 280, bb = b.vy, cc = b.y - hh;
          const disc = bb * bb - 4 * a * cc;
          const tt = disc > 0 ? (-bb + Math.sqrt(disc)) / (2 * a) : 0.3;

        while (Math.abs(target - this.x) > 4 && e < 3) {

          if (d < 34 || (b.rest > 0.3 && Math.abs(b.x - this.x) < 34)) break;
          if (b.rest > 0.4 && Math.abs(b.x - this.x) > 40) break;
        }

        if (Math.hypot(b.x - hp[0], b.y - hp[1]) < 40 || Math.abs(b.x - this.x) < 38) {
          // header or nudge: aim for a friend if one is near

          let vx, vy;

          } else {
            vx = (chance(0.5) ? 1 : -1) * rnd(90, 160); vy = -rnd(230, 320);

          if (air) { this.vair = 240; this.air = 0.5; }

    // swim out, maybe dive to the reef, come back

    /* ---- reactions ---- */

})();

/* ------------------------------------------------------------------

   surf bed, day/night ambience, a gentle ukulele-ish loop, and all

const Sound = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, bedBus = null, bedLP = null, noise = null;

    thud(t, d, v) { tone('sine', 150, 80, t, 0.14, 0.3 * v, d); hiss(t, 0.06, 0.08 * v, 'lowpass', 600, 0.7, d); },

    rustle(t, d, v) { for (let i = 0; i < 5; i++) hiss(t + i * 0.05, 0.08, 0.05 * v, 'bandpass', 3000 + Math.random() * 1500, 1.5, d); },

    kiss(t, d, v) { tone('sine', 1700, 2600, t, 0.08, 0.1 * v, d); hiss(t, 0.04, 0.05 * v, 'highpass', 4000, 1, d); FXS.heart(t + 0.1, d, v * 0.8); },
    mud(t, d, v) { voice(t, 620, 820, 0.13, [500, 1400], [800, 1900], 0.3 * v, d); voice(t + 0.15, 780, 560, 0.16, [700, 1600], [450, 1100], 0.28 * v, d); },

    spheal(t, d, v) { voice(t, 900, 1150, 0.1, [600, 2000], [800, 2300], 0.26 * v, d); voice(t + 0.12, 1100, 850, 0.14, [800, 2300], [500, 1500], 0.24 * v, d); },
    clap(t, d, v) { hiss(t, 0.035, 0.22 * v, 'bandpass', 1800, 1.2, d); },
    bark(t, d, v) { for (let i = 0; i < 2; i++) voice(t + i * 0.2, 420, 300, 0.12, [600, 1200], [400, 900], 0.3 * v, d); },
    roar(t, d, v) {

/* ==== src/game/main.js ==== */
/* ------------------------------------------------------------------
   Game — shell: canvas + integer zoom, camera (drag, fling, pinch,
   wheel, keys, follow), the frame loop, poke dispatch and the
   icon-only HUD. No words anywhere except Dialga's "yo".
------------------------------------------------------------------- */
const Game = (() => {
  const { clamp, lerp } = Scenery;
  const $ = (s) => document.querySelector(s);
  const DEBUG = /[?&]debug/.test(location.search);
  const qs = new URLSearchParams(location.search);
  const SPEED = Math.max(1, Math.min(8, +(qs.get('speed') || 1)));

  const G = {
    t: 0, hourIdx: 1, P: null, mons: [], systems: [], ball: null, mudkip: null, school: null,
    cam: { x: 300, y: 200, vx: 0, vy: 0 }, zoom: 3, follow: true, lock: 0, shakeA: 0, started: false, paused: false,
    VW: 320, VH: 180,
  };
  G.hour = () => Times.ORDER[G.hourIdx];
  G.pal = () => G.P;

  /* ---------- canvas & zoom ---------- */
  const wrap = $('#game');
  const cv = $('#cv');
  const ctx = cv.getContext('2d', { alpha: false });
  let fb = null, occ = null, img = null, dpr = 1, devW = 0, devH = 0, zMin = 2, zMax = 6;
  const MAXPIX = 640000;
  function layout() {
    dpr = window.devicePixelRatio || 1;
    const r = wrap.getBoundingClientRect();
    devW = Math.max(160, Math.round(r.width * dpr)); devH = Math.max(120, Math.round(r.height * dpr));
    zMin = 1;
    while ((devW / zMin) * (devH / zMin) > MAXPIX && !qs.has('zmin')) zMin++;
    zMax = zMin + 4;
    if (!G.zoomSet) { G.zoom = clamp(Math.round(devH / 460), zMin, zMin + 1); G.zoomSet = true; }
    G.zoom = clamp(G.zoom, zMin, zMax);
    const z = G.zoom;
    G.VW = Math.ceil(devW / z); G.VH = Math.ceil(devH / z);
    cv.width = G.VW; cv.height = G.VH;
    cv.style.width = (G.VW * z) / dpr + 'px'; cv.style.height = (G.VH * z) / dpr + 'px';
    img = ctx.createImageData(G.VW, G.VH);
    fb = new PX.Buf(G.VW, G.VH);
    fb.d = new Uint32Array(img.data.buffer);
    occ = new Uint8Array(G.VW * G.VH);
    clampCam();
    updateZoomUI();
  }
  function setZoom(nz, sx = devW / 2, sy = devH / 2) {
    nz = clamp(nz, zMin, zMax);
    if (nz === G.zoom) return;
    const oz = G.zoom;
    const wx = G.cam.x + sx / oz, wy = G.cam.y + sy / oz;
    G.zoom = nz;
    layout();
    G.cam.x = wx - sx / nz; G.cam.y = wy - sy / nz;
    clampCam();
    // smooth the jump: start the new frame scaled like the old one
    cv.style.transition = 'none';
    cv.style.transformOrigin = `${sx / dpr}px ${sy / dpr}px`;
    cv.style.transform = `scale(${oz / nz})`;
    void cv.offsetWidth;
    cv.style.transition = 'transform 180ms cubic-bezier(.2,.8,.3,1)';
    cv.style.transform = 'scale(1)';
    sfx('pop', null, 0.4);
  }
  function clampCam() {
    const c = G.cam;
    const W = World.W, H = World.H;
    c.x = G.VW >= W ? (W - G.VW) / 2 : clamp(c.x, 0, W - G.VW);
    // don't scroll far below the ground that's in view (endless sand isn't interesting)
    let gmax = 0;
    for (let x = c.x; x <= c.x + G.VW + 40; x += 40) gmax = Math.max(gmax, World.groundAt(clamp(x, 0, W)));
    const yMax = Math.min(H - G.VH, Math.max(-60, gmax + 150 - G.VH));
    c.y = G.VH >= H ? (H - G.VH) / 2 : clamp(c.y, -60, yMax);
  }

  /* ---------- audio helper ---------- */
  function sfx(name, x = null, vol = 1) {
    if (!Sound.on) return;
    let pan = 0, v = vol;
    if (x !== null && x !== undefined) {
      const mid = G.cam.x + G.VW / 2;
      const d = (x - mid) / (G.VW * 0.5);
      pan = clamp(d * 0.7, -0.9, 0.9);
      v = vol / (1 + Math.max(0, Math.abs(d) - 1) * 1.6);
    }
    Sound.play(name, pan, v);
  }
  G.sfx = sfx;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  G.shake = (a) => { if (!calm) G.shakeA = Math.max(G.shakeA, a); };

  /* ---------- time of day ---------- */
  function setHour(i) {
    G.hourIdx = (i + Times.ORDER.length) % Times.ORDER.length;
    G.P = Times.compile(G.hour());
    Critters.setShadowColor(G.P.shadowTint);
    Sound.setHour(G.hour());
    HUD.clock();
  }
  G.setHour = setHour;

  /* ---------- world setup ---------- */
  function init() {
    Scene.init();
    setHour(qs.has('time') ? Math.max(0, Times.ORDER.indexOf(qs.get('time'))) : 1);
    const gy = World.groundAt;
    G.ball = new Critters.BeachBall(640, gy(640) - 11);
    G.mudkip = new Life.MudkipMon({ x: 520 });
    G.mons.push(G.mudkip);
    for (const s of G.systems) if (s.init) s.init(G);
    G.cam.x = G.mudkip.x - G.VW * 0.5; G.cam.y = G.mudkip.y - G.VH * 0.7;
    if (qs.has('cam')) { const [x, y] = qs.get('cam').split(',').map(Number); G.cam.x = x; G.cam.y = y; G.follow = false; }

  /* ---------- update ---------- */
  function updateCamera(dt) {
    const c = G.cam;
    if (G.lock > 0) G.lock -= dt;

      const m = G.followTarget || G.mudkip;
      const tx = m.x - G.VW * 0.5, ty = m.y - G.VH * 0.7;
      const k = 1 - Math.exp(-dt * 2.6);

      c.x += c.vx * dt; c.y += c.vy * dt;

  function update(dt) {

    }

    const t = G.t;
    updateCamera(dt);

    for (const p of Scene.S.palms) p.shake = Math.max(0, p.shake - dt * 1.2);
    for (const r of Scene.S.rocks) r.shake = Math.max(0, r.shake - dt);
    for (const k of ['umbrella', 'castle']) if (Scene.S[k].wob) Scene.S[k].wob = Math.max(0, Scene.S[k].wob - dt * 1.5);
    Life.Nuts.update(dt, t);
    if (G.ball) { G.ball.step(dt, t); Life.ballCollide(G.ball, dt); }

    for (const s of G.systems) if (s.update) s.update(dt, t);
    FX.update(dt);
    G.shakeA = Math.max(0, G.shakeA - dt * 6);
    // audio: muffle when the view is underwater
    const midY = G.cam.y + G.VH * 0.5;
    Sound.setUnder(midY > World.SEA + 60 ? 1 : 0);
  }

  /* ---------- render ---------- */
  const prof = {};
  let pt = 0;
  const mark = DEBUG ? (k) => { const n = performance.now(); prof[k] = (prof[k] || 0) * 0.95 + (n - pt) * 0.05; pt = n; } : () => {};
  G.prof = prof;
  function render() {
    if (G.gallery) { Gallery.draw(fb); Gallery.post(fb); ctx.putImageData(img, 0, 0); return; }
    const P = G.P, t = G.t;
    pt = performance.now();
    const sh = G.shakeA > 0 ? G.shakeA : 0;
    const cx = Math.round(G.cam.x + (sh ? (Math.random() - 0.5) * sh * 2 : 0));
    const cy = Math.round(G.cam.y + (sh ? (Math.random() - 0.5) * sh * 2 : 0));
    G.cx = cx; G.cy = cy;
    occ.fill(0);
    const swash = WorldRender.swashState(t);
    WorldRender.drawSky(fb, cx, cy, P, t);
    for (const s of G.systems) if (s.drawSky) s.drawSky(fb, cx, cy, P, t);
    mark('sky');
    WorldRender.drawBackdrop(fb, cx, cy, P, t, (b, bx, byy, bd) => { for (const s of G.systems) if (s.drawBackdrop) s.drawBackdrop(b, cx, cy, P, t, bx, byy); });
    mark('backdrop');
    // sprites for this frame (render budget shared by everyone)
    for (const m of G.mons) if (m.visible && m.alive && onScreen(m, cx, cy, 200)) m.sprite(P);
    mark('sprites');
    // far swimmers sit behind the seabed cross-section
    for (const m of G.mons) if (m.layer === 'far' && m.visible) m.draw(fb, cx, cy, occ);
    WorldRender.drawTerrain(fb, cx, cy, P, t, occ, swash);
    mark('terrain');
    Scene.drawBack(fb, cx, cy, P, t, occ);
    for (const s of G.systems) if (s.drawBack) s.drawBack(fb, cx, cy, P, t, occ);
    // contact shadows
    for (const m of G.mons) {
      if (!m.visible || !m.shadow || m.layer === 'far' || m.mode === 'swim' || m.mode === 'dive') continue;
      const g = World.groundAt(m.x);
      const h = g - m.y;
      if (h > 160 || g > WorldRender.surfaceAt(m.x, t) + 4) continue;
      const w = m.width();
      Critters.shadow(fb, cx, cy, m.x + (m.shadowDx || 0), g + 1, w * 0.36 * (1 - h / 400), 3.2, 0.9 * (1 - h / 160));
    }
    if (G.ball && !G.ball.holder) {
      const g = World.groundAt(G.ball.x), h = g - G.ball.y;
      if (h < 140 && g < WorldRender.surfaceAt(G.ball.x, t) + 2) Critters.shadow(fb, cx, cy, G.ball.x, g + 1, 9 * (1 - h / 300), 2.5, 0.9 * (1 - h / 140));
    }
    Scene.drawItems(fb, cx, cy, P, t);
    const mids = G.mons.filter((m) => m.layer !== 'far' && m.layer !== 'top' && m.visible).sort((a, b) => a.z - b.z);
    let ballDrawn = false;
    for (const m of mids) {
      if (!ballDrawn && G.ball && m.z > G.ball.z) { drawBall(cx, cy, P); ballDrawn = true; }

          if (d < 6.6) col = d > 5 ? '#1b2240' : d > 3.4 ? '#f4f7fb' : d > 2.4 ? '#c9d3e3' : '#ffffff';

      put(9, 6, '#ffffff'); put(10, 6, '#ffffff'); put(8, 7, '#ffffff');
      const url = c.toDataURL();
      document.querySelectorAll('#b-start .pb-top, #b-start .pb-bot').forEach((el) => { el.style.backgroundImage = `url(${url})`; });
      const tc = document.createElement('canvas'); tc.width = tc.height = 20;
      const tx = tc.getContext('2d');
      const F = ['....kk......', '...kwwk.....', '...kwwk.....', '...kwwk.....', '...kwwkkk...', '...kwwkwwkk.', '.kkkwwkwwkwk', 'kwwkwwwwwkwk', 'kwwwwwwwwwwk', '.kwwwwwwwwwk', '..kwwwwwwwk.', '...kwwwwwk..', '...kkkkkkk..'];
      F.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { tx.fillStyle = ch === 'k' ? '#1b2240' : '#ffffff'; tx.fillRect(x + 4, y + 3, 1, 1); } }));

  let miniT = 0;
  function drawMini() {

    const P = G.P, sx = w / World.W, sy = h / World.H;
    const hx = (c) => '#' + PX.toHex(c).slice(1);
    const sk = P.skyRow;
    for (let y = 0; y < h; y++) {
      const wy = y / sy;
      if (wy < World.SEA) m.fillStyle = hx(sk[Math.min(sk.length - 1, Math.max(0, Math.floor(wy)))].a);
      else m.fillStyle = hx(P.waterRow[Math.min(P.waterRow.length - 1, Math.floor(wy - World.SEA))].a);
      m.fillRect(0, y, w, 1);
    }
    for (let x = 0; x < w; x++) {
      const g = World.groundAt(x / sx);
      m.fillStyle = hx(g > World.SEA + 2 ? P.seabed[2] : P.sand[2]);
      m.fillRect(x, Math.floor(g * sy), 1, h);
    }
    for (const s of G.systems) if (s.drawMini) s.drawMini(m, sx, sy);
    const mk = G.mudkip;
    if (mk) { m.fillStyle = '#1b2240'; m.fillRect(Math.round(mk.x * sx) - 2, Math.round((mk.y - 20) * sy) - 2, 5, 5); m.fillStyle = '#56bcf0'; m.fillRect(Math.round(mk.x * sx) - 1, Math.round((mk.y - 20) * sy) - 1, 3, 3); }
    m.strokeStyle = '#ffffff'; m.lineWidth = 1;
    m.strokeRect(Math.round(G.cam.x * sx) + 0.5, Math.round(G.cam.y * sy) + 0.5, Math.max(3, Math.round(G.VW * sx) - 1), Math.max(3, Math.round(G.VH * sy) - 1));
  }

  /* ---------- start screen ---------- */
  function start() {
    if (G.started) return;
    G.started = true;
    const st = $('#start');
    st.classList.add('open');
    setTimeout(() => { st.hidden = true; }, 700);
    let want = true;
    try { want = localStorage.getItem('mk-game-sound') !== '0'; } catch (e) { /* default on */ }
    if (want) toggleSound();
    sfx('chime', null, 0.7);
    wrap.focus({ preventScroll: true });
  }

  /* ---------- loop ---------- */
  let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShow = 0, msAcc = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    const t0 = performance.now();
    Critters.Budget.reset(G.started ? 10 : 40);
    if (G.panGoal) {
      const k = 1 - Math.exp(-dt * 4);
      G.cam.x += (G.panGoal[0] - G.cam.x) * k; G.cam.y += (G.panGoal[1] - G.cam.y) * k;
      if (Math.hypot(G.panGoal[0] - G.cam.x, G.panGoal[1] - G.cam.y) < 2 || drag) G.panGoal = null;
    }
    if (!G.paused) for (let k = 0; k < SPEED; k++) update(dt);

      if (fpsAcc > 0.5) { fpsShow = fpsN / fpsAcc; const el = $('#dbg'); if (el) el.textContent = fpsShow.toFixed(0) + ' fps  ' + (msAcc / fpsN).toFixed(1) + ' ms  ' + G.VW + 'x' + G.VH + ' z' + G.zoom + ' ' + JSON.stringify(Critters.cacheStats()) + ' ' + Object.entries(prof).map(([k, v]) => k + ':' + v.toFixed(1)).join(' '); fpsAcc = 0; fpsN = 0; msAcc = 0; }

  function restore(d) {
    if (!d || typeof d !== 'object') return;

    if (d.zoom) { G.zoom = d.zoom; layout(); }
    if (d.cam) { G.cam.x = d.cam[0]; G.cam.y = d.cam[1]; clampCam(); }
    if (typeof d.follow === 'boolean') { G.follow = d.follow; updateFollowUI(); }

  function boot() {
    const wk = document.getElementById('wk-src');
    if (wk && !qs.has('noworker')) Critters.Pool.init(wk.textContent);

    init();
    window.addEventListener('resize', () => { const oz = G.zoom; layout(); if (G.zoom !== oz) updateZoomUI(); });
    $('#b-start').addEventListener('click', (e) => { e.stopPropagation(); start(); });
    $('#start').addEventListener('click', start);
    try { $('#b-start').focus({ preventScroll: true }); } catch (e) { /* focus is optional */ }
    if (qs.has('autostart')) { G.started = true; $('#start').hidden = true; }
    // keep the player's place across a republish of the page
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      try {
        hot.snapshot(() => ({ hour: G.hourIdx, cam: [G.cam.x, G.cam.y], zoom: G.zoom, follow: G.follow, started: G.started, orb: typeof Magic !== 'undefined' ? Magic.S.orb : 'hidden' }));

    const go = (d) => { try { restore(d); } catch (e) { /* fresh start */ } requestAnimationFrame(frame); };

  G.layout = layout;
  G.setZoom = setZoom;
