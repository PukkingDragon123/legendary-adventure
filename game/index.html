    meta: { heightM: 1.1, bw: 384, bh: 288, oy: 0.885 },
  };
})();

/* ------------------------------------------------------------------
   Walrein — the Ice Break Pokémon. A huge walrus with a fluffy white
   mane, a white collar band and long ivory tusks.
   Model space: x = forward, y = up, z = near side at yaw 0, ground at y = 0.
------------------------------------------------------------------- */
const Walrein = (() => {
  const { ell, chain, T, R, F, onEll, sph, code } = Creature;

  const BODY = 1, PATCH = 2, MANE = 3, BAND = 4, NOSE = 6, MOUTH = 7, TONGUE = 8, FLIP = 9;
  // ivory tusk tones: flat ramps, one per toon band (the tusks are shaded analytically, see build)
  const TK0 = 10, TK1 = 11, TK2 = 12, TK3 = 13;
  const MAT = { BODY, PATCH, MANE, BAND, TUSK: TK2, NOSE, MOUTH, TONGUE, FLIP, TK0, TK1, TK2, TK3 };

  const PAL = Creature.palette({
    [BODY]:   { r: ['#1f5a86', '#2f78a8', '#4a95c2', '#70b1d8', '#a8d4ee'], od: '#10324f', ol: '#21577f', ln: '#245e88' },
    [PATCH]:  { r: ['#3a77a4', '#5594c0', '#76b0d6', '#98c9e6', '#c4e2f4'], od: '#10324f', ol: '#21577f', ln: '#2f6c96' },
    [FLIP]:   { r: ['#1d5580', '#2c719f', '#448cba', '#68a9d2', '#a0cfea'], od: '#10324f', ol: '#21577f', ln: '#1f5a86' },
    [MANE]:   { r: ['#adc3e1', '#cddbef', '#e9f0fa', '#f7fafe', '#ffffff'], od: '#4a6892', ol: '#7a96be', ln: '#93acce' },
    [BAND]:   { r: ['#8fb0d2', '#b8d0e8', '#e6f0fa', '#ffffff', '#ffffff'], od: '#44628c', ol: '#7792ba', ln: '#7896bc' },
    [TK0]:    { r: ['#c2a164', '#c2a164', '#c2a164', '#c2a164', '#c2a164'], od: '#6e5226', ol: '#9a7a44', ln: '#a4834c' },
    [TK1]:    { r: ['#dbbf86', '#dbbf86', '#dbbf86', '#dbbf86', '#dbbf86'], od: '#6e5226', ol: '#9a7a44', ln: '#a4834c' },
    [TK2]:    { r: ['#eedcab', '#eedcab', '#eedcab', '#eedcab', '#eedcab'], od: '#6e5226', ol: '#9a7a44', ln: '#a4834c' },
    [TK3]:    { r: ['#faefd2', '#faefd2', '#faefd2', '#faefd2', '#faefd2'], od: '#6e5226', ol: '#9a7a44', ln: '#a4834c' },
    [NOSE]:   { r: ['#163f60', '#1f5378', '#2c6890', '#4a86ae', '#7fb0d2'], od: '#0a2238', ol: '#17405f', ln: '#143a58' },
    [MOUTH]:  { r: ['#6a2034', '#8a3046', '#aa4a5e', '#c46676', '#dc8a94'], od: '#40101e', ol: '#62182a', ln: '#62182a' },
    [TONGUE]: { r: ['#b8566c', '#d4728a', '#ea94a4', '#f8b6be', '#ffd6da'], od: '#6e1428', ol: '#8e2038', ln: '#b04450' },
  });
  const GLOSSY = { [NOSE]: 1 };

  const DEFAULT = { headPitch: 0.12, headYaw: 0, mouth: 0, eyes: 'open', squash: 0, flipper: 0, side: 1 };

  const K = 1.08;
  const OX = 32;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- eye stamps: small dark eyes ---------- */
  const EYES = {
    open: ['.kkk.', 'kwwkk', 'kwkkk', 'kkkkk', 'kkkkk', '.kkk.'],
    openN: ['.kk.', 'wwkk', 'wkkk', 'kkkk', 'kkkk', '.kk.'],
    openF: ['kk', 'wk', 'kk', 'kk', 'kk'],
    angry: ['kk...', '.kkk.', 'kwkkk', 'kkkkk', 'kkkkk', '.kkk.'],
    angryN: ['k...', '.kk.', 'wkkk', 'kkkk', 'kkkk', '.kk.'],
    angryF: ['k.', 'kk', 'wk', 'kk', 'kk'],
    happy: ['.kkk.', 'kk.kk', 'k...k'],
    happyN: ['.kk.', 'k..k', 'k..k'],
    happyF: ['.k', 'k.', 'k.'],
    blink: ['kkkkk', '.kkk.'],
    blinkN: ['kkkk', '.kk.'],
    blinkF: ['kk', '.k'],
    closed: ['k...k', '.kkk.'],
    closedN: ['k..k', '.kk.'],
    closedF: ['k.', '.k'],
  };
  const EYEC = { k: '#101c2c', w: '#ffffff' };

  // mane lumps [x, y, z, r] in the head frame: a front ring around the face, a second ring
  // behind it, a cap on the forehead and a big puff at the back
  const MANE_L = (() => {
    const L = [];
    const ring = (x, R, r, n, a0, cut, sx = 1.1) => {
      for (let i = 0; i < n; i++) {
        const t = a0 + (i / n) * Math.PI * 2;
        const cy = Math.cos(t), cz = Math.sin(t);
        if (cy < cut) continue;
        L.push([x - 6 * (1 - cy), R * cy + 2, R * cz * sx, r * (cy < -0.3 ? 0.9 : 1)]);
      }
    };
    ring(8, 31, 17, 9, 0, -0.55);           // front ring: forehead and cheeks, around the snout
    ring(-17, 37, 23, 8, Math.PI / 8, -0.9); // second ring
    L.push([-8, 46, 0, 20]);                 // crown
    L.push([-50, 14, 0, 32], [-46, -20, 22, 26], [-46, -20, -22, 26], [-58, -38, 0, 24], [-32, 38, 0, 24]); // back puff
    return L;
  })();

  // lighter marbled patches: smooth organic blobs from a few low-frequency waves (root space)
  const patchAt = (x, y, z) => {
    const f = Math.sin(x * 0.045 + 1.2 + z * 0.03) * Math.cos(z * 0.05 - 0.4 + y * 0.012) + 0.75 * Math.sin(y * 0.06 + x * 0.025 + 2.1 + z * 0.02);
    return f > 0.55;
  };

  // world-space topmost point over a set of ellipsoid prims (where things rest on the head)
  function topOf(prims) {
    let best = null;
    for (const p of prims) {
      const ly = Math.hypot(p.L[3], p.L[4], p.L[5]);
      const q = V3.add(p.c, M3.v(p.L, [p.L[3] / ly, p.L[4] / ly, p.L[5] / ly]));
      if (!best || q[1] > best[1]) best = q;
    }
    return best;
  }

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const prims = [];
    const view = { L: [-0.49, 0.7, 0.49] }; // model-space light direction, updated by render()
    const sq = clamp(P.squash, -0.15, 0.15);
    const root = chain(F(M3.diag(K * (1 + sq * 0.25), K * (1 - sq * 0.5), K * (1 + sq * 0.25)), [0, 0, 0]), T(OX, 0, 0));
    const rinv = M3.inv(root.L), rt = root.t;

    // body material: ground clip + marbled patches (in root space so they flow across parts)
    const bodyMat = (prim, extra) => {
      const c = prim.c, L = prim.L;
      return (s) => {
        const x = c[0] + L[0] * s[0] + L[1] * s[1] + L[2] * s[2];
        const y = c[1] + L[3] * s[0] + L[4] * s[1] + L[5] * s[2];
        if (y < -0.4) return 0;
        const z = c[2] + L[6] * s[0] + L[7] * s[1] + L[8] * s[2];
        if (extra) { const e = extra(s); if (e) return e; }
        const dx = x - rt[0], dy = y - rt[1], dz = z - rt[2];
        const qx = rinv[0] * dx + rinv[1] * dy + rinv[2] * dz;
        const qy = rinv[3] * dx + rinv[4] * dy + rinv[5] * dz;
        const qz = rinv[6] * dx + rinv[7] * dy + rinv[8] * dz;
        return patchAt(qx, qy, qz) ? code(PATCH) : code(BODY);
      };
    };

    /* --- torso, rear, tail --- */
    const torso = chain(root, T(-12, 45, 0), R(M3.rz(0.14)));
    const torsoP = ell(torso, [100, 57, 68], { part: 1, grp: 1 });
    torsoP.mat = bodyMat(torsoP);
    const rear = chain(root, T(-92, 36, 0), R(M3.rz(0.32)));
    const rearP = ell(rear, [54, 32, 46], { part: 1, grp: 1 });
    rearP.mat = bodyMat(rearP);
    const tailS = chain(root, T(-128, 50, 0), R(M3.rz(0.62)));
    const tailP = ell(tailS, [26, 15, 22], { part: 1, grp: 1 });
    tailP.mat = bodyMat(tailP);
    prims.push(torsoP, rearP, tailP);
    const flukeBase = chain(tailS, T(-18, 2, 0));
    for (const side of [1, -1]) {
      const lobe = chain(flukeBase, R(M3.ry(side * 0.5)), R(M3.rx(-side * 0.62)), T(-27, 0, 0), R(M3.rz(-0.12)));
      prims.push(ell(lobe, [34, 8, 19], {
        part: 20, grp: 20,
        mat: (s) => (Math.abs(s[0] + 0.1) < 0.1 ? code(BAND) : code(FLIP)),
      }));
    }

    /* --- neck (with the white collar band) and head --- */
    const hp = clamp(P.headPitch, -0.3, 0.8);
    const neckBase = chain(root, T(48, 88, 0), R(M3.rz(-0.25 + hp * 0.55)));
    const neckP = ell(chain(neckBase, T(0, 28 + hp * 12, 0)), [46, 54 + hp * 14, 54], { part: 2, grp: 1 });
    neckP.mat = bodyMat(neckP, (s) => {
      const b1 = s[1] + 0.34, b2 = s[1] + 0.06;
      if (Math.abs(b1) < 0.065 || Math.abs(b2) < 0.06) return code(BAND);
      return 0;
    });
    const shoulder = chain(root, T(32, 90, 0), R(M3.rz(-0.35)));
    const shoulderP = ell(shoulder, [54, 46, 60], { part: 1, grp: 1 });
    shoulderP.mat = bodyMat(shoulderP);
    prims.push(neckP, shoulderP);

    const head = chain(neckBase, T(8 - hp * 6, 76 + hp * 26, 0), R(M3.rz(hp * 0.45 + 0.25)), R(M3.ry(clamp(P.headYaw, -0.8, 0.8))));
    const headP = ell(head, [32, 28, 33], { part: 3, grp: 2, mat: () => code(BODY) });
    const snout = chain(head, T(28, -2, 0));
    const snoutP = ell(snout, [22, 17, 24], { part: 4, grp: 2, mat: () => code(BODY) });
    const noseP = ell(chain(snout, T(14, 8, 0)), [13.5, 11, 14.5], { part: 5, grp: 3, mat: (s) => (s[1] < -0.55 && Math.abs(s[2]) < 0.6 ? code(NOSE, -1) : code(NOSE)) });
    const mo = clamp(P.mouth, 0, 1);
    const jaw = chain(head, T(8, -15, 0), R(M3.rz(-mo * 0.85)));
    const jawP = ell(chain(jaw, T(14, -4, 0)), [20, 9, 18], {
      part: 6, grp: 2,
      // inside of the lower jaw: pink tongue in the middle, dark gums at the rim
      mat: (s) => (mo > 0.05 && s[1] > 0.4 ? (s[1] > 0.62 && Math.abs(s[2]) < 0.5 ? code(TONGUE) : code(MOUTH, -1)) : code(BODY)),
    });
    prims.push(headP, snoutP, noseP, jawP);
    if (mo > 0.05) {
      // dark mouth cavity between the jaws
      const cav = chain(head, T(22, -13 - mo * 5, 0));
      prims.push(ell(cav, [15, 4 + mo * 8, 14], { part: 7, grp: 2, mat: (s) => (s[1] < -0.72 && Math.abs(s[2]) < 0.5 ? code(TONGUE) : code(MOUTH, s[0] > 0.5 ? 0 : -1)) }));
    }

    /* --- tusks: a dense chain of shrinking spheres along a curve. A union of spheres has rippled
       normals, so the tusks are shaded here with the normal of the ideal smooth cone instead
       (flat-ramp tone materials; the light direction is set per render by render()). --- */
    const tuskTips = [];
    const tuskPt = (t, side) => [34 + 5 * t - 12 * t * t, -12 - 50 * t, side * (13 + 8 * t)];
    const tuskTan = (t, side) => V3.norm([5 - 24 * t, -50, side * 8]);
    const TK = [code(TK0), code(TK1), code(TK2), code(TK3)];
    for (const side of [1, -1]) {
      const N = 26;
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        const r = lerp(5.6, 1.4, t ** 1.1);
        const f = chain(head, T(...tuskPt(t, side)));
        const a = V3.norm(M3.v(head.L, tuskTan(t, side))); // cone axis (toward the tip) in model space
        const HL = head.L;
        prims.push(ell(f, [r, r, r], {
          part: side > 0 ? 8 : 9, grp: side > 0 ? 8 : 9,
          mat: (s) => {
            let nx = HL[0] * s[0] + HL[1] * s[1] + HL[2] * s[2];
            let ny = HL[3] * s[0] + HL[4] * s[1] + HL[5] * s[2];
            let nz = HL[6] * s[0] + HL[7] * s[1] + HL[8] * s[2];
            const k = nx * a[0] + ny * a[1] + nz * a[2] - 0.08 * Math.hypot(nx, ny, nz);
            nx -= k * a[0]; ny -= k * a[1]; nz -= k * a[2];
            const L = view.L, d = (nx * L[0] + ny * L[1] + nz * L[2]) / (Math.hypot(nx, ny, nz) || 1);
            return TK[d < -0.2 ? 0 : d < 0.18 ? 1 : d < 0.74 ? 2 : 3];
          },
        }));
        if (i === N - 1) tuskTips.push(V3.add(f.t, M3.v(f.L, [0, -1, 0])));
      }
    }

    /* --- mane: rings of white lumps framing the face, plus a big puff behind the head --- */
    const maneP = [];
    for (const [x, y, z, r] of MANE_L) {
      const mp = ell(chain(head, T(x, y, z)), [r, r * 0.94, r], { part: 10, grp: 10, mat: () => code(MANE) });
      maneP.push(mp); prims.push(mp);
    }

    /* --- front flippers --- */
    const fl = clamp(P.flipper, 0, 1);
    for (const side of [1, -1]) {
      const ax = V3.norm([0.45, -0.08 + fl * 0.5, side * 0.85]);
      const ay = V3.norm(V3.sub([0, 1, 0], V3.scale(ax, V3.dot([0, 1, 0], ax))));
      const az = V3.cross(ax, ay);
      const fr = chain(root, T(38, 18 + fl * 20, side * 48), F(M3.cols(ax, ay, az), [0, 0, 0]), T(26, 0, 0));
      const fp = ell(fr, [40, 9, 20], { part: side > 0 ? 11 : 12, grp: side > 0 ? 11 : 12, mat: () => code(FLIP) });
      const low = fp.c[1] - Math.hypot(fp.L[3], fp.L[4], fp.L[5]);
      if (low < 0) fp.c = [fp.c[0], fp.c[1] - low, fp.c[2]];
      fp.lines = [-0.4, 0, 0.4].map((w) => ({ pts: [[0.6, 0.8, w], [0.97, 0.2, w * 0.9]], mat: FLIP, useLn: true }));
      prims.push(fp);
    }

    /* --- anchors --- */
    const onHead = (az, v) => onEll(headP, sph(az, v));
    const tusk = V3.scale(V3.add(tuskTips[0], tuskTips[1]), 0.5);
    const anchors = {
      tusk,
      mouth: V3.add(head.t, M3.v(head.L, [28, -12, 0])),
      top: topOf([...maneP, headP, noseP]),
      head: headP.c,
    };
    const kind = P.eyes;
    return {
      prims, anchors, pose: P, view,
      stamps: [
        { at: onHead(0.6, 0.5), set: EYES, colors: EYEC, kind },
        // the far-side eye mirrors asymmetric expressions so angry brows slant toward the nose
        { at: onHead(-0.6, 0.5), set: EYES, colors: EYEC, kind, flipX: kind === 'angry' },
      ],
      dots: [],
      pri: { 1: 0, 2: 1, 3: 2, 8: 3, 9: 3, 10: 2, 11: 1, 12: 1, 20: 1 },
      glossy: GLOSSY,
      baseMat: BODY,
      shadowSteps: 10,
      shadowDepth: 10,
    };
  }

  /* Render only the model's on-screen bounding box, then paste it into the full W x H sprite.
     Pixel-identical to Creature.render (nothing is drawn outside the prims), but the renderer's
     full-buffer passes then only touch the pixels the creature can actually cover. */
  function renderTight(model, opt) {
    const { yaw = 1.05, pitch = 0.16, scale = 1, W = 96, H = 96, ox = 48, oy = 82 } = opt;
    const V = M3.mul(M3.rx(pitch), M3.mul(M3.ry(-yaw), M3.diag(scale, scale, scale)));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of model.prims) {
      const cv = M3.v(V, p.c), Lv = M3.mul(V, p.L);
      if (p.kind === 'ell') {
        const rx = Math.hypot(Lv[0], Lv[1], Lv[2]), ry = Math.hypot(Lv[3], Lv[4], Lv[5]);
        x0 = Math.min(x0, cv[0] - rx); x1 = Math.max(x1, cv[0] + rx);
        y0 = Math.min(y0, -cv[1] - ry); y1 = Math.max(y1, -cv[1] + ry);
      } else {
        const [a, b, c, d] = p.shape.bb;
        for (const [u, v] of [[a, b], [a, d], [c, b], [c, d]])
          for (const w of [-p.thick, p.thick]) {
            const q = V3.add(cv, M3.v(Lv, [u, v, w]));
            x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]);
            y0 = Math.min(y0, -q[1]); y1 = Math.max(y1, -q[1]);
          }
      }
    }
    const pad = 4;
    const X0 = Math.max(0, Math.floor(ox + x0) - pad), X1 = Math.min(W, Math.ceil(ox + x1) + pad);
    const Y0 = Math.max(0, Math.floor(oy + y0) - pad), Y1 = Math.min(H, Math.ceil(oy + y1) + pad);
    const w = X1 - X0, h = Y1 - Y0;
    if (!(w > 0 && h > 0) || w * h > W * H * 0.9) return Creature.render(model, opt);
    const r = Creature.render(model, Object.assign({}, opt, { W: w, H: h, ox: ox - X0, oy: oy - Y0 }));
    const buf = new PX.Buf(W, H), depth = new Float32Array(W * H).fill(-1e9), part = new Uint8Array(W * H);
    for (let y = 0; y < h; y++) {
      const s0 = y * w, d0 = (y + Y0) * W + X0;
      buf.d.set(r.buf.d.subarray(s0, s0 + w), d0);
      depth.set(r.depth.subarray(s0, s0 + w), d0);
      part.set(r.part.subarray(s0, s0 + w), d0);
    }
    const anchors = {};
    for (const k in r.anchors) { const a = r.anchors[k]; anchors[k] = [a[0] + X0, a[1] + Y0, a[2]]; }
    return { buf, depth, part, W, H, ox, oy, anchors };
  }

  function render(model, opt) {
    if (model.view) {
      // light direction in model space = inverse view rotation applied to the (view-space) light
      const Ld = V3.norm((opt.light && opt.light.dir) || [-0.5, 0.72, 0.5]);
      model.view.L = M3.v(M3.mul(M3.ry(opt.yaw ?? 1.05), M3.rx(-(opt.pitch ?? 0.16))), Ld);
    }
    return renderTight(model, opt);
  }

  return {
    build, render, PAL, MAT, DEFAULT,
    meta: { heightM: 1.4, bw: 384, bh: 306, oy: 0.922 },
  };
})();

/* ------------------------------------------------------------------
   Corphish — the Ruffian Pokémon (0.6 m ≈ 105 px at scale 1).
   A posable 3D model rendered straight to pixel art by the shared
   Creature pipeline (see src/creature.js, dev/CREATURE_GUIDE.md).
   Model space: x = forward, y = up, z = near side at yaw 0, ground at y = 0.

   Build: a red carapace "hood" (three faceted spikes, big white eyes)
   drapes over the body; a Λ-topped window in its front shows the cream
   face/belly shells, whose overlaps draw the segment lines. Two huge
   claws: a cream palm with a red upper jaw (zigzag teeth) hinged at the
   back, opening like a mouth at the front-top. Six IK legs, a tail.
------------------------------------------------------------------- */
const Corphish = (() => {
  const { chain, T, R, F, code } = Creature;

  // ---- materials
  const SHELL = 1, CREAM = 2, EYE = 3, INNER = 4, MOUTH = 5, TONGUE = 6;
  const MAT = { SHELL, CREAM, EYE, INNER, MOUTH, TONGUE };
  const PAL = Creature.palette({
    [SHELL]: { r: ['#9a3024', '#c64e38', '#ea7152', '#f89672', '#fdb896'], od: '#58150e', ol: '#8f2c1c', ln: '#8a2a1c' },
    [CREAM]: { r: ['#b09884', '#d2bfa8', '#eadcc6', '#f6eee0', '#fffaf0'], od: '#5a3c2a', ol: '#8a6a52', ln: '#9c7e66' },
    [EYE]: { r: ['#b4bccb', '#d6dce6', '#f3f6fa', '#ffffff', '#ffffff'], od: '#3c1c18', ol: '#5c2c24', ln: '#3c1c18' },
    [INNER]: { r: ['#6a2a24', '#88392e', '#a54c3c', '#bd624d', '#d27b62'], od: '#3a0e0a', ol: '#5e1a12', ln: '#4a140e' },
    [MOUTH]: { r: ['#3e0c12', '#56141a', '#6e1e24', '#88282c', '#a03836'], od: '#2a0608', ol: '#3a0c10', ln: '#3a0c10' },
    [TONGUE]: { r: ['#b0404a', '#cc5a60', '#e57a78', '#f59a92', '#ffc0b4'], od: '#5a1018', ol: '#7a1c24', ln: '#8a2830' },
  });
  const GLOSSY = { [SHELL]: 1 };
  const NO_DOTS = [{}].slice(1); // empty, but with the elements kind of Mudkip's dot list
  const C_SHELL = code(SHELL), C_SHELL_D = code(SHELL, -1), C_CREAM = code(CREAM), C_EYE = code(EYE);
  const C_INNER = code(INNER), C_MOUTH = code(MOUTH), C_TONGUE = code(TONGUE);
  const M_SHELL = () => C_SHELL, M_CREAM = () => C_CREAM, M_EYE = () => C_EYE, M_LINING = () => C_SHELL_D;

  // ---- vector helpers
  const add = V3.add, sub = V3.sub, sc = V3.scale, dot = V3.dot, cross = V3.cross, nrm = V3.norm;
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const len3 = (a) => Math.hypot(a[0], a[1], a[2]);
  const mul3 = (a, b) => [a[0] * b[0], a[1] * b[1], a[2] * b[2]];
  const inF = (f, p) => add(f.t, M3.v(f.L, p)); // local point → parent space

  // Primitives, stamps and the model reuse Mudkip's exact object layouts, so the shared
  // renderer's inline caches see no new hidden classes (no deopts when species interleave).
  const E = (c, L, part, grp, mat) => ({ kind: 'ell', part, grp, c, L, mat });
  const PL = (c, L, part, grp, shape, thick) => ({ kind: 'plate', part, grp, c, L, shape, thick });
  const ellF = (f, r, part, grp, mat) => E(f.t, M3.mul(f.L, M3.diag(r[0], r[1], r[2])), part, grp, mat);
  // ellipsoid spanning p0 → p1 along its local y axis (model-space points)
  function seg(p0, p1, rx, rz, part, grp, mat) {
    const d = sub(p1, p0), l = len3(d);
    const Y = sc(d, 1 / l);
    let X = cross(Y, [0, 0, 1]);
    if (len3(X) < 1e-3) X = cross(Y, [1, 0, 0]);
    X = nrm(X);
    const Z = cross(X, Y);
    return E(sc(add(p0, p1), 0.5), M3.mul(M3.cols(X, Y, Z), M3.diag(rx, l / 2, rz)), part, grp, mat);
  }

  // ---- pyramid spikes (flat triangular faces → a faceted cone)
  function pyramid(base, apex, r, n, rot) {
    const ax = nrm(sub(apex, base));
    let e1 = cross(ax, [0, 0, 1]);
    if (len3(e1) < 1e-3) e1 = cross(ax, [1, 0, 0]);
    e1 = nrm(e1);
    const e2 = cross(ax, e1);
    const V = [];
    for (let k = 0; k < n; k++) {
      const a = rot + (k / n) * Math.PI * 2;
      V.push(add(base, add(sc(e1, r * Math.cos(a)), sc(e2, r * Math.sin(a)))));
    }
    const faces = [];
    let hw = 0, h = 0;
    for (let k = 0; k < n; k++) {
      const A = V[k], B = V[(k + 1) % n];
      const M = sc(add(A, B), 0.5);
      const u = nrm(sub(B, A));
      let v = sub(apex, M);
      v = nrm(sub(v, sc(u, dot(v, u))));
      hw = len3(sub(B, A)) / 2;
      h = dot(sub(apex, M), v);
      faces.push({ M, axes: M3.cols(u, v, cross(u, v)) });
    }
    const shape = bakeShape({
      bb: [-hw - 0.5, -0.5, hw + 0.5, h + 0.5],
      test: (u, v) => (Shape2D.inTri(u, v, [-hw, 0], [hw, 0], [0, h]) ? C_SHELL : 0),
    });
    return { faces, shape };
  }

  // ---- body geometry (body frame: origin on the ground, before squash/tilt)
  const HOOD_C = [-2, 54, 0], HOOD_R = [23, 30, 27];
  const MUZ_C = [7, 52, 0], MUZ_R = [16.5, 13.5, 19];
  const BEL = [
    { c: [6, 41, 0], r: [16, 12.5, 19.5] },
    { c: [4.5, 31.5, 0], r: [15, 11.5, 18] },
    { c: [3, 24.5, 0], r: [13.5, 8, 15] },
  ];
  const LOW_C = [-4, 29, 0], LOW_R = [18, 11, 18.5]; // lower body under the hood rim
  const LAM_Y = 65, LAM_K = 0.66; // Λ-shaped top edge of the cream face: y < LAM_Y − LAM_K·|z|
  const RIM_Y = 29; // hood rim height
  // the window follows the cream shells' outlines (so it never shows the hood lining)
  const SHELLS = [{ c: MUZ_C, r: MUZ_R }, ...BEL];
  const SH_Y = SHELLS.map((b) => b.c[1]), SH_RY = SHELLS.map((b) => 1 / b.r[1]), SH_RZ = SHELLS.map((b) => 1 / b.r[2]);
  function inWindow(x, y, z) {
    if (x <= 0 || y >= LAM_Y - LAM_K * Math.abs(z)) return false;
    for (let i = 0; i < 4; i++) {
      const dy = (y - SH_Y[i]) * SH_RY[i], dz = z * SH_RZ[i];
      if (dy * dy + dz * dz < 0.8) return true;
    }
    return false;
  }
  const hoodMat = (s) => {
    const x = HOOD_C[0] + HOOD_R[0] * s[0], y = HOOD_C[1] + HOOD_R[1] * s[1], z = HOOD_R[2] * s[2];
    return y < RIM_Y || inWindow(x, y, z) ? 0 : C_SHELL;
  };
  const lowMat = (s) => (s[1] < 0.3 ? C_CREAM : C_SHELL);

  const SPIKES = [
    pyramid([-2, 79, 0], [-4, 105, 0], 6, 6, 0.3),
    pyramid([0, 75, 13], [-1, 98, 26], 4.4, 6, 0.3),
    pyramid([0, 75, -13], [-1, 98, -26], 4.4, 6, 0.3),
  ];

  // ---- claw geometry (claw frame: origin at the wrist, x' = toward the tip,
  //      y' = back of the claw (red upper jaw side), z' = across the broad cream palm)
  // The bite surface is a steeply tilted plane s1 = Y0 − KT·s0 (unit-sphere space): the red
  // upper jaw is a wedge over the top and back, hinged low at the back, so the pincer
  // opens like a mouth at the front-top of the claw. The border zigzags (big teeth).
  const CA = 22.5, CB = 11.8, CC = 16; // half-length, half-depth (jaw axis), half-width
  const Y0 = -0.45, KT = 1.4, ZA = 0.5, ZN = 6, ZPH = 0.5;
  const BN = nrm([KT, 1, 0]), BU = nrm([1, -KT, 0]), BOFF = Y0 / Math.hypot(1, KT);
  const BCEN = sc(BN, BOFF);
  const bite = (s) => {
    const ph = (Math.atan2(s[2], (s[0] - BCEN[0]) * BU[0] + (s[1] - BCEN[1]) * BU[1]) / (2 * Math.PI)) * ZN + ZPH;
    return Y0 - KT * s[0] + ZA * (Math.abs(ph - Math.floor(ph + 0.5)) * 2 - 0.5);
  };
  const lowerMat = (s) => (s[1] < bite(s) ? C_CREAM : 0);
  const upperMat = (s) => (s[1] >= bite(s) ? C_SHELL : 0);
  // bite faces: discs in the tilted plane (only seen when the pincer is open)
  const BRHO = Math.sqrt(1 - BOFF * BOFF) * 0.92, BS = 10;
  const BITE_G = bakeShape({
    bb: [-BRHO * BS - 0.5, -BRHO * BS - 0.5, BRHO * BS + 0.5, BRHO * BS + 0.5],
    test: (u, v) => (u * u + v * v <= (BRHO * BS) ** 2 ? C_INNER : 0),
  });
  const BITE_L = M3.mul(M3.diag(CA, CB, CC), M3.mul(M3.cols(BU, [0, 0, 1], BN), M3.diag(1 / BS, 1 / BS, 1 / BS)));
  const BITE_C = add([CA, 0, 0], M3.v(M3.diag(CA, CB, CC), BCEN));
  const onBite = (k) => add([CA, 0, 0], mul3([CA, CB, CC], add(BCEN, sc(BU, k * Math.sqrt(1 - BOFF * BOFF)))));
  const HINGE = onBite(-0.97); // lowest back point of the bite loop
  const TIP = onBite(0.97); // front point of the bite loop (where the pincer tips meet)
  // arm keyframes (near side, body frame): wrist position, claw axis, back-of-claw direction
  const ARM_K = [
    { a: -0.5, W: [12, 32, 26], X: [1, 0.35, -0.15], Y: [-0.8, 0.9, 0.1] },
    { a: 0, W: [-8, 55, 34], X: [0.2, 1, 0.3], Y: [-1, 0.15, -0.35] },
    { a: 1, W: [-6, 66, 27], X: [0.05, 1, 0.12], Y: [-1, 0.05, -0.3] },
  ];
  function armKey(a) {
    const i = a <= 0 ? 0 : 1;
    const k0 = ARM_K[i], k1 = ARM_K[i + 1];
    const t = Math.max(0, Math.min(1, (a - k0.a) / (k1.a - k0.a)));
    return { W: lerp3(k0.W, k1.W, t), X: nrm(lerp3(k0.X, k1.X, t)), Y: lerp3(k0.Y, k1.Y, t) };
  }

  // ---- eyes
  const EYE_AZ = 0.6, EYE_V = 0.44, EYE_R = [6.8, 8.6, 4];
  const lidMat = (s) => (s[1] > 0.42 - 0.62 * s[0] ? C_SHELL : 0);

  // ---- legs: hips in the body frame, feet on the ground (tripod gait phases)
  const LEGS = [
    { hip: [9, 25, 11], foot: [25, 0, 21], ph: 0 },
    { hip: [-2, 24, 14], foot: [1, 0, 32], ph: Math.PI },
    { hip: [-12, 25, 11], foot: [-24, 0, 26], ph: 0 },
  ];
  const L_UP = 8, L_LO = 23;

  // ---- tail
  const TAIL = [
    { c: [-18, 27, 0], r: [7, 6, 11], a: -0.3 },
    { c: [-25, 23, 0], r: [6, 5, 9.5], a: -0.42 },
    { c: [-31, 19.5, 0], r: [5, 4.2, 8.5], a: -0.55 },
    { c: [-36.5, 16, 0], r: [6.5, 2.4, 11], a: -0.7 },
  ];

  // contour-line priorities per group (integer-keyed object like Mudkip's)
  const PRI = {};
  for (let i = 1; i < 64; i++) PRI[i] = 0;
  Object.assign(PRI, { 2: 2, 3: 4, 4: 3, 5: 2, 6: 1, 10: 5, 11: 5, 12: 6, 13: 6, 60: 1, 62: -1, 63: -2 });
  for (const b of [20, 30]) { PRI[b] = 3; PRI[b + 1] = 4; PRI[b + 2] = 5; PRI[b + 3] = 6; }
  for (let i = 40; i < 46; i++) PRI[i] = 1;

  const SIZE = 0.945;
  const DEFAULT = { clawN: 0, clawF: 0, armN: 0, armF: 0, walk: 0, eyes: 'open', squash: 0, tilt: 0, mouth: 0, side: 1 };

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const prims = [], stamps = [], anchors = {};
    const sq = P.squash;
    const root = F(M3.diag(1 + sq * 0.45, 1 - sq, 1 + sq * 0.45), [0, 0, 0]);
    // body roll about the forward axis (sideways shuffle); legs are IK so the feet stay planted
    const body = chain(root, T(0, 40, 0), R(M3.rx(-P.tilt)), T(0, -40, 0));
    const hood = chain(body, T(...HOOD_C));

    // --- eyes first (front-most), white eyeballs bulging from the hood; pupils are stamps
    const eyeKind = P.eyes;
    const closed = eyeKind === 'happy' || eyeKind === 'closed';
    for (const side of [1, -1]) {
      const s0 = Creature.sph(side * EYE_AZ, EYE_V);
      const pS = add(HOOD_C, mul3(HOOD_R, s0));
      const n = nrm([s0[0] / HOOD_R[0], s0[1] / HOOD_R[1], s0[2] / HOOD_R[2]]);
      const ye = nrm(sub([0, 1, 0], sc(n, n[1])));
      const xe = sc(cross(ye, n), side); // x_e points forward/inward for both eyes
      const cLoc = sub(pS, sc(n, 1.0));
      const ax = M3.cols(xe, ye, n);
      const id = side > 0 ? 10 : 11;
      const eyePrim = E(inF(body, cLoc), M3.mul(body.L, M3.mul(ax, M3.diag(EYE_R[0], EYE_R[1], EYE_R[2]))), id, closed ? 2 : id, closed ? M_SHELL : M_EYE);
      prims.push(eyePrim);
      if (eyeKind === 'angry') prims.push(E(eyePrim.c, M3.mul(body.L, M3.mul(ax, M3.diag(EYE_R[0] * 1.12, EYE_R[1] * 1.1, EYE_R[2] * 1.15))), id + 2, id + 2, lidMat));
      let sP;
      if (closed) sP = [0, 0.05, 1];
      else if (eyeKind === 'angry') sP = [0.3, -0.25, 1];
      else if (eyeKind === 'dizzy') sP = [0, 0, 1];
      else sP = [0.28, -0.08, 1];
      sP = nrm(sP);
      const at = { prim: eyePrim, p: add(eyePrim.c, M3.v(eyePrim.L, sP)), s: sP };
      stamps.push({ at, set: EYE_SETS[eyeKind] || EYE_SETS.open, colors: EYEC, kind: 'open' });
      anchors[side > 0 ? 'eyeN' : 'eyeF'] = at.p;
    }

    // --- cream face (muzzle, with the Λ top edge and the optional mouth) and belly shells
    const mouthH = P.mouth;
    const hh = 0.13 * mouthH + 0.03, vc = -0.53 + hh;
    const muzMat = (s) => {
      if (MUZ_C[1] + MUZ_R[1] * s[1] >= LAM_Y - LAM_K * Math.abs(MUZ_R[2] * s[2])) return 0;
      if (mouthH > 0.02 && s[0] > 0) {
        // small mouth just above the smile line, opening upward
        const dv = (s[1] - vc) / hh, az = Math.atan2(s[2], s[0]) / 0.24;
        if (dv * dv + az * az < 1) return dv < -0.25 && mouthH > 0.4 ? C_TONGUE : C_MOUTH;
      }
      return C_CREAM;
    };
    prims.push(ellF(chain(body, T(...MUZ_C)), MUZ_R, 3, 3, muzMat));
    BEL.forEach((b, i) => prims.push(ellF(chain(body, T(...b.c)), b.r, 4 + i, 4 + i, M_CREAM)));

    // --- hood (red carapace) with the Λ window, its lining and the lower body
    const hoodPrim = ellF(hood, HOOD_R, 1, 2, hoodMat);
    prims.push(hoodPrim);
    for (const sp of SPIKES) for (const f of sp.faces) prims.push(PL(inF(body, f.M), M3.mul(body.L, f.axes), 8, 2, sp.shape, 1.01));

    // --- claws
    for (const side of [1, -1]) {
      const arm = side > 0 ? P.armN : P.armF, open = Math.max(0, Math.min(1, side > 0 ? P.clawN : P.clawF));
      const k = armKey(arm);
      const W = [k.W[0], k.W[1], k.W[2] * side], X = [k.X[0], k.X[1], k.X[2] * side];
      let Y = [k.Y[0], k.Y[1], k.Y[2] * side];
      Y = nrm(sub(Y, sc(X, dot(Y, X))));
      const CF = chain(body, F(M3.cols(X, Y, cross(X, Y)), W));
      const base = side > 0 ? 20 : 30;
      // lower (cream) jaw + its bite face
      prims.push(ellF(chain(CF, T(CA, 0, 0)), [CA, CB, CC], base + 2, base + 2, lowerMat));
      if (open > 0.01) prims.push(PL(inF(CF, BITE_C), M3.mul(CF.L, BITE_L), base + 2, base + 2, BITE_G, 1.2));
      // upper (red) jaw hinged at the back
      const UF = chain(CF, T(...HINGE), R(M3.rz(open * 0.72)), T(-HINGE[0], -HINGE[1], 0));
      prims.push(ellF(chain(UF, T(CA, 0, 0)), [CA, CB, CC], base + 3, base + 3, upperMat));
      if (open > 0.01) prims.push(PL(inF(UF, BITE_C), M3.mul(UF.L, BITE_L), base + 3, base + 3, BITE_G, 1.2));
      // wrist knob and arm from the shoulder to the wrist
      prims.push(ellF(chain(CF, T(0.5, -0.5, 0)), [3.8, 3.8, 3.8], base + 1, base + 1, M_CREAM));
      prims.push(seg(inF(body, [-3, 46, 14 * side]), inF(CF, [-2, 0, 0]), 4.2, 4.2, base, base, M_SHELL));
      anchors[side > 0 ? 'clawTipN' : 'clawTipF'] = sc(add(inF(CF, TIP), inF(UF, TIP)), 0.5);
    }

    prims.push(ellF(hood, sc(HOOD_R, 0.9), 2, 1, M_LINING));
    prims.push(ellF(chain(body, T(...LOW_C)), LOW_R, 2, 1, lowMat));

    // --- legs (2-bone IK: hips follow the body, feet stay on the ground; tripod walk cycle)
    let li = 0;
    for (const side of [1, -1])
      for (const lg of LEGS) {
        // tripod gait for a sideways scuttle: lifted feet swing along z (and a little along x)
        const ph = P.walk + lg.ph + (side > 0 ? 0 : Math.PI);
        const lift = Math.max(0, Math.sin(ph)) * 5;
        const swing = Math.cos(ph) * 4.5;
        const hip = inF(body, [lg.hip[0], lg.hip[1], lg.hip[2] * side]);
        const foot = [lg.foot[0] + swing * 0.35, lift, lg.foot[2] * side * (1 + sq * 0.3) + swing];
        const d = sub(foot, hip), dl = len3(d);
        const dir = sc(d, 1 / dl);
        const a = Math.min(dl, (L_UP * L_UP - L_LO * L_LO + dl * dl) / (2 * dl));
        const h = Math.sqrt(Math.max(0, L_UP * L_UP - a * a));
        const out = nrm([foot[0] - hip[0], 0, foot[2] - hip[2]]);
        let bend = add([0, 1.3, 0], out);
        bend = nrm(sub(bend, sc(dir, dot(bend, dir))));
        const knee = add(add(hip, sc(dir, a)), sc(bend, h));
        const id = 40 + li++;
        // talon: fat rounded knee, curving outward, tapering to a sharp tip on the ground
        const kd = sub(foot, knee);
        const mid = add(add(knee, sc(kd, 0.5)), sc(out, 2));
        prims.push(seg(sub(knee, sc(kd, 0.18)), add(mid, sc(sub(foot, mid), 0.35)), 5.6, 5.2, id, id, M_SHELL));
        prims.push(seg(add(knee, sc(sub(mid, knee), 0.6)), foot, 2.6, 2.5, id, id, M_SHELL));
        prims.push(seg(hip, add(knee, sc(kd, 0.1)), 3.8, 3.8, id, id, M_SHELL));
      }

    // --- tail (flattened overlapping segments trailing back, ending in a fan)
    TAIL.forEach((t, i) => prims.push(ellF(chain(body, T(...t.c), R(M3.rz(t.a))), t.r, 60 + i, 60 + i, M_SHELL)));

    anchors.top = inF(body, [-4, 105, 0]); // central spike tip
    anchors.head = inF(body, HOOD_C);
    anchors.mouth = inF(body, [MUZ_C[0] + MUZ_R[0] * 0.85, MUZ_C[1] - MUZ_R[1] * 0.5, 0]);

    // uniform scale to the Pokédex height (0.6 m ≈ 105 px silhouette at yaw 1.1)
    for (const p of prims) { p.c = sc(p.c, SIZE); p.L = p.L.map((v) => v * SIZE); }
    for (const st of stamps) st.at.p = sc(st.at.p, SIZE);
    for (const key in anchors) anchors[key] = sc(anchors[key], SIZE);
    return { prims, anchors, pose: P, headPrim: hoodPrim, stamps, dots: NO_DOTS, pri: PRI, glossy: GLOSSY, baseMat: SHELL, shadowSteps: 16 };
  }

  /* ---------- eye stamps (pupils and closed-eye marks) ----------
     Every set uses Mudkip's exact key layout (the renderer looks glyphs up by name);
     each expression puts its glyphs in the open/openN/openF slots and is drawn as kind 'open'.
     k = pupil, b = dark lid line, w = white. */
  const stampSet = (o, oN, oF) => ({ open: o, openN: oN, openF: oF, happy: o, happyN: oN, happyF: oF, blink: o, blinkN: oN, blinkF: oF, sleep: o, sleepN: oN, sleepF: oF });
  const EYE_SETS = {
    open: stampSet(['kk', 'kk', 'kk'], ['kk', 'kk', 'kk'], ['k', 'k', 'k']),
    angry: stampSet(['kk', 'kk'], ['kk', 'kk'], ['k', 'k']),
    dizzy: stampSet(['.kkk.', 'k...k', 'k.k.k', 'k..kk', '.k...'], ['.kkk.', 'k...k', 'k.k.k', 'k..kk', '.k...'], ['.kk', 'k.k', 'kkk']),
    happy: stampSet(['..bb..', '.b..b.', 'b....b'], ['.bb.', 'b..b', 'b..b'], ['.b', 'b.', 'b.']),
    closed: stampSet(['......', '......', 'bbbbbb', '.bbbb.'], ['....', '....', 'bbbb', '.bb.'], ['..', '..', 'bb', '.b']),
  };
  const EYEC = { k: '#1c1012', w: '#ffffff', b: '#58150e' };

  const render = (model, opt) => Creature.render(model, opt);

  return { build, render, PAL, MAT, DEFAULT, meta: { heightM: 0.6, bw: 130, bh: 144, oy: 0.905 } };
})();

/* ------------------------------------------------------------------
   Luvdisc — the Rendezvous Pokémon (0.6 m ≈ 105 px heart at scale 1).
   A posable 3D model rendered straight to pixel art by the shared
   Creature pipeline (see src/creature.js, dev/CREATURE_GUIDE.md).
   Model space: x = forward, y = up, z = near side at yaw 0, y = 0 at the
   bottom of the heart.

   Build: a laterally thin heart, fitted to the official silhouette: upper
   and lower lobe ellipsoids, a central filler (the cleft is at the back) and
   two thin front-edge ellipsoids that converge on the puckered pale lips
   (a round blob plus two beak halves; the mouth line is a mid-plane decal).
   Dark-blue eye stamps (mirrored on the far side) and pale cheek patches.
------------------------------------------------------------------- */
const Luvdisc = (() => {
  const { chain, T, R, F, code } = Creature;

  // ---- materials
  const BODY = 1, LIPS = 2, CHEEK = 3, BLUSH = 4;
  const MAT = { BODY, LIPS, CHEEK, BLUSH };
  const PAL = Creature.palette({
    [BODY]: { r: ['#bc5a72', '#d97f8b', '#ea959c', '#f6b4b6', '#ffd4d2'], od: '#6a1e34', ol: '#a8465c', ln: '#a8465c' },
    [LIPS]: { r: ['#d49aa4', '#e8b6bd', '#f6d2d5', '#fde4e4', '#fff5f3'], od: '#6a1e34', ol: '#9a4458', ln: '#8a3a4e' },
    [CHEEK]: { r: ['#dc9aa4', '#eebcc2', '#fad8da', '#ffeceb', '#fff8f7'], od: '#6a1e34', ol: '#9a4458', ln: '#8a3a4e' },
    [BLUSH]: { r: ['#d2385e', '#e84f74', '#f76a8c', '#ff8aa6', '#ffb4c6'], od: '#6a1e34', ol: '#a8304e', ln: '#b0304f' },
  });
  const GLOSSY = { [LIPS]: 1 };
  const NO_DOTS = [{}].slice(1); // empty, but with the elements kind of Mudkip's dot list
  const C_BODY = code(BODY), C_LIPS = code(LIPS), C_CHEEK = code(CHEEK), C_BLUSH = code(BLUSH);
  const C_BODY_L = code(BODY, 1);
  const M_BODY = () => C_BODY, M_BODY_L = () => C_BODY_L, M_LIPS = () => C_LIPS, M_CHEEK = () => C_CHEEK, M_BLUSH = () => C_BLUSH;

  // ---- helpers
  const add = V3.add, sub = V3.sub, sc = V3.scale, cross = V3.cross, nrm = V3.norm;
  const inF = (f, p) => add(f.t, M3.v(f.L, p));
  // Primitives, stamps and the model reuse Mudkip's exact object layouts (monomorphic renderer).
  const E = (c, L, part, grp, mat) => ({ kind: 'ell', part, grp, c, L, mat });
  const ellF = (f, r, part, grp, mat) => E(f.t, M3.mul(f.L, M3.diag(r[0], r[1], r[2])), part, grp, mat);

  // ---- body (heart) geometry, fitted to the official silhouette (side view)
  const CEN = [0, 52, 0]; // pivot for tilt / wiggle
  const THK = 10; // half-thickness (laterally thin)
  const LOBES = [
    { c: [-8, 74.6, 0], r: [31.6, 19.6, THK], a: -1.29 }, // upper lobe
    { c: [-7.2, 27.3, 0], r: [27.5, 20.4, THK], a: 1.4 }, // lower lobe
    { c: [-7, 52, 0], r: [15.5, 30, THK + 0.8], a: 0 }, // central filler (smooths the mid crease, fills the cleft)
    { c: [10.2, 67.6, 0], r: [27, 6, THK * 0.55], a: -1.15 }, // upper front edge (runs into the lips)
    { c: [10, 32, 0], r: [28.8, 6.4, THK * 0.55], a: 1.18 }, // lower front edge
  ];
  const LIP_C = [18.4, 49.5, 0]; // centre of the lip blob

  // ---- face: eye and cheek positions on the side of the body (model units)
  const EYE_P = [0.5, 59.5], CHEEK_P = [-4.2, 50];
  // unit-sphere direction on the filler's side surface at model (x, y), side ±1
  const FILL = LOBES[2];
  function sideDir(x, y, side) {
    const u = (x - FILL.c[0]) / FILL.r[0], v = (y - FILL.c[1]) / FILL.r[1];
    return [u, v, side * Math.sqrt(Math.max(0.02, 1 - u * u - v * v))];
  }

  const PRI = {};
  for (let i = 1; i < 9; i++) PRI[i] = 0;
  Object.assign(PRI, { 5: 3, 7: 4, 8: 4 });

  const SIZE = 0.98;
  const DEFAULT = { wiggle: 0, kiss: 0, eyes: 'open', tilt: 0, blush: 0, side: 1 };

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const prims = [], stamps = [], anchors = {};
    // whole-body pitch about the heart's centre
    const body = chain(F(M3.I(), CEN), R(M3.rz(P.tilt)), T(-CEN[0], -CEN[1], -CEN[2]));
    // the back of the heart swings sideways (swimming wiggle), pivoting at the lips' base
    const wig = Math.max(-1, Math.min(1, P.wiggle));
    const back = chain(body, T(14, 0, 0), R(M3.ry(wig * 0.27)), T(-14, 0, 0));

    // --- cheeks (patches on the body's sides), in front of the body
    const bl = Math.max(0, Math.min(1, P.blush));
    const cheekMat = bl > 0.45 ? M_BLUSH : M_CHEEK;
    const cs = 1 + bl * 0.25;
    const fillPrim = ellF(chain(back, T(...FILL.c)), FILL.r, 1, 1, M_BODY);
    for (const side of [1, -1]) {
      const s = sideDir(CHEEK_P[0], CHEEK_P[1], side);
      const nw = nrm([s[0] / FILL.r[0], s[1] / FILL.r[1], s[2] / FILL.r[2]]);
      const up = nrm(sub([0, 1, 0], sc(nw, nw[1])));
      const ax = M3.cols(cross(up, nw), up, nw);
      const cLoc = sub(add(FILL.c, [FILL.r[0] * s[0], FILL.r[1] * s[1], FILL.r[2] * s[2]]), sc(nw, 1.2));
      const id = side > 0 ? 7 : 8;
      prims.push(E(inF(back, cLoc), M3.mul(back.L, M3.mul(ax, M3.diag(4.1 * cs, 7 * cs, 2))), id, id, cheekMat));
    }

    // --- lips (front-most): a round blob plus two beak halves converging on a point;
    //     the mouth line is a decal in the mid-plane, so it reads from either side
    // kiss: the pucker pushes forward while the lips' base stays anchored in the body
    const k = Math.max(0, Math.min(1, P.kiss));
    const lipBase = chain(body, T(LIP_C[0] + k * 1.6, LIP_C[1], 0), R(M3.diag(1, 1 + k * 0.06, 1 + k * 0.1)));
    const bx = 9.2 * (1 + k * 0.3), bt = 0.55 + k * 0.2, by = 2.3 - k * 0.3, fx = bx - 4.6;
    prims.push(ellF(chain(lipBase, T(fx, by, 0), R(M3.rz(-bt))), [6.8, 3.7, 6.2], 5, 5, M_LIPS));
    prims.push(ellF(chain(lipBase, T(fx, -by, 0), R(M3.rz(bt))), [6.8, 3.7, 6.2], 5, 5, M_LIPS));
    const blob = ellF(lipBase, [bx, 8.2, 8.6], 5, 5, M_LIPS);
    const tip = (fx + 6.8 * Math.cos(bt) * 0.98) / bx;
    blob.lines = [{ pts: [[tip, 0, 0], [tip * 0.5, 0.02, 0], [tip * 0.18, 0.06, 0]], tone: 1, mat: LIPS, useLn: true }];
    prims.push(blob);

    // --- body lobes
    prims.push(fillPrim);
    // (the upper front edge is one tone lighter: the official art's highlight along that edge)
    LOBES.forEach((l, i) => {
      if (i !== 2) prims.push(ellF(chain(back, T(...l.c), R(M3.rz(l.a))), l.r, 1, 1, i === 3 ? M_BODY_L : M_BODY));
    });

    // --- eyes (stamps on the sides; far-side set is mirrored so the highlight stays toward the back)
    for (const side of [1, -1]) {
      const s = sideDir(EYE_P[0], EYE_P[1], side);
      const kind = P.eyes === 'happy' ? 'happy' : P.eyes === 'blink' || P.eyes === 'closed' ? 'blink' : 'open';
      stamps.push({ at: { prim: fillPrim, p: add(fillPrim.c, M3.v(fillPrim.L, s)), s }, set: side > 0 ? EYES : EYES_M, colors: EYEC, kind });
    }

    anchors.lips = inF(lipBase, [fx + 6.8 * Math.cos(bt), 0, 0]);
    anchors.top = inF(back, [-12, 105, 0]);
    anchors.center = inF(body, CEN);

    // uniform scale to the Pokédex height (0.6 m ≈ 105 px heart)
    for (const q of prims) { q.c = sc(q.c, SIZE); q.L = q.L.map((v) => v * SIZE); }
    for (const st of stamps) st.at.p = sc(st.at.p, SIZE);
    for (const key in anchors) anchors[key] = sc(anchors[key], SIZE);
    return { prims, anchors, pose: P, headPrim: fillPrim, stamps, dots: NO_DOTS, pri: PRI, glossy: GLOSSY, baseMat: BODY, shadowSteps: 12 };
  }

  /* ---------- eye stamps (Mudkip's key layout) ----------
     k = black, b = dark blue, w = white highlight (toward the back of the fish) */
  const mirror = (g) => g.map((row) => row.split('').reverse().join(''));
  const G_OPEN = ['..kkk..', '.kkkkk.', 'kwwkkkk', 'kwwkkkk', 'kwkkkkk', 'kkkkkkk', 'kkkkbbk', 'kkkbbbk', 'kkbbbbk', '.kbbbk.', '..kkk..'];
  const G_OPEN_N = ['.kkkk.', 'kwwkkk', 'kwwkkk', 'kwkkkk', 'kkkkkk', 'kkkkkk', 'kkkbbk', 'kkbbbk', 'kbbbbk', '.kbbk.', '..kk..'];
  const G_OPEN_F = ['.kkk.', 'kwkkk', 'kwkkk', 'kkkkk', 'kkkkk', 'kkkbk', 'kkbbk', 'kbbbk', '.kbk.'];
  const G_HAPPY = ['...k...', '..kkk..', '.kk.kk.', 'kk...kk', 'k.....k'];
  const G_BLINK = ['.......', '.......', '.......', '.......', 'kkkkkkk', '.kkkkk.'];
  const mk = (tr) => ({
    open: tr(G_OPEN), openN: tr(G_OPEN_N), openF: tr(G_OPEN_F),
    happy: tr(G_HAPPY), happyN: tr(['..kk..', '.kkkk.', 'kk..kk', 'k....k']), happyF: tr(['..k..', '.kkk.', 'kk.kk', 'k...k']),
    blink: tr(G_BLINK), blinkN: tr(['......', '......', '......', '......', 'kkkkkk', '.kkkk.']), blinkF: tr(['.....', '.....', '.....', 'kkkkk', '.kkk.']),
    sleep: tr(['k...k', '.kkk.']), sleepN: tr(['k..k', '.kk.']), sleepF: tr(['k..', '.kk']),
  });
  const EYES = mk((g) => g), EYES_M = mk(mirror);
  const EYEC = { k: '#140c1c', w: '#ffffff', b: '#26538a' };

  const render = (model, opt) => Creature.render(model, opt);

  return { build, render, PAL, MAT, DEFAULT, meta: { heightM: 0.6, bw: 94, bh: 118, oy: 0.94 } };
})();

/* ------------------------------------------------------------------
   Pelipper — the Water Bird Pokémon. A posable 3D model rendered
   straight to pixel art by the shared Creature renderer.
   Model space: x = forward, y = up, z = near side at yaw 0, ground at y = 0.
------------------------------------------------------------------- */
const Pelipper = (() => {
  const { ell, plate, chain, T, R, F, sph, code } = Creature;

  // material ids
  const WHITE = 1, CAP = 2, BILL = 3, MOUTH = 4, TIP = 5, FEET = 6, EYEW = 7, EYE = 8;
  const MAT = { WHITE, CAP, BILL, MOUTH, TIP, FEET, EYEW, EYE };

  const PAL = Creature.palette({
    [WHITE]: { r: ['#9aa6c6', '#c1cbe2', '#e6ecf6', '#f8fafd', '#ffffff'], od: '#3a4870', ol: '#6c7ca6', ln: '#8795bb' },
    [CAP]:   { r: ['#3d6396', '#5783b8', '#7ea7d4', '#a6c6e8', '#d2e6f8'], od: '#1e3560', ol: '#3b5d90', ln: '#34568a' },
    [BILL]:  { r: ['#be9448', '#ddb865', '#f4d88f', '#fbe9b5', '#fff7de'], od: '#6e4c18', ol: '#a67d34', ln: '#a27a32' },
    [MOUTH]: { r: ['#7a3a58', '#9c5676', '#c27e9b', '#daa2ba', '#efc8d8'], od: '#4a1830', ol: '#6c2b48', ln: '#6c2b48' },
    [TIP]:   { r: ['#3c6ca4', '#5a92c9', '#7fb2de', '#9cc8ec', '#b9dbf6'], od: '#1c3968', ol: '#36689e', ln: '#2e5a90' },
    [FEET]:  { r: ['#34609a', '#4d82bc', '#71a6d8', '#98c4ec', '#c4e2fb'], od: '#193360', ol: '#315f96', ln: '#2a5288' },
    [EYEW]:  { r: ['#c5cfe4', '#e0e7f4', '#f9fbff', '#ffffff', '#ffffff'], od: '#1b2136', ol: '#283150', ln: '#1e2539' },
    [EYE]:   { r: ['#0d111d', '#131827', '#181e2f', '#20283b', '#34405a'], od: '#0a0d17', ol: '#0a0d17', ln: '#0a0d17' },
  });
  const GLOSSY = {};

  const DEFAULT = { flap: 0, spread: 0, bill: 0.12, pitch: 0, feet: 0, pouch: 0, eyes: 'open', side: 1 };

  /* ---------- small math helpers ---------- */
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpV = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const MIRZ = M3.diag(1, 1, -1);
  const mirror = (f) => F(M3.mul(MIRZ, f.L), M3.v(MIRZ, f.t)); // mirror a local frame across z = 0
  const P2W = (f, p) => V3.add(f.t, M3.v(f.L, p));
  const transpose = (m) => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
  function rotAxis(a, t) {
    const c = Math.cos(t), s = Math.sin(t), C = 1 - c, [x, y, z] = a;
    return [c + x * x * C, x * y * C - z * s, x * z * C + y * s, y * x * C + z * s, c + y * y * C, y * z * C - x * s, z * x * C - y * s, z * y * C + x * s, c + z * z * C];
  }
  function slerpM(A, B, t) {
    const Q = M3.mul(transpose(A), B);
    const ang = Math.acos(clamp((Q[0] + Q[4] + Q[8] - 1) / 2, -1, 1));
    if (ang < 1e-5) return A;
    return M3.mul(A, rotAxis(V3.norm([Q[7] - Q[5], Q[2] - Q[6], Q[3] - Q[1]]), ang * t));
  }
  // orthonormal rotation whose first column is u and third column is close to w
  function frameUW(u, w) {
    const U = V3.norm(u);
    const W = V3.norm(V3.sub(w, V3.scale(U, V3.dot(w, U))));
    return M3.cols(U, V3.cross(W, U), W);
  }

  /* ---------- wing shapes (u = span from the joint, v = chord, +v = leading edge) ---------- */
  const ARM_L = 70;
  const ARM = bakeShape(Shape2D.poly([[-6, -4], [-3, 12], [16, 16.5], [45, 18], [70, 18.5], [77, 14], [78, 0], [76, -18], [58, -24], [30, -23], [8, -19], [-4, -12]], code(WHITE, 1)));
  const FINGERS = [
    { v0: 13, len: 56, fan: 4.5 },
    { v0: 2, len: 62, fan: 1.5 },
    { v0: -9, len: 59, fan: -1.5 },
    { v0: -19.5, len: 51, fan: -4.5 },
  ];
  const FW = 6.6, FU0 = 16;
  const whiteEdge = (v) => 25 + 0.01 * v * v;
  const FSEG = FINGERS.map((f) => [FU0, f.v0, FU0 + f.len, f.v0 + f.fan]);
  const HAND_POLY = Shape2D.catmull([[-6, 0], [-5, 16], [8, 19.5], [24, 20], [29, 0], [25, -25], [8, -26], [-5, -18]], true, 8);
  const HAND = bakeShape({
    bb: [-8, -30, FU0 + 72, 28],
    test(u, v) {
      for (const s of FSEG) if (Shape2D.segDist(u, v, s[0], s[1], s[2], s[3]) < FW) return u > whiteEdge(v) ? code(TIP, 1) : code(WHITE, 1);
      return Shape2D.inPoly(u, v, HAND_POLY) ? code(WHITE, 1) : 0;
    },
  });
  // separation lines between the blue feathers + the white/blue boundary
  const HAND_LINES = [];
  for (let k = 0; k < 3; k++) {
    const a = FSEG[k], b = FSEG[k + 1], pts = [];
    for (let i = 0; i <= 6; i++) {
      const u = lerp(whiteEdge((a[1] + b[1]) / 2), FU0 + Math.min(FINGERS[k].len, FINGERS[k + 1].len) * 0.94, i / 6);
      const fa = (u - a[0]) / (a[2] - a[0]), fb = (u - b[0]) / (b[2] - b[0]);
      pts.push([u, (lerp(a[1], a[3], fa) + lerp(b[1], b[3], fb)) / 2, 0]);
    }
    HAND_LINES.push({ pts, mat: TIP, useLn: true });
  }
  {
    const pts = [];
    for (let v = -26; v <= 20; v += 2) pts.push([whiteEdge(v), v, 0]);
    HAND_LINES.push({ pts, mat: TIP, useLn: true });
  }

  /* ---------- head decals (head-local unit sphere) ---------- */
  const EYE_AZ = 1.15, EYE_V = -0.1;
  const EC = sph(EYE_AZ, EYE_V);
  const ETY = V3.norm(V3.sub([0, 1, 0], V3.scale(EC, EC[1])));
  const ETX = V3.cross(ETY, EC); // points toward the bill
  const EA = 0.44, EB = 0.54, ETILT = 0.14;
  let curScale = 1, eyeCull = [0, 0, 0, 0]; // eyeCull: camera direction in head space per eye side
  function eyeMat(s, kind) {
    if ((s[2] < 0 ? eyeCull[1] : eyeCull[0]) < 0.3) return 0;
    const m = s[2] < 0 ? [s[0], s[1], -s[2]] : s;
    if (m[0] * EC[0] + m[1] * EC[1] + m[2] * EC[2] < 0.45) return 0;
    const dx = m[0] - EC[0], dy = m[1] - EC[1], dz = m[2] - EC[2];
    const ex0 = dx * ETX[0] + dy * ETX[1] + dz * ETX[2], ey0 = dx * ETY[0] + dy * ETY[1] + dz * ETY[2];
    const c = Math.cos(ETILT), sn = Math.sin(ETILT);
    const ex = ex0 * c + ey0 * sn, ey = -ex0 * sn + ey0 * c;
    const px = 1 / (curScale * 30); // ~one pixel in unit-sphere units
    if (kind === 'closed') {
      const yc = -0.22 + 1.1 * ex * ex;
      return Math.abs(ey - yc) < Math.max(0.05, 1.1 * px) && Math.abs(ex) < EA * 0.8 ? code(EYE) : 0;
    }
    if ((ex / EA) ** 2 + (ey / EB) ** 2 > 1) return 0;
    if (kind === 'happy') {
      const r = (ex / 0.28) ** 2 + ((ey + 0.12) / 0.32) ** 2;
      return ey > -0.12 && r < 1 && r > 0.4 ? code(EYE) : code(EYEW);
    }
    if (kind === 'blink') return ey < 0.0 && ey > -0.22 && Math.abs(ex) < 0.28 ? code(EYE) : ey > 0.06 ? 0 : code(EYEW);
    const pr = ((ex - 0.01) / 0.23) ** 2 + ((ey + 0.01) / 0.36) ** 2;
    if (pr < 1) return Math.abs(ey + 0.01) < Math.max(0.045, 0.8 * px) ? code(EYEW) : code(EYE);
    return code(EYEW);
  }
  function capMat(s) {
    const b = 0.38 - 2.4 * Math.max(0, s[0] - 0.8) - 0.12 * Math.max(0, -s[0]);
    return s[1] > b ? code(CAP) : 0;
  }
  const crestCapMat = (s) => (s[1] > 0.08 + 0.9 * Math.max(0, -s[0] - 0.3) ? code(CAP) : 0);
  const tipCapMat = () => 0;

  // upper bill: one long ellipsoid (radii UB, centre UBC in the bill frame, tilted UBT) cut at y = -3
  const UB = [104, 28, 36], UBC = [50, -10, 0], UBT = -0.13;
  // its cross-section at the cut plane (the palate) is an ellipse: centre PAL_U0, half-axes PAL_A x PAL_B
  const [PAL_U0, PAL_A, PAL_B] = (() => {
    const c = Math.cos(UBT), s = Math.sin(UBT), dy = -3 - UBC[1];
    const A2 = UB[0] * UB[0], B2 = UB[1] * UB[1];
    const al = (c * c) / A2 + (s * s) / B2, be = dy * c * s * (1 / A2 - 1 / B2), ga = dy * dy * ((s * s) / A2 + (c * c) / B2);
    const K = 1 - (ga - (be * be) / al);
    return [UBC[0] - be / al, Math.sqrt(K / al), UB[2] * Math.sqrt(K)];
  })();

  // inner mouth walls: vertical plates starting at z = ±CHEEK_Z by the hinge and converging toward the tip
  // (angle CHEEK_A) so the upper bill always covers them from above; CHEEK_X = forward extent
  const CHEEK_Z = 27, CHEEK_A = 0.15;
  const CHEEK_X = (() => {
    const Ri = M3.rz(-UBT);
    let xm = 0;
    for (let u = 0; u < 160; u += 0.5) {
      const x = u * Math.cos(CHEEK_A), z = CHEEK_Z - u * Math.sin(CHEEK_A) + 1.5;
      if (((x - PAL_U0) / PAL_A) ** 2 + (z / PAL_B) ** 2 < 1) xm = u;
    }
    return xm - 2;
  })();

  // unit-disk rim plate: mouth interior with a yellow lip
  const rimMat = (s) => { const r = s[0] * s[0] + s[2] * s[2]; return r > 0.6 ? code(BILL) : code(MOUTH, r < 0.25 && s[0] < 0 ? -1 : 0); };

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const sp = clamp(P.spread, 0, 1), fl = clamp(P.flap, -1, 1), bo = clamp(P.bill, 0, 1), pb = clamp(P.pouch, 0, 1), ft = clamp(P.feet, 0, 1);
    const prims = [];
    const lean = sp * 0.35;
    const CG = [-10, 100, 0];
    const top = chain(T(...CG), R(M3.rz(P.pitch - lean)), T(-CG[0], -CG[1], -CG[2]));
    const W = () => code(WHITE);

    // --- body, tail, neck
    const bodyF = chain(top, T(-16, 78, 0), R(M3.rz(-0.26)));
    prims.push(ell(bodyF, [32, 58, 32], { part: 1, grp: 1, mat: W }));
    prims.push(ell(chain(top, T(-48, 42, 0), R(M3.rz(0.6))), [18, 4, 10], { part: 1, grp: 1, mat: W }));
    prims.push(ell(chain(top, T(-8, 142, 0), R(M3.rz(-0.3))), [26, 30, 26], { part: 2, grp: 2, mat: W }));

    // --- head, crest, cap and eye shells
    const headF = chain(top, T(4, 178, 0), R(M3.rz(lean * 0.85)));
    const HR = [32, 31, 30], C1 = [40, 17, 12.5], C2 = [16, 5.5, 5];
    prims.push(ell(headF, HR, { part: 2, grp: 2, mat: W }));
    const c1F = chain(headF, T(-24, 9, 0), R(M3.rz(-0.12)));
    const c2F = chain(headF, T(-57, 14.5, 0), R(M3.rz(-0.16)));
    prims.push(ell(c1F, C1, { part: 2, grp: 2, mat: W }));
    prims.push(ell(c2F, C2, { part: 2, grp: 2, mat: W }));
    prims.push(ell(headF, V3.scale(HR, 1.012), { part: 3, grp: 3, mat: capMat }));
    prims.push(ell(c1F, V3.scale(C1, 1.015), { part: 3, grp: 3, mat: crestCapMat }));
    const kind = P.eyes;
    prims.push(ell(headF, V3.scale(HR, 1.022), { part: 4, grp: 4, mat: (s) => eyeMat(s, kind) }));

    // --- bill: tapered upper bill + pouch, hinged at the lower front of the head
    const hinge = [20, -30, 0];
    const TILT = 0.08, tu = bo * 0.5, tl = bo * 0.1;
    const ubF = chain(headF, T(...hinge), R(M3.rz(TILT + tu)));
    // one long ellipsoid tilted nose-down and cut at the mouth plane (y = -3): thick base, pointed tip
    const ubE = chain(ubF, T(...UBC), R(M3.rz(UBT)));
    const sT = Math.sin(UBT) * UB[0], cT = Math.cos(UBT) * UB[1];
    prims.push(ell(ubE, UB, { part: 5, grp: 5, mat: (s) => (UBC[1] + sT * s[0] + cT * s[1] < -3 ? 0 : code(BILL)) }));
    // palate: the cut face of the upper bill, a flat pink ellipse (only visible once the bill opens)
    if (bo > 0.15) prims.push(ell(chain(ubF, T(PAL_U0, -3.4, 0)), [PAL_A, 1.2, PAL_B], { part: 9, grp: 5, mat: () => code(MOUTH, 1) }));
    // chin / throat under the head, filling the corner of the gape
    prims.push(ell(chain(headF, T(2, -33, 0)), [28, 14, 27], { part: 2, grp: 2, mat: W }));
    const lbF = chain(headF, T(...hinge), R(M3.rz(TILT - tl)));
    const PR = [82 * (1 + 0.06 * pb), 96 * (1 + 0.12 * pb), 55 * (1 + 0.2 * pb)];
    const RIM = 0.3, rimK = Math.sqrt(1 - RIM * RIM);
    const pouchF = chain(lbF, T(54, -3 - RIM * PR[1], 0));
    prims.push(ell(pouchF, PR, { part: 6, grp: 6, mat: (s) => (s[1] > RIM ? 0 : code(BILL)) }));
    const rimF = chain(pouchF, T(0, RIM * PR[1] - 0.6, 0));
    prims.push(ell(rimF, [PR[0] * rimK, 1.2, PR[2] * rimK], { part: 7, grp: 6, mat: rimMat }));
    // mouth: pink inner walls at z = ±CHEEK_Z spanning the wedge between the jaws (visible whenever the bill parts)
    if (bo > 0.02) {
      const cu = Math.cos(tu), su = Math.sin(tu), cl = Math.cos(tl), sl = Math.sin(tl);
      const hF = chain(headF, T(...hinge), R(M3.rz(TILT)));
      const cheek = {
        bb: [1, -8 - CHEEK_X * sl, CHEEK_X + 1, 4 + CHEEK_X * su],
        test(u, v) {
          if (u < 2 || u > CHEEK_X || -u * su + v * cu > -3 || u * sl + v * cl < -3.5) return 0;
          return code(MOUTH, u < 30 ? -2 : -1);
        },
      };
      for (const k of [1, -1]) prims.push(plate(chain(hF, T(0, 0, k * CHEEK_Z), R(M3.ry(k * CHEEK_A))), cheek, { part: 8, grp: 7, thick: 1.2, farSide: k }));
    }

    // --- wings (near side built, far side mirrored)
    const tips = [];
    for (const side of [1, -1]) {
      const a = 0.42;
      const Rf = M3.mul(M3.rx(-fl * 0.35), frameUW([-0.12, -Math.cos(a), Math.sin(a)], [0.75, 0, 0.66]));
      const Rs = M3.mul(M3.rx(-fl * 1.05), frameUW([-0.16, 0, 1], [0, 1, 0]));
      const Rw = slerpM(Rf, Rs, sp);
      const sc = 0.74 + 0.26 * sp;
      const beta = lerp(-0.05, fl * 0.35, sp);
      const sh = lerpV([-6, 136, 30], [-10, 130, 26], sp);
      let armF = F(M3.mul(Rw, M3.diag(sc, 1, 1)), sh);
      const wrist = V3.add(sh, M3.v(Rw, [(ARM_L - 3) * sc, 0, 0]));
      let handF = F(M3.mul(Rw, M3.ry(-beta)), wrist);
      if (side < 0) { armF = mirror(armF); handF = mirror(handF); }
      armF = chain(top, armF); handF = chain(top, handF);
      const pid = side > 0 ? 10 : 12, g = side > 0 ? 10 : 11;
      prims.push(plate(armF, ARM, { part: pid, grp: g, thick: 1.8 }));
      prims.push(plate(handF, HAND, { part: pid + 1, grp: g, thick: 1.8, lines: HAND_LINES }));
      tips.push(P2W(handF, [FU0 + 60, 0, 0]));
    }

    // --- legs and webbed feet (pad + three toes)
    const feetPts = [];
    const FM = () => code(FEET);
    for (const side of [1, -1]) {
      let legF = chain(T(-12, 20, 12), R(M3.rz(-ft * 1.5)), R(M3.rx(-0.08)));
      if (side < 0) legF = mirror(legF);
      legF = chain(top, legF);
      const pid = side > 0 ? 14 : 15;
      prims.push(ell(chain(legF, T(0, -7, 0)), [5, 8.5, 5], { part: pid, grp: pid, mat: FM }));
      const footF = chain(legF, T(2, -16.6, 0.5));
      prims.push(ell(footF, [6.5, 3.2, 6], { part: pid, grp: pid, mat: FM }));
      for (const ta of [-0.62, 0, 0.62]) prims.push(ell(chain(footF, R(M3.ry(ta)), T(8, -1, 0), R(M3.rz(-0.12))), [8.5, 2.2, 2.4], { part: pid, grp: pid, mat: FM }));
      feetPts.push(P2W(footF, [0, -3.4, 0]));
    }

    const anchors = {
      pouch: P2W(pouchF, [0, -0.12 * PR[1], 0]),
      mouth: rimF.t,
      billTip: P2W(ubF, [128, -1, 0]),
      top: P2W(headF, [0, HR[1] * 1.012, 0]),
      head: headF.t,
      feet: V3.scale(V3.add(feetPts[0], feetPts[1]), 0.5),
      body: bodyF.t,
      wingTipN: tips[0], wingTipF: tips[1],
      eyeN: P2W(headF, [HR[0] * EC[0], HR[1] * EC[1], HR[2] * EC[2]]),
      eyeF: P2W(headF, [HR[0] * EC[0], HR[1] * EC[1], -HR[2] * EC[2]]),
    };
    return {
      prims, anchors, pose: P, stamps: [], dots: [], headL: M3.mul(headF.L, M3.diag(...HR)),
      pri: { 1: 0, 2: 0, 3: 1, 4: 2, 5: 1, 6: 0, 7: 0, 10: 1, 11: 1, 14: 1, 15: 1 },
      glossy: GLOSSY, baseMat: WHITE, shadowSteps: 14,
    };
  }

  /* ---------- render: ray-cast only the creature's screen box, then paste into the full buffer ---------- */
  function render(model, opt) {
    curScale = opt.scale || 1;
    const { yaw = 1.05, pitch = 0.16, scale = 1, W = 96, H = 96, ox = 48, oy = 82 } = opt;
    // eyes: facing of each eye centre toward the camera (skip eyes seen edge-on)
    if (model.headL) {
      const M = M3.mul(M3.rx(pitch), M3.ry(-yaw)), cam = [M[6], M[7], M[8]];
      const Li = M3.inv(model.headL);
      for (const k of [0, 1]) {
        const e = [EC[0], EC[1], k ? -EC[2] : EC[2]];
        const n = V3.norm([Li[0] * e[0] + Li[3] * e[1] + Li[6] * e[2], Li[1] * e[0] + Li[4] * e[1] + Li[7] * e[2], Li[2] * e[0] + Li[5] * e[1] + Li[8] * e[2]]);
        eyeCull[k] = V3.dot(n, cam);
      }
    } else eyeCull = [1, 1];
    // inner mouth walls: only the wall on the far side of the mouth is ever visible
    const cz = Math.cos(yaw);
    if (model.prims.some((p) => p.farSide)) model = Object.assign({}, model, { prims: model.prims.filter((p) => !p.farSide || (Math.abs(cz) > 0.35 && p.farSide * cz < 0)) });
    const V = M3.mul(M3.rx(pitch), M3.mul(M3.ry(-yaw), M3.diag(scale, scale, scale)));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of model.prims) {
      const cv = M3.v(V, p.c), Lv = M3.mul(V, p.L);
      if (p.kind === 'ell') {
        const rx = Math.hypot(Lv[0], Lv[1], Lv[2]), ry = Math.hypot(Lv[3], Lv[4], Lv[5]);
        x0 = Math.min(x0, cv[0] - rx); x1 = Math.max(x1, cv[0] + rx); y0 = Math.min(y0, -cv[1] - ry); y1 = Math.max(y1, -cv[1] + ry);
      } else {
        const [a, b, c, d] = p.shape.bb;
        for (const u of [a, c]) for (const v of [b, d]) for (const w of [-p.thick, p.thick]) {
          const qx = cv[0] + Lv[0] * u + Lv[1] * v + Lv[2] * w, qy = cv[1] + Lv[3] * u + Lv[4] * v + Lv[5] * w;
          x0 = Math.min(x0, qx); x1 = Math.max(x1, qx); y0 = Math.min(y0, -qy); y1 = Math.max(y1, -qy);
        }
      }
    }
    const bx0 = Math.max(0, Math.floor(ox + x0) - 3), bx1 = Math.min(W - 1, Math.ceil(ox + x1) + 3);
    const by0 = Math.max(0, Math.floor(oy + y0) - 3), by1 = Math.min(H - 1, Math.ceil(oy + y1) + 3);
    if (bx1 - bx0 < 4 || by1 - by0 < 4 || (bx1 - bx0 + 1) * (by1 - by0 + 1) > 0.8 * W * H) return Creature.render(model, opt);
    const w = bx1 - bx0 + 1, h = by1 - by0 + 1;
    const r = Creature.render(model, Object.assign({}, opt, { W: w, H: h, ox: ox - bx0, oy: oy - by0 }));
    const buf = new PX.Buf(W, H), depth = new Float32Array(W * H).fill(-1e9), part = new Uint8Array(W * H);
    for (let y = 0; y < h; y++) {
      const s = y * w, d = (y + by0) * W + bx0;
      buf.d.set(r.buf.d.subarray(s, s + w), d);
      depth.set(r.depth.subarray(s, s + w), d);
      part.set(r.part.subarray(s, s + w), d);
    }
    const anchors = {};
    for (const k in r.anchors) { const a = r.anchors[k]; anchors[k] = [a[0] + bx0, a[1] + by0, a[2]]; }
    return { buf, depth, part, W, H, ox, oy, anchors };
  }

  return { build, render, PAL, MAT, DEFAULT, meta: { heightM: 1.2, bw: 400, bh: 380, oy: 0.74 } };
})();

/* ------------------------------------------------------------------
   Wailord — the Float Whale Pokémon. A posable 3D model rendered
   straight to pixel art by the shared Creature renderer.
   Model space: x = forward, y = up, z = near side at yaw 0, ground
   (bottom of the belly) at y = 0. 175 units = 1 m: ~2540 long.
------------------------------------------------------------------- */
const Wailord = (() => {
  const { ell, plate, chain, T, R, F, code } = Creature;

  // material ids
  const BODY = 1, BELLY = 2, FIN = 3, MOUTH = 4, TONGUE = 5, EYE = 6, EYEW = 7;
  const MAT = { BODY, BELLY, FIN, MOUTH, TONGUE, EYE, EYEW };

  const PAL = Creature.palette({
    [BODY]:   { r: ['#1f5596', '#2e73b9', '#3c8ad1', '#56a2e0', '#cfeaff'], od: '#10295a', ol: '#1f4b8c', ln: '#1c4788' },
    [FIN]:    { r: ['#1f5596', '#2e73b9', '#3c8ad1', '#56a2e0', '#cfeaff'], od: '#10295a', ol: '#1f4b8c', ln: '#1b4583' },
    [BELLY]:  { r: ['#9c989b', '#bab6b7', '#d8d5d3', '#eae8e6', '#f8f7f5'], od: '#45404a', ol: '#6f6a70', ln: '#5e5963' },
    [MOUTH]:  { r: ['#3e0c1a', '#5c1426', '#7e2234', '#9c3446', '#b84c5a'], od: '#2a0610', ol: '#420c1a', ln: '#420c1a' },
    [TONGUE]: { r: ['#a43c52', '#c45468', '#de7282', '#ee94a0', '#f8b8c0'], od: '#5c1426', ol: '#7e2234', ln: '#8c2c40' },
    [EYE]:    { r: ['#0a0f1c', '#0e1422', '#121a2b', '#182236', '#223050'], od: '#070b14', ol: '#070b14', ln: '#070b14' },
    [EYEW]:   { r: ['#d8e4f4', '#eef4fc', '#ffffff', '#ffffff', '#ffffff'], od: '#070b14', ol: '#070b14', ln: '#070b14' },
  });

  const DEFAULT = { tail: 0, fin: 0, mouth: 0, eyes: 'open', blow: 0, roll: 0, side: 1 };

  /* ---------- helpers ---------- */
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const MIRZ = M3.diag(1, 1, -1);
  const mirror = (f) => F(M3.mul(MIRZ, f.L), M3.v(MIRZ, f.t));
  const P2W = (f, p) => V3.add(f.t, M3.v(f.L, p));
  function frameUW(u, w) {
    const U = V3.norm(u);
    const W = V3.norm(V3.sub(w, V3.scale(U, V3.dot(w, U))));
    return M3.cols(U, V3.cross(W, U), W);
  }

  /* ---------- body: a smooth asymmetric egg made of four quarter-ellipsoids that share one centre and
     tilt (front/rear lengths, top/bottom heights, common width). Each draws only its own quadrant, so
     the pieces meet with matching cross-sections and normals: no creases. Fitted to the official
     silhouette (big domed head, long taper to a mid-height tail). ---------- */
  const EGG = { c: [683, 0, 0], rxf: 580, rxr: 1657, ryt: 540, ryb: 540, rz: 575, a: 0.1 };
  {
    // put the lowest point of the belly on the ground (y = 0)
    const ca = Math.cos(EGG.a), sa = Math.sin(EGG.a);
    let lo = Infinity;
    for (let i = 0; i < 720; i++) {
      const t = (i / 720) * 2 * Math.PI, ct = Math.cos(t), st = Math.sin(t);
      const lx = ct * (ct >= 0 ? EGG.rxf : EGG.rxr), ly = st * (st >= 0 ? EGG.ryt : EGG.ryb);
      lo = Math.min(lo, sa * lx + ca * ly);
    }
    EGG.c[1] = -lo;
  }
  const QUADS = EGG.ryt === EGG.ryb ? [
    { id: 'F', r: [EGG.rxf, EGG.ryt, EGG.rz], sx: 1, sy: 0 },
    { id: 'R', r: [EGG.rxr, EGG.ryt, EGG.rz], sx: -1, sy: 0 },
  ] : [
    { id: 'FT', r: [EGG.rxf, EGG.ryt, EGG.rz], sx: 1, sy: 1 },
    { id: 'FB', r: [EGG.rxf, EGG.ryb, EGG.rz], sx: 1, sy: -1 },
    { id: 'RT', r: [EGG.rxr, EGG.ryt, EGG.rz], sx: -1, sy: 1 },
    { id: 'RB', r: [EGG.rxr, EGG.ryb, EGG.rz], sx: -1, sy: -1 },
  ];
  for (const Q of QUADS) {
    Q.c = EGG.c; Q.a = EGG.a;
    Q.R = M3.rz(EGG.a);
    Q.L = M3.mul(Q.R, M3.diag(...Q.r));
    Q.Li = M3.inv(Q.L);
  }
  const FT = QUADS[0];
  const toLocal = (E, p) => M3.v(E.Li, V3.sub(p, E.c));
  const toModel = (E, q) => V3.add(E.c, M3.v(E.L, q));
  const inQuad = (Q, q) => q[0] * Q.sx >= -1e-6 && q[1] * Q.sy >= -1e-6;
  // quadrant containing the (in-plane) model point, and its unit-sphere direction there (near side)
  function quadDir(x, y, zSign = 1) {
    for (const Q of QUADS) {
      const q = toLocal(Q, [x, y, 0]);
      if (!inQuad(Q, q)) continue;
      return { Q, s: V3.norm([q[0], q[1], zSign * Math.sqrt(Math.max(0, 1 - q[0] * q[0] - q[1] * q[1]))]) };
    }
    return { Q: FT, s: [0, 1, 0] };
  }
  const REAR_POLE = toModel(QUADS.find((Q) => Q.sx < 0), [-1, 0, 0]);

  // jaw line / belly boundary: height as a function of x (lookup table, Catmull-Rom through JAW)
  const JAW = [[-1100, 455], [-700, 468], [-300, 515], [100, 605], [400, 710], [700, 815], [900, 868], [1100, 915], [1320, 950]];
  const JAW_T = new Float32Array(260);
  for (let i = 0; i < 260; i++) {
    const x = -1100 + i * 10;
    let k = 0;
    while (k < JAW.length - 2 && x > JAW[k + 1][0]) k++;
    const p0 = JAW[Math.max(0, k - 1)], p1 = JAW[k], p2 = JAW[k + 1], p3 = JAW[Math.min(JAW.length - 1, k + 2)];
    const t = clamp((x - p1[0]) / (p2[0] - p1[0]), 0, 1), t2 = t * t, t3 = t2 * t;
    JAW_T[i] = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
  }
  const jawY = (x) => { const f = clamp((x + 1100) / 10, 0, 258.99), i = f | 0; return JAW_T[i] + (JAW_T[i + 1] - JAW_T[i]) * (f - i); };

  /* ---------- belly grooves: curves where the body surface meets planes through a tilted axis
     (from the lower rear, where they converge, to a point high in front of the snout, so their
     front ends fan out below the jaw line). Stored in FT's local coordinates + model normals. ---------- */
  const GROOVES = (() => {
    const Rp = [-780, 420, 0], Fp = [1450, 1060, 0];
    const a = V3.norm(V3.sub(Fp, Rp)), b1 = [a[1], -a[0], 0], b2 = [0, 0, 1];
    const len = Math.hypot(Fp[0] - Rp[0], Fp[1] - Rp[1]);
    const cosPhi = [0.93, 0.8, 0.65, 0.5, 0.34, 0.18];
    const out = [];
    cosPhi.forEach((cp, gi) => {
      const sp = Math.sqrt(1 - cp * cp);
      for (const zs of [1, -1]) {
        const d = V3.add(V3.scale(b1, cp), V3.scale(b2, sp * zs));
        let cur = [];
        const flush = () => { if (cur.length > 2) out.push(cur); cur = []; };
        for (let t = -200; t <= len; t += 16) {
          const A = V3.add(Rp, V3.scale(a, t));
          let best = -1, bestE = null;
          for (const E of QUADS) {
            const o = toLocal(E, A), dl = M3.v(E.Li, d);
            const qa = V3.dot(dl, dl), qb = 2 * V3.dot(o, dl), qc = V3.dot(o, o) - 1;
            const disc = qb * qb - 4 * qa * qc;
            if (disc < 0) continue;
            const s = (-qb + Math.sqrt(disc)) / (2 * qa);
            if (s > best && inQuad(E, V3.add(o, V3.scale(dl, s)))) { best = s; bestE = E; }
          }
          if (best <= 0) { flush(); continue; }
          const P = V3.add(A, V3.scale(d, best));
          const ql = toLocal(bestE, P), Li = bestE.Li;
          const n = V3.norm([Li[0] * ql[0] + Li[3] * ql[1] + Li[6] * ql[2], Li[1] * ql[0] + Li[4] * ql[1] + Li[7] * ql[2], Li[2] * ql[0] + Li[5] * ql[1] + Li[8] * ql[2]]);
          if (P[1] < jawY(P[0]) - 22 && P[0] > Rp[0] + 90 + gi * 30) cur.push({ q: toLocal(FT, P), n });
          else flush();
        }
        flush();
      }
    });
    return out;
  })();

  /* ---------- fins and flukes (plates, baked at 2-unit resolution) ---------- */
  // swept-back dorsal fin: a long low blade (u = forward, v = up; base on the back, tip pointing back)
  const DORSAL = bakeShape(Shape2D.poly([[135, -40], [112, 22], [45, 82], [-60, 128], [-200, 156], [-335, 166], [-300, 122], [-236, 84], [-165, 40], [-115, -40]], code(FIN)), 2);
  const DORSAL_LINES = [
    { pts: [[0, 30, 0], [-130, 88, 0], [-290, 136, 0]], mat: FIN, useLn: true },
  ];
  // pectoral flipper (u = back along the body, v = down)
  const PECT = bakeShape(Shape2D.poly([[-10, -40], [60, -36], [170, -14], [270, 30], [300, 58], [230, 60], [120, 40], [20, 36], [-20, 10]], code(FIN)), 2);
  // tail lobes (u = backward, v = up): long blue upper blade, small grey lower spike
  // both lobes in one plate (no overlapping coplanar plates): blue above the split line, grey below
  const FLUKE_UP_P = Shape2D.catmull([[-40, -60], [70, -40], [200, 10], [330, 60], [420, 96], [310, 100], [170, 82], [50, 62], [-40, 50]], true, 8);
  const FLUKE_LO_P = Shape2D.catmull([[-40, 30], [60, 16], [140, -20], [210, -66], [145, -68], [60, -52], [-40, -40]], true, 8);
  const FLUKES = bakeShape({
    bb: [-45, -75, 425, 105],
    test(u, v) {
      const up = Shape2D.inPoly(u, v, FLUKE_UP_P), lo = Shape2D.inPoly(u, v, FLUKE_LO_P);
      if (!up && !lo) return 0;
      if (up && lo) return v > 4 - 0.25 * u ? code(FIN) : code(BELLY);
      return up ? code(FIN) : code(BELLY);
    },
  }, 2);

  // body top height at x (for seating the dorsal fins)
  function topAt(x) {
    let best = 0;
    for (const Q of QUADS) {
      for (let i = 0; i <= 400; i++) {
        const th = (i / 400) * Math.PI;
        const q = [Math.cos(th), Math.sin(th), 0];
        if (!inQuad(Q, q)) continue;
        const p = toModel(Q, q);
        if (Math.abs(p[0] - x) < 8) best = Math.max(best, p[1]);
      }
    }
    return best;
  }
  const FIN_POS = [{ x: -110, s: 1 }, { x: -500, s: 0.84 }].map((d) => Object.assign(d, { y: topAt(d.x) - 12 * d.s }));

  const EYE_D = quadDir(700, 895), EYE_S = EYE_D.s, EYE_SF = [EYE_S[0], EYE_S[1], -EYE_S[2]];
  const EYE_TV = V3.norm(V3.sub([0, 1, 0], V3.scale(EYE_S, EYE_S[1]))), EYE_TU = V3.cross(EYE_TV, EYE_S);
  let EYE_DECAL = false, EYE_KIND = 'open';
  const BLOW_D = quadDir(640, 1085);
  const PECT_D = quadDir(520, 735);
  const PECT_AT = V3.add(toModel(PECT_D.Q, PECT_D.s), [0, 0, -12]);

  let HL = null, HLl = [0, 1, 0]; // highlight direction in model space / in the egg's local frame (set per render)
  // points covering one octant-pair of the unit sphere (x, y >= 0, both z signs), for bounding quarter prims
  const QUAD_SAMPLES = [];
  for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) {
    const th = (i / 12) * (Math.PI / 2), ph = (j / 12) * Math.PI; // th: angle in the x-y quadrant, ph: around it
    const c = Math.cos(th), sn = Math.sin(th);
    for (const zs of [1, -1]) {
      const sp = Math.sin(ph), cp = Math.cos(ph);
      // meridian from the x-y quadrant point toward +/-z
      QUAD_SAMPLES.push([c * sp, sn * sp, zs * Math.abs(cp)]);
    }
  }

  function build(pose) {
    const P = Object.assign({}, DEFAULT, pose);
    const bl = clamp(P.blow, 0, 1), mo = clamp(P.mouth, 0, 1), roll = clamp(P.roll || 0, -0.6, 0.6);
    const prims = [];
    // squash before spouting (anchored at the belly) and roll about the long axis
    const D = M3.diag(1 + 0.05 * bl, 1 - 0.1 * bl, 1 + 0.05 * bl);
    const root = chain(F(D, [0, 0, 0]), T(0, 560, 0), R(M3.rx(roll)), T(0, -560, 0));
    const mouthA = mo * 0.14;
    const bodyMat = (E) => {
      const ca = Math.cos(E.a), sa = Math.sin(E.a), rx = E.r[0], ry = E.r[1], rz = E.r[2];
      return (s) => {
        const lx = s[0] * rx, ly = s[1] * ry;
        const x = E.c[0] + ca * lx - sa * ly, y = E.c[1] + sa * lx + ca * ly;
        const yb = jawY(x);
        if (y < yb) {
          // open mouth: a dark wedge below the jaw line at the front, tongue at its floor
          if (mouthA > 0.003 && x > 560) {
            const k = (x - 560) / 700, h = mouthA * 900 * k * Math.min(1, k * 3);
            if (y > yb - h) return code(y < yb - h * 0.62 ? TONGUE : MOUTH);
          }
          return code(BELLY);
        }
        if (E === FT) {
          // eyes as surface decals when rendered large (stamps are used for small scales)
          if (EYE_DECAL) {
            const zs = s[2] < 0 ? -1 : 1, ex = s[0] - EYE_S[0], ey = s[1] - EYE_S[1], ez = s[2] * zs - EYE_S[2];
            const du = ex * EYE_TU[0] + ey * EYE_TU[1] + ez * EYE_TU[2], dv = ex * EYE_TV[0] + ey * EYE_TV[1] + ez * EYE_TV[2];
            const ek = EYE_KIND, R0 = 0.03;
            if (Math.abs(du) < 0.06 && Math.abs(dv) < 0.06) {
              if (ek === 'happy') { const rr = Math.hypot(du, dv + 0.012); if (dv > -0.012 && rr < R0 * 1.15 && rr > R0 * 0.55) return code(EYE); }
              else if (ek === 'closed') { if (Math.abs(dv + 0.008 - 12 * du * du) < 0.006 && Math.abs(du) < R0 * 1.1) return code(EYE); }
              else {
                const r2 = (du * du) / (R0 * R0 * 0.8) + (dv * dv) / (R0 * R0 * 1.15);
                if (r2 < 1) { const gu = du - zs * 0.3 * R0, gv = dv - 0.35 * R0; return gu * gu + gv * gv < R0 * R0 * 0.12 ? code(EYEW) : code(EYE); }
              }
            }
          }
          // blowhole on top of the head
          const bx = (x - 640) / 55, bz = (s[2] * rz) / 30;
          if (y > 1000 && bx * bx + bz * bz < 1) return code(BODY, -2);
        }
        // small glossy highlight on the head (HL = half vector in model space, set per render)
        if (HL && E.sy >= 0 && x > -250) {
          // local-frame normal vs local-frame half vector; deviations along the long axis count double so the
          // spot stays round on this long, gently curved body
          const ux = s[0] / rx, uy = s[1] / ry, uz = s[2] / rz, ul = Math.hypot(ux, uy, uz);
          const dx = ux / ul - HLl[0], dy = uy / ul - HLl[1], dz = uz / ul - HLl[2];
          if (4 * dx * dx + dy * dy + dz * dz < 0.0064) return code(BODY, 2);
        }
        return code(BODY);
      };
    };
    const bodyF = (E) => chain(root, T(...E.c), R(E.R));
    const qPrims = QUADS.map((Q) => {
      const base = bodyMat(Q);
      return ell(bodyF(Q), Q.r, { part: 1, grp: 1, quad: [Q.sx, Q.sy], mat: (sv) => (sv[0] * Q.sx < 0 || sv[1] * Q.sy < 0 ? 0 : base(sv)) });
    });
    const mainF = bodyF(FT), mainP = qPrims[0];
    mainP.grooves = GROOVES;
    prims.push(...qPrims);

    // dorsal fins: two long low blades in a row on the back
    for (const d of FIN_POS) {
      const f = chain(root, T(d.x, d.y, 0), R(M3.rz(0.12)), F(M3.diag(d.s, d.s, 1), [0, 0, 0]));
      prims.push(plate(f, DORSAL, { part: 2, grp: 2, thick: 14, lines: DORSAL_LINES }));
    }
    // pectoral flippers behind the mouth corner (flap with P.fin); the visible one opens a little toward the camera
    for (const k of [1, -1]) {
      let f = chain(T(...PECT_AT), R(frameUW([-0.9, -0.3, 0.2], [0.1, 0.2, 1])), R(M3.rx(-0.6 * clamp(P.fin, -1, 1))), R(M3.rx(0.15 * k * (P.side ?? 1))));
      if (k < 0) f = mirror(f);
      prims.push(plate(chain(root, f), PECT, { part: k > 0 ? 3 : 4, grp: k > 0 ? 3 : 4, thick: 14 }, [[1, 0, 0], [0, -1, 0], [0, 0, 1]]));
    }
    // tail lobes hinged at the tail stock, swinging up/down with P.tail
    const tailF = chain(root, T(REAR_POLE[0] + 30, REAR_POLE[1], 0), R(M3.rz(-0.3 * clamp(P.tail, -1, 1))));
    const flip = [[-1, 0, 0], [0, 1, 0], [0, 0, 1]];
    prims.push(plate(tailF, FLUKES, { part: 5, grp: 5, thick: 16 }, flip));

    const qP = (D) => qPrims[QUADS.indexOf(D.Q)], qF = (D) => bodyF(D.Q);
    const eyeAt = { p: P2W(qF(EYE_D), M3.v(M3.diag(...EYE_D.Q.r), EYE_S)), s: EYE_S, prim: qP(EYE_D) };
    const eyeAtF = { p: P2W(qF(EYE_D), M3.v(M3.diag(...EYE_D.Q.r), EYE_SF)), s: EYE_SF, prim: qP(EYE_D) };
    const anchors = {
      blowhole: P2W(qF(BLOW_D), M3.v(M3.diag(...BLOW_D.Q.r), BLOW_D.s)),
      mouth: P2W(root, [1230, jawY(1230) - 30, 0]),
      eye: eyeAt.p, eyeF: eyeAtF.p,
      tail: P2W(tailF, [-330, 70, 0]),
      top: P2W(mainF, [0, FT.r[1], 0]),
      body: mainF.t,
    };
    return {
      prims, anchors, pose: P, dots: [], rootN: M3.mul(M3.inv(D), M3.rx(roll)),
      stamps: [{ at: eyeAt, set: EYES[0], colors: EYEC, kind: P.eyes, minFacing: 0.15 }, { at: eyeAtF, set: EYES[0], colors: EYEC, kind: P.eyes, minFacing: 0.15, flipX: true }],
      pri: { 1: 0, 2: 1, 3: 1, 4: 1, 5: 1 },
      glossy: {}, baseMat: BODY, shadowSteps: 0,
    };
  }

  /* ---------- eyes: pixel stamps sized for the render scale ---------- */
  const EYEC = { k: '#0c1220', w: '#ffffff', b: '#26406e' };
  const NO_EYE = { open: ['.'] };
  const EYES = [
    { open: ['kk', 'kk', 'kk'], happy: ['.k.', 'k.k'], closed: ['kkk'] }, // tiny (far out at sea)
    { open: ['.kk.', 'kwkk', 'kkkk', '.kk.'], happy: ['.kk.', 'k..k'], closed: ['k..k', '.kk.'] },
    { open: ['.kkk.', 'kwwkk', 'kwkkk', 'kkkkk', 'kkkbk', '.kkk.'], happy: ['.kkk.', 'k...k', 'k...k'], closed: ['k...k', '.kkk.'] },
    { open: ['..kkk..', '.kwwkk.', 'kwwkkkk', 'kwkkkkk', 'kkkkkkk', 'kkkkbbk', '.kkkbk.', '..kkk..'], happy: ['..kkk..', '.k...k.', 'k.....k', 'k.....k'], closed: ['k.....k', '.k...k.', '..kkk..'] },
  ];

  function render(model, opt) {
    const { yaw = 1.05, pitch = 0.16, scale = 1, W = 96, H = 96, ox = 48, oy = 82 } = opt;
    const set = scale < 0.16 ? EYES[0] : scale < 0.3 ? EYES[1] : EYES[2];
    EYE_DECAL = scale >= 0.45;
    EYE_KIND = (model.pose && model.pose.eyes) || 'open';
    for (const st of model.stamps) st.set = EYE_DECAL ? NO_EYE : set;
    const M = M3.mul(M3.rx(pitch), M3.ry(-yaw));
    const cam = [M[6], M[7], M[8]];
    { // highlight direction (half vector between light and view) in model space
      const Ld = V3.norm((opt.light && opt.light.dir) || [-0.5, 0.72, 0.5]);
      HL = M3.v([M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8]], V3.norm(V3.add(Ld, [0, 0, 1])));
      HL = V3.norm(V3.add(HL, [0, 1.1, 0])); // keep the spot high on the head, as in the official art
      HLl = M3.v(M3.rz(-EGG.a), HL);
    }
    // grooves: keep only the parts facing the camera
    const RN = model.rootN || M3.I();
    for (const p of model.prims) {
      if (!p.grooves) continue;
      const lines = [];
      for (const g of p.grooves) {
        let cur = [];
        for (const pt of g) {
          const n = M3.v(RN, pt.n);
          if ((n[0] * cam[0] + n[1] * cam[1] + n[2] * cam[2]) / Math.hypot(n[0], n[1], n[2]) > 0.06) cur.push(pt.q);
          else { if (cur.length > 1) lines.push({ pts: cur, mat: BELLY, useLn: true }); cur = []; }
        }
        if (cur.length > 1) lines.push({ pts: cur, mat: BELLY, useLn: true });
      }
      p.lines = lines;
    }
    // ray-cast only the creature's screen box, then paste into the full buffer
    const V = M3.mul(M, M3.diag(scale, scale, scale));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of model.prims) {
      const cv = M3.v(V, p.c), Lv = M3.mul(V, p.L);
      if (p.quad) {
        // quarter-ellipsoid: bound only the quadrant that is drawn
        for (const ys of p.quad[1] ? [p.quad[1]] : [1, -1]) for (const q of QUAD_SAMPLES) {
          const sx = q[0] * p.quad[0], sy = q[1] * ys, sz = q[2];
          const qx = cv[0] + Lv[0] * sx + Lv[1] * sy + Lv[2] * sz, qy = cv[1] + Lv[3] * sx + Lv[4] * sy + Lv[5] * sz;
          x0 = Math.min(x0, qx); x1 = Math.max(x1, qx); y0 = Math.min(y0, -qy); y1 = Math.max(y1, -qy);
        }
      } else if (p.kind === 'ell') {
        const rx = Math.hypot(Lv[0], Lv[1], Lv[2]), ry = Math.hypot(Lv[3], Lv[4], Lv[5]);
        x0 = Math.min(x0, cv[0] - rx); x1 = Math.max(x1, cv[0] + rx); y0 = Math.min(y0, -cv[1] - ry); y1 = Math.max(y1, -cv[1] + ry);
      } else {
        const [a, b, c, d] = p.shape.bb;
        for (const u of [a, c]) for (const v of [b, d]) for (const w of [-p.thick, p.thick]) {
          const qx = cv[0] + Lv[0] * u + Lv[1] * v + Lv[2] * w, qy = cv[1] + Lv[3] * u + Lv[4] * v + Lv[5] * w;
          x0 = Math.min(x0, qx); x1 = Math.max(x1, qx); y0 = Math.min(y0, -qy); y1 = Math.max(y1, -qy);
        }
      }
    }
    const mg = 3 + 0.01 * Math.max(x1 - x0, y1 - y0);
    const bx0 = Math.max(0, Math.floor(ox + x0 - mg)), bx1 = Math.min(W - 1, Math.ceil(ox + x1 + mg));
    const by0 = Math.max(0, Math.floor(oy + y0 - mg)), by1 = Math.min(H - 1, Math.ceil(oy + y1 + mg));
    if (bx1 - bx0 < 4 || by1 - by0 < 4 || (bx1 - bx0 + 1) * (by1 - by0 + 1) > 0.8 * W * H) return Creature.render(model, opt);
    const w = bx1 - bx0 + 1, h = by1 - by0 + 1;
    const r = Creature.render(model, Object.assign({}, opt, { W: w, H: h, ox: ox - bx0, oy: oy - by0 }));
    const buf = new PX.Buf(W, H), depth = new Float32Array(W * H).fill(-1e9), part = new Uint8Array(W * H);
    for (let y = 0; y < h; y++) {
