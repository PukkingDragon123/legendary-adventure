/* ------------------------------------------------------------------
   Paintings — five views of one beach, each a small living scene.
   Every factory returns { meta, W, H, step(dt), draw(fb), tap(x,y) }.
------------------------------------------------------------------- */
const Paintings = (() => {
  const { hex, Buf, bayer4, bayer8, hash2, vnoise, fbm, rng, mix } = PX;
  const { clamp, lerp, mixc, star } = Scenery;
  const W = 384, H = 216;

  // Mudkip palette grading helpers
  const gradeMudkip = (fn) => Mudkip.gradePalette(fn);
  const gradeBall = (fn) => Ball.grade(fn);
  const tintFn = (mulHex, addHex, k = 1) => {
    const m = PX.rgbOf(hex(mulHex)), a = PX.rgbOf(hex(addHex || '#000000'));
    return (c) => {
      const r = PX.rgbOf(c);
      return PX.pack(
        clamp(lerp(r[0], (r[0] * m[0]) / 255 + a[0], k), 0, 255),
        clamp(lerp(r[1], (r[1] * m[1]) / 255 + a[1], k), 0, 255),
        clamp(lerp(r[2], (r[2] * m[2]) / 255 + a[2], k), 0, 255)
      );
    };
  };

  /* ================================================================
     1 · HIGH NOON — the header rally (centerpiece)
     ================================================================ */

      sky: [[0, '#2966c8'], [0.18, '#3176d4'], [0.36, '#3d88df'], [0.54, '#4f9ce8'], [0.7, '#66afef'], [0.85, '#86c4f4'], [1, '#b3dcf8']],
      sea: [[0, '#1d58a8'], [0.12, '#2063b4'], [0.34, '#2472c0'], [0.6, '#2a88cb'], [1, '#34a4d6']],
      horizon: '#9fd0f0',
      cloud: ['#9fbfe0', '#c6dcf0', '#e9f3fc', '#ffffff'],
      sunGlow: '#fff6da',
      glintHi: '#ffffff', glintMid: '#b9e6fb',
      shallow: ['#34a4d6', '#3fb9d9', '#5ccdd8', '#8fe0d7', '#bcecd6'],
      caustic: '#cdf7ef',
      face: '#2f93cf',
      foam: ['#ffffff', '#e0f5fa', '#a9dce9'],
      sand: ['#c49a60', '#ddbb82', '#edd4a0', '#f7e7c2'],
      sandWet: ['#9c7a50', '#b59262', '#c6a576', '#d9c09a'],
      sheen: '#d9dfd6',
      prop: {
        starfish: { d: '#a2402c', r: '#ee7f52', l: '#ffb07a' },
        shell: { d: '#b07a6a', r: '#f2c2b0', l: '#fff0e6' },
        conch: { d: '#9a6a4c', r: '#e8b48e', l: '#fbe0c8' },

      },
      head: {

        tower: ['#b9b2a9', '#efebe4', '#ffffff'], stripe: ['#96302b', '#d4443a', '#f0675a'],
        iron: '#343a46', glass: '#9fd9f2', roof: '#b3352e', lampOn: ['#ffe58a', '#fff8d2'],

    const lamp = Scenery.headland(bg, { x: 306, y: 88, w: 80, pal: pal.head, seed: 5 });

    const clouds = [
      { buf: Scenery.makeCloud(3, 104, 34, pal.cloud), x: 150, y: 14, sp: 2.2 },
      { buf: Scenery.makeCloud(8, 62, 22, pal.cloud, { upper: 1 }), x: 16, y: 40, sp: 1.5 },
      { buf: Scenery.makeCloud(14, 46, 16, pal.cloud, { upper: 1, puffs: 4 }), x: 300, y: 30, sp: 1.1 },
      { buf: Scenery.makeCloud(21, 74, 24, pal.cloud), x: 250, y: 58, sp: 0.8 },
      { buf: Scenery.makeCloud(33, 38, 13, pal.cloud, { upper: 0, puffs: 4 }), x: 90, y: 66, sp: 0.6 },
    ];
    const glints = Scenery.makeGlints(4, 150, 0, W, 90, 170);
    const palmFrames = Scenery.makePalm({ pal: pal.palm, w: 130, h: 230, bx: 26, by: 232, kx: 6, ky: 150, cx: 56, cy: 40, fronds: 10, seed: 12 });
    const vignette = Beach.makeVignette(W, H, 0.55, hex('#14224a'));
    const parts = new Scenery.Particles();

    const mk = new MudkipActor({ x: 196, gy: 179, yaw: 1.2, pal: Mudkip.BASE_PAL, light, scale: 1.3 });
    const ball = new BallActor({ x: 200, y: 20, R: 14, light });
    ball.vx = 0; ball.vy = 30;

    const G = 190, GM = 950, HJ = 16;
    const tUp = Math.sqrt((2 * HJ) / GM), vJ = GM * tUp;
    const S = {
      t: 0, mode: 'ground', vh: 0, vx: 0, crouch: 0, happy: 0, hits: 0, floating: false,
      facing: 1, idleRipple: 0.6, heart: 0,
    };
    let contactOff = null; // [dx, dy] from mudkip ground point to ball centre at the moment of contact

    const dark = PX.cmap((c) => mix(c, pal.shadow, 0.32));
    const darkW = PX.cmap((c) => mix(c, pal.shadow, 0.2));
    const subT = PX.cmap((c) => mix(c, pal.shallow[1], 0.42));
    const reflT = PX.cmap((c) => mix(c, pal.shallow[0], 0.5));
    const sounds = [];
    const emit = (name, o = {}) => sounds.push(Object.assign({ name }, o));

    function contactPose(face) {
      return { squash: -0.08, headPitch: 0.42, lean: 0.12, legF: -0.5, legB: 0.55, mouth: 1, eyes: 'happy', finSway: 0.1 };
    }
    function computeContact() {
      const save = mk.yaw;
      const s = mk.sprite(contactPose());
      const ft = s.anchors.finTip;
      mk.yaw = save;
      return [ft[0] - mk.OX, ft[1] - mk.OY - ball.R + 3];
    }
    const yContact = () => mk.gy - HJ + contactOff[1];
    // time for the ball to fall to the contact height
    function timeToContact() {
      const yc = yContact();
      const disc = ball.vy * ball.vy + 2 * G * (yc - ball.y);
      if (disc < 0) return Infinity;
      const tau = (-ball.vy + Math.sqrt(disc)) / G;
      return tau;
    }
    function launch(rise) {
      const target = clamp(mk.x + (Math.random() < 0.5 ? -1 : 1) * (18 + Math.random() * 46), 118, 280);
      const t = mk.x > 250 ? Math.min(target, mk.x - 30) : mk.x < 140 ? Math.max(target, mk.x + 30) : target;
      const D = 2 * Math.sqrt((2 * rise) / G);
      ball.vy = -Math.sqrt(2 * G * rise);
      ball.vx = (t - mk.x) / D;
      ball.axis = V3.norm([Math.random() - 0.5, 0.4 + Math.random() * 0.4, 1]);
      ball.w = (ball.vx >= 0 ? -1 : 1) * (5 + Math.random() * 4);
    }

    function step(dt) {
      S.t += dt;
      const t = S.t;
      beach.update(t, dt);
      if (!contactOff) contactOff = computeContact();

      // ---- ball
      ball.squashT = Math.max(0, ball.squashT - dt);
      if (S.floating) {
        ball.vy = 0;
        ball.vx *= Math.pow(0.4, dt);
        ball.x += ball.vx * dt;
        ball.y = mk.gy - 6 + Math.sin(t * 2.6) * 1.2;
        ball.w *= Math.pow(0.3, dt);
      } else {
        ball.vy += G * dt;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        if (ball.x < 104) { ball.x = 104; ball.vx = Math.abs(ball.vx); }
        if (ball.x > 300) { ball.x = 300; ball.vx = -Math.abs(ball.vx); }
        // missed? splash into the shallows and float
        if (ball.y > mk.gy - 6 && ball.vy > 0) {
          ball.y = mk.gy - 6;
          S.floating = true;
          splash(parts, ball.x, mk.gy, { power: 0.9, test: beach.isWater });
          emit('splash', { big: true });
        }
      }
      ball.spin(dt);

      // ---- mudkip
      mk.sq.step(dt);
      mk.fin.step(dt);
      mk.tail.step(dt);
      S.happy = Math.max(0, S.happy - dt);
      S.heart = Math.max(0, S.heart - dt);
      const tau = S.floating ? Infinity : timeToContact();
      const targetX = S.floating ? ball.x - S.facing * 10 : ball.x + ball.vx * tau - contactOff[0] * S.facing;

      if (S.mode === 'air' || S.mode === 'hop') {
        S.vh -= GM * dt;
        mk.h += S.vh * dt;
        mk.x += S.vx * dt;
        if (mk.h <= 0 && S.vh < 0) {
          const hard = S.mode === 'air';
          mk.h = 0;
          S.mode = 'ground';
          if (hard) {
            mk.sq.kick(7);
            mk.fin.kick(-5);
            splash(parts, mk.x, mk.gy, { power: 1.2, test: beach.isWater });
            emit('splash');
          } else {
            mk.sq.kick(2.6);
            parts.add({ type: 'ripple', x: mk.x, y: mk.gy + 1, r0: 4, r1: 13, flat: 0.34, life: 0.6, c: pal.foam[1], test: beach.isWater });
            for (let i = 0; i < 4; i++) parts.add({ type: 'drop', x: mk.x + (Math.random() - 0.5) * 14, y: mk.gy - 1, vx: (Math.random() - 0.5) * 40, vy: -40 - Math.random() * 40, g: 400, life: 1, c: pal.foam[0], size: 1, layer: 1, floor: mk.gy + 1 });
            emit('plip');
          }
        }
      } else {
        // grounded decisions
        if (S.floating && Math.abs(targetX - mk.x) < 5) {
          // nose the floating ball back into the air
          S.floating = false;
          ball.y = mk.gy - 10;
          launch(60);
          S.mode = 'hop'; S.vh = 120; S.vx = 0;
          S.happy = 0.4;
          mk.fin.kick(3);
          splash(parts, ball.x, mk.gy, { power: 0.5, test: beach.isWater });
          emit('boing', { soft: true });
        } else if (!S.floating && tau <= tUp + 0.001) {
          S.mode = 'air'; S.vh = vJ; S.vx = clamp((targetX - mk.x) / Math.max(tUp, 0.05), -140, 140);
          S.crouch = 0;
          mk.sq.kick(-4); mk.tail.kick(4); mk.fin.kick(-2.5);
          emit('jump');
        } else if (!S.floating && tau <= tUp + 0.16) {
          S.crouch = Math.min(1, S.crouch + dt * 9);
        } else if (Math.abs(targetX - mk.x) > 3 && (S.floating || tau > tUp + 0.46)) {
          S.mode = 'hop'; S.vh = 108; S.vx = clamp((targetX - mk.x) / 0.23, -70, 70);
          S.crouch = 0;
        } else S.crouch = Math.max(0, S.crouch - dt * 6);
        // idle ripples at the feet
        S.idleRipple -= dt;
        if (S.idleRipple <= 0) {
          S.idleRipple = 1.1 + Math.random() * 0.6;
          parts.add({ type: 'ripple', x: mk.x + 2, y: mk.gy + 1, r0: 12, r1: 20, flat: 0.3, life: 1.2, c: pal.foam[1], test: beach.isWater });
        }
      }
      // contact!
      if (!S.floating && S.mode === 'air' && ball.vy > 0 && mk.last) {
        const ft = mk.anchor('finTip');
        const cy = ft[1] - ball.R + 3;
        if (ball.y >= cy - 1 && Math.abs(ball.x - ft[0]) < ball.R + 8) {
          ball.y = cy;
          ball.x += (ft[0] - ball.x) * 0.6;
          S.hits++;
          launch(S.hits % 5 === 0 ? 112 : 50 + Math.random() * 14);
          ball.squashT = 0.16;
          S.happy = 0.45;
          mk.fin.kick(7);
          mk.tail.kick(3);
          const bx = ball.x, by = ball.y + ball.R - 2;
          parts.add({ type: 'spark', x: bx, y: by, size: 5, life: 0.28, c: hex('#ffffff'), c2: hex('#fff1a8'), layer: 1 });
          for (let i = 0; i < 7; i++) {
            const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
            parts.add({ type: 'drop', x: bx, y: by + 2, vx: Math.cos(a) * (40 + Math.random() * 50), vy: Math.sin(a) * (60 + Math.random() * 60), g: 380, life: 1.4, c: pal.foam[0], c2: pal.foam[1], size: 1 + (Math.random() < 0.3 ? 1 : 0), layer: 1, floor: mk.gy + 1 + Math.random() * 3, onFloor: (p) => parts.add({ type: 'ripple', x: p.x, y: p.floor, r0: 0.5, r1: 3, flat: 0.4, life: 0.4, c: pal.foam[1], test: beach.isWater }) });
          }
          for (let i = 0; i < 5; i++) parts.add({ type: 'spark', x: bx + (Math.random() - 0.5) * 26, y: by - Math.random() * 18, size: 1 + Math.floor(Math.random() * 2), life: 0.4 + Math.random() * 0.3, c: hex('#ffffff'), c2: hex('#bfe8ff'), layer: 1 });
          emit('boing', { big: S.hits % 5 === 0 });
        }
      }

      // facing: toward where we are heading / the ball
      const dir = Math.abs(targetX - mk.x) > 4 ? Math.sign(targetX - mk.x) : Math.abs(ball.x - mk.x) > 16 ? Math.sign(ball.x - mk.x) : S.facing;
      S.facing = dir || S.facing;
      const yawT = S.facing > 0 ? 1.2 : Math.PI - 1.2;
      mk.yaw += clamp(yawT - mk.yaw, -dt * 5.5, dt * 5.5);

      // pose
      const air = S.mode === 'air';
      const rising = air && S.vh > 0;
      const headX = mk.x, headY = mk.gy - mk.h - 58;
      const look = Math.atan2(headY - ball.y, Math.abs(ball.x - headX) + 8);
      let headPitch = clamp(look * 0.55, -0.1, 0.46);
      const nearHit = !S.floating && tau < 0.12;
      const happy = S.happy > 0 || nearHit;
      const blink = !happy && mk.blink(t, dt);
      const pose = {
        squash: clamp(mk.sq.x * 0.5 + S.crouch * 0.2 + Math.sin(t * 3.1) * 0.012, -0.18, 0.3),
        headPitch: air ? (rising ? 0.42 : 0.18) : headPitch - S.crouch * 0.18,
        lean: air ? (rising ? 0.12 : -0.04) : 0,
        legF: air ? (rising ? -0.5 : 0.3) : S.mode === 'hop' ? -0.2 : 0,
        legB: air ? (rising ? 0.55 : -0.3) : S.mode === 'hop' ? 0.25 : 0,
        bodyDip: S.crouch * 1.5,
        mouth: happy ? 1 : air ? 0.8 : 0.65,
        eyes: happy ? 'happy' : blink ? 'blink' : 'open',
        finSway: clamp(0.04 + mk.fin.x * 0.3, -0.25, 0.4),
        tailLift: clamp(mk.tail.x * 0.3, -0.2, 0.35),
        tailWag: Math.sin(t * (S.happy > 0 ? 16 : 7)) * (air ? 0.1 : 0.22),
        gill: Math.sin(t * 5.3) * 0.05,
      };
      mk.sprite(pose);
      parts.update(dt);
      return sounds.splice(0);
    }

    function draw(fb) {
      const t = S.t;
      fb.copyFrom(bg);
      // clouds (sky only), drifting right
      for (const c of clouds) {
        const span = W + c.buf.w;
        const x = ((c.x + t * c.sp) % span + span) % span - c.buf.w;
        fb.blit(c.buf, x, c.y, { test: (px, py) => py < 88 });
      }
      // gulls
      for (let g = 0; g < 2; g++) {
        const span = W + 80;
        const gx = ((t * (14 + g * 5) + g * 170) % span) - 40;
        const gy = 34 + g * 16 + Math.sin(t * 0.8 + g) * 4;
        Scenery.gull(fb, gx, gy, t * (7 + g) + g, hex('#ffffff'), hex('#8aa0bb'));
      }
      // sailboat drifting on the horizon
      {
        const bx = 150 + ((t * 1.4) % 140);
        const by = 87;
        fb.set(bx, by, hex('#e9f1f8')); fb.set(bx + 1, by, hex('#e9f1f8')); fb.set(bx + 2, by, hex('#c9d6e3'));
        for (let k = 1; k <= 4; k++) for (let j = 0; j < Math.ceil(k / 2); j++) fb.set(bx + 1 - j, by - k, hex('#ffffff'));
        fb.set(bx + 1, by - 5, hex('#b24a3a'));
      }
      // sea glints
      Scenery.drawGlints(fb, glints, t, pal.glintHi, pal.glintMid, (x, y) => y > 89 && y < beach.edge[Math.max(0, Math.min(W - 1, x))] - 30);
      // swell lines far out
      for (let y = 92; y < 150; y++) {
        const p = (y - 88) / 62;
        const ph = Math.sin(y * (0.9 - p * 0.5) - t * 1.6);
        if (ph < 0.965) continue;
        for (let x = 0; x < W; x++) {
          if (vnoise(x * 0.05 + t * 0.2, y * 0.3, 2) < 0.52) continue;
          const i = y * W + x;
          fb.d[i] = mixc(fb.d[i], pal.glintMid, 0.35);
        }
      }
      beach.drawShore(fb, t);
      // shadows
      const shX = mk.x + 3, shY = mk.gy + 1;
      const k = clamp(1 - mk.h / 70, 0.3, 1);
      dropShadow(fb, shX, shY, 21 * k, 5 * k, beach.isWater(Math.round(shX), Math.round(shY)) ? darkW : dark, 0.95);
      {
        const hgt = Math.max(0, mk.gy - ball.y);
        const kk = clamp(1 - hgt / 240, 0.25, 1);
        dropShadow(fb, ball.x + 2, mk.gy + 2, ball.R * 0.95 * kk, 3 * kk, darkW, 0.9 * kk);
      }
      // reflections in the shallows
      mk.reflect(fb, mk.gy + 1, t, { tint: reflT, test: beach.isWater, gap: 0, fadeLen: 44 });
      if (mk.gy - ball.y < 60) ball.reflect(fb, mk.gy + 1, t, { tint: reflT, test: beach.isWater, fadeLen: 30 });
      parts.draw(fb, 0, t);
      // Mudkip (feet submerged while grounded in water)
      const inWater = beach.isWater(Math.round(mk.x), mk.gy + 1);
      if (Paintings.hook) Paintings.hook(fb, 'back');
      mk.draw(fb, { waterY: inWater && mk.h < 3 ? mk.gy - 2 + Math.round(mk.h) : null, sub: subT });
      if (inWater && mk.h < 2) {
        // foam collar round the ankles
        const fx = Math.round(mk.x), fy = mk.gy - 1;
        for (let dx = -19; dx <= 19; dx++) {
          const ww = Math.abs(dx) / 19;
          if (hash2(dx + Math.floor(t * 6), 0, 3) < 0.35) continue;
          fb.set(fx + dx, fy + Math.round(ww * ww * 2), ww > 0.8 ? pal.foam[1] : pal.foam[0]);
        }
      }
      ball.render();
      ball.draw(fb);
      if (S.floating) {
        for (let dx = -ball.R; dx <= ball.R; dx++) if (hash2(dx, Math.floor(t * 5), 1) > 0.3) fb.set(Math.round(ball.x) + dx, Math.round(mk.gy - 1 + Math.abs(dx) * 0.08), pal.foam[0]);
      }
      parts.draw(fb, 1, t);
      if (S.heart > 0) drawHeart(fb, mk.anchor('finTip')[0] + 6, mk.anchor('finTip')[1] - 6 - (1.2 - S.heart) * 12, S.heart);
      // palm tree (foreground left) + grass
      fb.blit(palmFrames[Math.floor(t * 3.2) % palmFrames.length], -8, -6);
      drawGrass(fb, t, 336, 216, 20, pal.palm.leaf);
      drawGrass(fb, t, 80, 216, 8, pal.palm.leaf);
      if (Paintings.hook) Paintings.hook(fb, 'front');
      vignette(fb);
    }

    function tap(x, y) {
      // ball?
      if (Math.hypot(x - ball.x, y - ball.y) < ball.R + 5) {
        if (S.floating) { S.floating = false; ball.y -= 6; }
        ball.vy = -Math.sqrt(2 * G * (90 + Math.random() * 25));
        ball.vx = clamp(ball.vx + (Math.random() - 0.5) * 40, -60, 60);
        ball.w *= -1.4;
        ball.squashT = 0.16;
        for (let i = 0; i < 6; i++) parts.add({ type: 'spark', x: ball.x + (Math.random() - 0.5) * 30, y: ball.y + (Math.random() - 0.5) * 30, size: 1 + Math.floor(Math.random() * 3), life: 0.5, c: hex('#ffffff'), c2: hex('#ffe9a0'), layer: 1 });
        S.happy = 0.3;
        emit('boing', { soft: true });
        return 'ball';
      }
      // mudkip?
      const s = mk.last;
      if (s) {
        const [ox, oy] = mk.origin();
        const sx = Math.round(x - ox), sy = Math.round(y - oy);
        if (sx >= 0 && sy >= 0 && sx < s.buf.w && sy < s.buf.h && s.buf.d[sy * s.buf.w + sx]) {
          if (S.mode === 'ground') { S.mode = 'hop'; S.vh = 150; S.vx = 0; }
          S.happy = 0.9; S.heart = 1.2;
          mk.fin.kick(4); mk.tail.kick(5);
          emit('cry');
          return 'mudkip';
        }
      }
      if (beach.isWater(Math.round(x), Math.round(y))) {
        splash(parts, x, y, { power: 0.55, n: 12, test: beach.isWater });
        emit('splash', { small: true });
        return 'water';
      }
      for (let i = 0; i < 5; i++) parts.add({ type: 'spark', x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 12, size: 1 + Math.floor(Math.random() * 2), life: 0.5 + Math.random() * 0.3, c: hex('#ffffff'), c2: hex('#fff3c0'), layer: 1 });
      emit('twinkle');
      return 'other';
    }

    return {
      meta: NOON_META, W, H, step, draw, tap, _dbg: () => ({ S, mk, ball, contactOff }),
      warm(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) step(1 / 30); sounds.length = 0; },
    };
  }

  function drawHeart(fb, x, y, k) {
    const spr = ['.rr.rr.', 'rllrrrr', 'rlrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'];
    const cols = { r: hex('#ff5a7a'), l: hex('#ffd0da') };
    x = Math.round(x) - 3; y = Math.round(y);
    for (let r = 0; r < spr.length; r++)
      for (let c = 0; c < 7; c++) {
        const ch = spr[r][c];
        if (ch === '.') continue;
        if (k < 0.3 && bayer4(x + c, y + r) > k / 0.3) continue;
        fb.set(x + c, y + r, cols[ch]);
      }
  }

  function drawGrass(fb, t, x0, y0, n, leaf) {
    const r = rng(x0 * 7 + 3);
    for (let i = 0; i < n; i++) {
      const bx = x0 + (r() - 0.5) * 34, len = 8 + r() * 12, lean = (r() - 0.5) * 0.9;
      const sw = Math.sin(t * 1.7 + bx * 0.3) * 0.12;
      let px = bx, py = y0;
      const segs = Math.ceil(len);
      for (let k = 0; k < segs; k++) {
        const u = k / segs;
        const a = -Math.PI / 2 + (lean + sw) * u * 1.6;
        px += Math.cos(a);
        py += Math.sin(a);
        fb.set(Math.round(px), Math.round(py), u < 0.3 ? leaf[1] : u < 0.75 ? leaf[2] : leaf[3]);
      }
    }
  }

  const NOON_META = {
    id: 'noon', no: 'II', title: 'High Noon Header', time: '12:04', place: 'Route 109 shore', poster: 3.5, period: 6.6,
    alt: 'Pixel painting: Mudkip leaps in ankle-deep turquoise water to head a striped beach ball under a bright noon sky, a palm tree on the left and a red-and-white lighthouse on the far headland.',
    blurb: 'Sun straight overhead, water ankle-deep. Mudkip keeps the beach ball airborne with its head fin and lands every hop with a splash.',
    medium: 'Animated pixels on canvas', size: '384 × 216 px',
    hint: 'Tap the ball to boost it · tap Mudkip · tap the water',
  };

  return { noon, W, H, gradeMudkip, gradeBall, tintFn, drawHeart, drawGrass };
})();

(() => {

  const W = Paintings.W, H = Paintings.H;

  /* ---------------- shared helpers ---------------- */
  const SIN = new Float32Array(4096);
  for (let i = 0; i < 4096; i++) SIN[i] = Math.sin((i / 4096) * Math.PI * 2);
  // palette grader: i = ramp index (0 deep .. 4 highlight), -1 = lit outline/line, -2 = dark outline
  function grader(o) {
    const sh = o.shadow && [hex(o.shadow[0]), o.shadow[1]];
    const li = o.light && [hex(o.light[0]), o.light[1]];
    const all = o.all && [hex(o.all[0]), o.all[1]];
    const dim = o.dim || 0;
    return (c, i) => {
      let r = c;
      if (all) r = mix(r, all[0], all[1]);
      if (sh && i <= 1) r = mix(r, sh[0], sh[1] * (i <= 0 ? 1 : 0.65));
      if (li && i >= 3) r = mix(r, li[0], li[1] * (i === 4 ? 1 : 0.7));

      return r;
    };
  }
  // thin stratus streak lit from below: pal = [top, mid, lit, hot]
  function streak(seed, len, th, pal) {
    const b = new Buf(len, th + 3);
    for (let x = 0; x < len; x++) {
      const u = x / (len - 1);
      const env = Math.pow(Math.sin(Math.PI * u), 0.55);
      const thick = Math.max(1, Math.round(th * env * (0.65 + 0.6 * fbm(x * 0.07, 1, seed, 2))));
      const top = Math.round((th - thick) * 0.55 + (fbm(x * 0.04, 3, seed, 2) - 0.5) * 3) + 1;
      for (let j = 0; j < thick; j++) {
        const v = thick === 1 ? 0.6 : j / (thick - 1);
        b.set(x, top + j, v > 0.8 ? pal[3] : v > 0.5 ? pal[2] : v > 0.22 ? pal[1] : pal[0]);
      }
    }
    return b;
  }
  function sunDisc(buf, cx, cy, r, cols, hz, t, flat = 1) {

  // rotating lighthouse beam: dx = sin(angle), dithered lighten wedge
  function beam(fb, lx, ly, dx, len, color, strength, hz) {
    const L = Math.abs(dx) * len + 6;
    const dir = Math.sign(dx) || 1;
    for (let k = 2; k < L; k++) {
      const x = lx + dir * k;
      const half = 1 + k * 0.07;
      const f = (1 - k / L) * strength;
      for (let y = Math.floor(ly - half); y <= ly + half * 0.6; y++) {
        if (y >= hz + 2 || x < 0 || x >= W || y < 0) continue;
        if (bayer4(x, y) < f * (1 - Math.abs(y - ly) / (half + 1))) {
          const i = y * W + x;
          fb.d[i] = mixc(fb.d[i], color, 0.35);
        }
      }
    }
  }

      }
      // shooting stars
      S.shoot -= dt;
      if (S.shoot <= 0) { S.shoot = 8 + Math.random() * 7; spawnMeteor(); }
      for (const m of S.meteors) m.age += dt;
      S.meteors = S.meteors.filter((m) => m.age < m.life);
      parts.update(dt);
      return sounds.splice(0);
    }
    function spawnMeteor(x, y) {
      S.meteors.push({ x: x ?? 60 + Math.random() * 260, y: y ?? 6 + Math.random() * 30, vx: -(90 + Math.random() * 60), vy: 40 + Math.random() * 20, age: 0, life: 0.9 });
    }
    function draw(fb) {
      const t = S.t;
      fb.copyFrom(bg);
      for (const s of stars) {
        const tw = Math.sin(t * s.sp + s.ph);
        if (tw < -0.5) continue;
        if (s.big && tw > 0.55) star(fb, s.x, s.y, 2, s.c, hex('#5a6aa8'));
        else fb.set(s.x, s.y, tw > 0.2 ? s.c : hex('#6a7ab8'));
      }
      for (const m of S.meteors) {
        const k = m.age / m.life;
        const x = m.x + m.vx * m.age, y = m.y + m.vy * m.age;
        for (let j = 0; j < 14; j++) {
          const px = Math.round(x - m.vx * j * 0.006), py = Math.round(y - m.vy * j * 0.006);
          if (py >= hz || bayer4(px, py) < k * 0.8 + j * 0.05) continue;
          fb.set(px, py, j < 2 ? hex('#ffffff') : j < 6 ? hex('#cfe0ff') : hex('#6f84c8'));
        }
      }
      for (const c of clouds) {
        const span = W + c.b.w;
        const x = ((c.x + t * c.sp) % span + span) % span - c.b.w;
        fb.blit(c.b, x, c.y, { test: (px, py) => py < hz });
      }
      // lighthouse: lamp flare + sweeping beam
      if (lamp) {
        const a = t * 0.85, dx = Math.sin(a), toward = Math.cos(a);
        beam(fb, lamp.lampX, lamp.lampY, dx, 190, hex('#fff2c8'), 0.55, hz);
        Scenery.glow(fb, lamp.lampX + 0.5, lamp.lampY + 0.5, toward > 0.9 ? 22 : 9, hex('#fff2c0'), toward > 0.9 ? 1 : 0.7, (x, y) => y < hz + 3);
      }
      glitter(fb, t, MX, hz + 1, 176, 5, 40, pal.glint, 13, (x, y) => beach.isWater(x, y) || y < 150, 0.55);
      beach.drawShore(fb, t, { glowFoam: pal.foam });
      // bioluminescent glow spilling from the foam
      for (let x = 0; x < W; x++) {
        const e = Math.floor(beach.edge[x]);
        const inf = beach.waveInfo()[x];
        const strength = inf.p > 0.36 && inf.p < 0.7 ? 1 : 0.45;
        for (let j = -9; j <= 5; j++) {
          const y = e + j;
          if (y < 0 || y >= H) continue;
          const k = (1 - Math.abs(j + 2) / 9) * strength * 0.55;
          if (k > 0 && bayer4(x, y) < k) { const i = y * W + x; fb.d[i] = mixc(fb.d[i], glowC, 0.3); }
        }
        if (inf.br !== null) {
          const by = Math.round(inf.br);
          for (let j = -3; j <= 3; j++) if (bayer4(x, by + j) < 0.4 - Math.abs(j) * 0.1) { const i = (by + j) * W + x; if (by + j < H) fb.d[i] = mixc(fb.d[i], glowC, 0.3); }
        }
      }
      // moonlight on the wet sand
      for (let x = 286; x < 326; x++) {
        const wv = Math.floor(beach.wet[x]), e = Math.floor(beach.edge[x]);
        for (let y = e; y < wv; y++) if (hash2(x, y >> 1, 7) < 0.3 - Math.abs(x - MX) / 70) fb.set(x, y, pal.sheen);
      }
      const [ox, oy] = mk.origin();
      projShadow(fb, mk.last, ox, oy, mk.gy + 1, -0.4, 0.16, dark, null, 60);
      ball.render();
      projShadow(fb, ball.sprite, Math.round(ball.x) - ball.sprite.cx, Math.round(ball.y) - ball.sprite.cy, mk.gy + 1, -0.4, 0.16, dark);
      parts.draw(fb, 0, t);
      ball.draw(fb);
      if (Paintings.hook) Paintings.hook(fb, 'back');
      mk.draw(fb);
      // fireflies drifting over the sand
      for (const f of flies) {
        const x = f.x + Math.sin(t * f.sp + f.ph) * f.a, y = f.y + Math.sin(t * f.sp * 1.7 + f.ph * 2) * 5;
        const on = Math.sin(t * 2.2 + f.ph * 3) > -0.2;
        if (!on) continue;
        Scenery.glow(fb, x + 0.5, y + 0.5, 4, hex('#d8f080'), 0.9);
        fb.set(Math.round(x), Math.round(y), hex('#fbffc8'));
      }
      parts.draw(fb, 1, t);
      if (S.heart > 0) Paintings.drawHeart(fb, mk.anchor('finTip')[0] + 6, mk.anchor('finTip')[1] - 6 - (1.2 - S.heart) * 12, S.heart);
      fb.blit(palm[Math.floor(t * 1.6) % palm.length], 270, -30);
      if (Paintings.hook) Paintings.hook(fb, 'front');
      vignette(fb);
    }
    function tap(x, y) {
      const s = mk.last, [ox, oy] = mk.origin();
      const sx = Math.round(x - ox), sy = Math.round(y - oy);
      if (s && sx >= 0 && sy >= 0 && sx < s.buf.w && sy < s.buf.h && s.buf.d[sy * s.buf.w + sx]) {
        S.stir = 2.8; S.heart = 1.2; mk.fin.kick(3); mk.sq.kick(-1.5);
        emit('cry');
        return 'mudkip';
      }
      if (Math.hypot(x - ball.x, y - ball.y) < ball.R + 5) {
        ball.rot = M3.mul(Ball.axisAngle([0, 0, 1], 0.7), ball.rot);
        sparkBurst(parts, ball.x, ball.y, 5, hex('#ffffff'), hex('#8fe8ff'));
        emit('twinkle');
        return 'ball';
      }
      if (y < hz) { spawnMeteor(x + 30, y - 6); sparkBurst(parts, x, y, 4, hex('#ffffff'), hex('#9fb4ff'), 14); emit('twinkle'); return 'sky'; }
      if (beach.isWater(Math.round(x), Math.round(y))) {
        splash(parts, x, y, { power: 0.55, n: 12, crown: 10, test: beach.isWater, c: hex('#d8fff8'), c2: hex('#46e6d6'), ring: hex('#5ff2e0') });
        emit('splash', { small: true });
        return 'water';
      }
      sparkBurst(parts, x, y, 5, hex('#fbffc8'), hex('#d8f080'), 16);
      emit('twinkle');
      return 'other';
    }
    return {
      meta: {
        id: 'night', no: 'V', title: 'Moonlit Lullaby', time: '23:10', place: 'Route 109 shore', poster: 7, period: 7.8,
        blurb: 'Tired out, Mudkip sleeps curled against the ball. The breaking waves glow blue-green, the lighthouse beam sweeps the bay and now and then a star falls.',
        medium: 'Animated pixels on canvas', size: '384 × 216 px',
        hint: 'Tap Mudkip to stir it · tap the sky for a falling star · tap the glowing water',
        alt: 'Pixel painting at night: a full moon and stars over a dark sea with glowing blue-green waves, a lighthouse beam, and Mudkip asleep on the sand leaning on its beach ball.',
      },
      W, H, step, draw, tap,
      warm(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) step(1 / 30); sounds.length = 0; },
    };
  }

  /* ================================================================
     III · SWELL SEASON (afternoon) — swimming, flicks and a leap
     ================================================================ */
  function surf() {
    const hz = 80;
    const pal = Beach.H({
      sky: [[0, '#3a7bcd'], [0.3, '#4a8fda'], [0.6, '#6aa9e6'], [0.85, '#95c6f0'], [1, '#c6e3f6']],
      sea: [[0, '#8fbfe6'], [0.02, '#255aa3'], [0.16, '#2867b2'], [0.45, '#2c7cc0'], [0.78, '#3190c9'], [1, '#369fcc']],
      horizon: '#b4d8f2',
      shallow: ['#369fcc', '#3fb3d4', '#5ac6d6', '#8ddcd8', '#bcead8'],
      foam: ['#ffffff', '#dff4fa', '#a6d7e8'],
      sand: ['#c49a60', '#ddbb82', '#edd4a0', '#f7e7c2'], sandWet: ['#9c7a50', '#b59262', '#c6a576', '#d9c09a'],
      cloud: ['#9dbbdc', '#c5daee', '#e9f3fc', '#ffffff'],
      head: {
        rock: ['#445a70', '#5c738b', '#809bb0'], grass: ['#3d8a45', '#6ab85c'],
        tower: ['#b7b0a7', '#eeeae3', '#ffffff'], stripe: ['#94302b', '#d2443a', '#ee675a'],
        iron: '#343a46', glass: '#9fd9f2', roof: '#b3352e', lampOn: ['#ffe58a', '#fff8d2'],
      },
      rock: ['#1f2c3c', '#2f4054', '#46596e', '#6a8196', '#9ab0c0'],
      shadow: '#1d3a6a',
    });
    const beach = Beach.create({ W, H, hz, pal, seed: 61, sandTop: H, sun: { x: 370, y: -40, r: 200, k: 0.42, p: 1.5 }, skyBand: 0.2, seaBand: 0.5, shore: () => H + 60, wave: { reach: 0 } });
    const bg = beach.bg;
    const lamp = Scenery.headland(bg, { x: 268, y: hz, w: 118, pal: pal.head, seed: 9 });
    // foreground rocks (bottom right), baked into their own layer
    const rocks = new Buf(W, H);
    const boulders = [[330, 208, 30, 20], [364, 196, 26, 24], [300, 214, 18, 12], [384, 214, 22, 16], [352, 214, 16, 10]];
    for (const [cx, cy, rx, ry] of boulders)
      for (let y = Math.floor(cy - ry); y < Math.min(H, cy + ry); y++)
        for (let x = Math.floor(cx - rx); x < Math.min(W, cx + rx); x++) {
          const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry;
          const d = u * u + v * v + (fbm(x * 0.2, y * 0.2, 4, 2) - 0.5) * 0.35;
          if (d > 1 || x < 0) continue;
          const lit = -u * 0.5 - v * 0.85;
          let tn = lit > 0.55 ? 4 : lit > 0.15 ? 3 : lit > -0.3 ? 2 : 1;
          if (d > 0.86) tn = 0;
          if (hash2(x, y, 3) < 0.08 && tn > 1) tn -= 1;
          rocks.set(x, y, pal.rock[tn]);
        }
    const clouds = [
      { buf: Scenery.makeCloud(71, 120, 40, pal.cloud, { upper: 3 }), x: 20, y: 10, sp: 1.6 },
      { buf: Scenery.makeCloud(77, 70, 24, pal.cloud), x: 190, y: 26, sp: 1.1 },
      { buf: Scenery.makeCloud(83, 44, 15, pal.cloud, { upper: 1, puffs: 4 }), x: 300, y: 12, sp: 0.8 },
    ];
    const vignette = Beach.makeVignette(W, H, 0.5, hex('#10224a'));
    const parts = new Scenery.Particles();
    const light = { dir: [0.45, 0.75, 0.5] };
    const mk = new MudkipActor({ x: 150, gy: 170, yaw: 1.2, pal: Mudkip.BASE_PAL, light, scale: 1.24, bh: 150, oy: 0.72 });
    const ball = new BallActor({ x: 200, y: 140, R: 12, light });
    const A0 = 1.7, EXP = 0.6, OM = 1.9;
    const phiRow = new Float32Array(H + 1);
    for (let y = 0; y <= H; y++) phiRow[y] = y > hz ? A0 * Math.pow(y - hz, EXP) : 0;
    const phi = (x, y, t) => A0 * Math.pow(Math.max(0, y - hz), EXP) - OM * t + 0.45 * Math.sin(x * 0.028 + y * 0.03 - t * 0.6) + 0.3 * Math.sin(x * 0.067 - y * 0.02 + t * 0.4);
    const amp = (y) => 0.4 + 3.4 * clamp((y - hz) / (H - hz), 0, 1);
    const surfAt = (x, y, t) => y - Math.sin(phi(x, y, t)) * amp(y);
    const DEPTH = 150;
    const toneDark = PX.cmap((c) => mix(c, hex('#15427f'), 0.34));
    const toneLight = PX.cmap((c) => mix(c, hex('#95d2f0'), 0.26));
    const crestC = hex('#e3f7ff');
    const under = PX.cmap((c) => mix(c, hex('#1d5a98'), 0.62));
    const under2 = PX.cmap((c) => mix(c, hex('#1a4f8c'), 0.78));
    const S = { t: 0, mode: 'swim', dir: 1, flicks: 0, sink: 19, u: 0, leap: null, ballMode: 'float', vx: 0, happy: 0, heart: 0, wakeT: 0, spray: 2.5, recover: 0, exitDone: false, entryDone: false, diveT: 0 };
    const G = 260;
    const sounds = [];
    const emit = (name, o = {}) => sounds.push(Object.assign({ name }, o));
    const inSea = (x, y) => y > hz && !rocks.get(x, y);

    function launchBall(vx, vy) { S.ballMode = 'air'; ball.vx = vx; ball.vy = vy; ball.axis = V3.norm([Math.random() - 0.5, 0.5, 1]); ball.w = -Math.sign(vx) * (6 + Math.random() * 4); }

    function step(dt) {
      S.t += dt;
      const t = S.t;
      mk.sq.step(dt); mk.fin.step(dt); mk.tail.step(dt);
      S.happy = Math.max(0, S.happy - dt);
      S.heart = Math.max(0, S.heart - dt);
      // ---- ball
      const bs = surfAt(ball.x, DEPTH + 2, t);
      if (S.ballMode === 'air') {
        ball.vy += G * dt; ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        if (ball.x < 60 || ball.x > 316) ball.vx = -ball.vx;
        if (ball.vy > 0 && ball.y >= bs - ball.R * 0.5) {
          S.ballMode = 'float'; ball.vx *= 0.25;
          splash(parts, ball.x, bs + 1, { power: 0.7, n: 14, crown: 10, test: inSea });
          emit('splash');
        }
      } else {
        ball.vx *= Math.exp(-1.4 * dt);
        ball.x += ball.vx * dt;
        ball.y = bs - ball.R * 0.5;
        ball.w *= Math.exp(-1.2 * dt);
      }
      ball.spin(dt);
      // ---- mudkip
      const surfY = surfAt(mk.x, DEPTH, t);
      const noseOff = 20;
      if (S.mode === 'swim') {
        S.sink += (19 - S.sink) * Math.min(1, dt * 4);
        if (S.ballMode === 'float') {
          const wantDir = ball.x > 290 ? -1 : ball.x < 90 ? 1 : S.dir;
          if (wantDir !== S.dir && Math.abs(ball.x - mk.x) > 26) S.dir = wantDir;
          const target = ball.x - S.dir * noseOff;
          const gap = target - mk.x;
          if (Math.abs(gap) > 3) {
            if (Math.sign(gap) !== S.dir && Math.abs(gap) > 30) S.dir = Math.sign(gap);
            S.vx += (Math.sign(gap) * Math.min(38, Math.abs(gap) * 2.5) - S.vx) * Math.min(1, dt * 3);
          } else {
            S.vx *= 0.8;
            // flick!
            S.flicks++;
            const dir = ball.x > 250 ? -1 : ball.x < 130 ? 1 : S.dir;
            launchBall(dir * (46 + Math.random() * 22), -(150 + Math.random() * 30));
            S.dir = dir;
            mk.fin.kick(6); mk.sq.kick(-3); S.happy = 0.35;
            splash(parts, ball.x, surfY + 1, { power: 0.45, n: 8, crown: 6, test: inSea });
            emit('boing');
            if (S.flicks % 3 === 0) { S.mode = 'dive'; S.diveT = 0; }
          }
        } else S.vx *= Math.exp(-2 * dt);
        mk.x += S.vx * dt;
      } else if (S.mode === 'dive') {
        S.diveT += dt;
        S.sink = lerp(19, 56, Math.min(1, S.diveT / 0.45));
        if (Math.random() < dt * 30) parts.add({ type: 'drop', x: mk.x + (Math.random() - 0.5) * 16, y: surfY - 1, vx: 0, vy: -10, g: 0, life: 0.35, c: pal.foam[1], size: 1, layer: 1 });
        if (S.diveT > 0.45 && S.ballMode === 'float') {
          // turn (unseen, under water) to face the ball, then leap at it
          S.dir = Math.sign(ball.x - mk.x) || S.dir;
          mk.yaw = S.dir > 0 ? 1.2 : Math.PI - 1.2;
          const x1 = ball.x - S.dir * 10;
          S.mode = 'leap'; S.u = 0; S.exitDone = false; S.entryDone = false;
          S.leap = { x0: mk.x, x1, dur: 0.85 };
          emit('jump');
        }
      } else if (S.mode === 'leap') {
        S.u += dt / S.leap.dur;
        const u = Math.min(1, S.u);
        mk.x = lerp(S.leap.x0, S.leap.x1, u);
        const y0 = 56, y1 = 30, apex = -42;
        const yc = 2 * apex - (y0 + y1) / 2;
        S.sink = (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * yc + u * u * y1;
        if (!S.exitDone && S.sink < 12) { S.exitDone = true; splash(parts, mk.x, surfY + 1, { power: 1, test: inSea }); emit('splash'); }
        if (!S.entryDone && u > 0.55 && S.sink > 12) {
          S.entryDone = true;
          splash(parts, mk.x + S.dir * 6, surfY + 1, { power: 1.35, test: inSea });
          emit('splash', { big: true });
          if (S.ballMode === 'float' && Math.abs(ball.x - mk.x) < 40) launchBall(S.dir * 24, -175);
        }
        if (u >= 1) { S.mode = 'swim'; S.vx = S.dir * 10; S.happy = 0.8; mk.sq.kick(3); }
      }
      mk.gy = surfY + S.sink;
      // wake while swimming
      S.wakeT -= dt;
      if (S.mode === 'swim' && Math.abs(S.vx) > 6 && S.wakeT <= 0) {
        S.wakeT = 0.07;
        for (const side of [-1, 1]) parts.add({ type: 'wake', x: mk.x - S.dir * 8, y: surfY + side * 1.2, vx: -S.dir * 14, vy: side * 7, life: 1.3, layer: 0, draw: (fb, p, k) => {
          const x = Math.round(p.x), y = Math.round(p.y);
          if (bayer4(x, y) < k) return;
          if (inSea(x, y)) { fb.set(x, y, pal.foam[k < 0.3 ? 0 : 1]); if (k < 0.5) fb.set(x - Math.sign(p.vx), y, pal.foam[2]); }
        } });
      }
      // waves bursting on the rocks
      S.spray -= dt;
      if (S.spray <= 0) {
        S.spray = 4.6 + Math.random() * 2;
        for (const [rx, ry, pw] of [[336, 190, 1.2], [364, 174, 1.4], [306, 204, 0.8]]) {
          for (let i = 0; i < 26 * pw; i++) {
            const a = -Math.PI / 2 + (Math.random() - 0.62) * 1.5;
            const sp = (120 + Math.random() * 140) * pw;
            parts.add({ type: 'drop', x: rx + (Math.random() - 0.5) * 22, y: ry, vx: Math.cos(a) * sp * 0.6, vy: Math.sin(a) * sp, g: 380, life: 1.6, c: pal.foam[0], c2: pal.foam[1], size: Math.random() < 0.6 ? 2 : 1, layer: 2 });
          }
          parts.add({ type: 'crown', x: rx, y: ry + 2, w: 18 * pw, h: 26 * pw, life: 0.7, c: pal.foam[0], c2: pal.foam[1], layer: 2, seed: Math.floor(Math.random() * 99) });
        }
        emit('wave');
      }
      // pose
      const air = S.mode === 'leap' && S.sink < 8;
      const u = S.mode === 'leap' ? Math.min(1, S.u) : 0;
      const yawT = S.dir > 0 ? 1.2 : Math.PI - 1.2;
      mk.yaw += clamp(yawT - mk.yaw, -dt * 4, dt * 4);
      const blink = S.happy <= 0 && mk.blink(t, dt);
      const pad = Math.sin(t * 10);
      mk.sprite({
        squash: clamp(mk.sq.x * 0.5, -0.15, 0.2),
        lean: S.mode === 'leap' ? lerp(0.95, -1.05, u) : 0.06,
        headPitch: S.mode === 'leap' ? 0.1 : 0.12,
        legF: S.mode === 'leap' ? -0.7 : pad * 0.6,
        legB: S.mode === 'leap' ? 0.8 : -pad * 0.6,
        mouth: S.happy > 0 || air ? 1 : 0.6,
        eyes: S.happy > 0 || air ? 'happy' : blink ? 'blink' : 'open',
        finSway: clamp(0.04 + mk.fin.x * 0.3 + (S.mode === 'leap' ? 0.1 : 0), -0.25, 0.4),
        tailLift: S.mode === 'leap' ? 0.3 : clamp(mk.tail.x * 0.3, -0.2, 0.3),
        tailWag: Math.sin(t * 9) * 0.35,
        gill: Math.sin(t * 6) * 0.07,
      });
      parts.update(dt);
      return sounds.splice(0);
    }

    function drawSea(fb, t) {
      const d = fb.d;
      const fs = (v) => SIN[((v * 651.8986) | 0) & 4095];
      for (let y = hz + 1; y < H; y++) {
        const p = (y - hz) / (H - hz);
        const pr = phiRow[y];
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const ph = pr - OM * t + 0.45 * fs(x * 0.028 + y * 0.03 - t * 0.6) + 0.3 * fs(x * 0.067 - y * 0.02 + t * 0.4);
          let m = ph % 6.2832; if (m < 0) m += 6.2832;
          const crest = Math.floor(ph / 6.2832);
          const hgt = fs(ph);
          const seg = vnoise(x * 0.045 + crest * 3.7, crest * 1.3, 11);
          if (hgt > (p < 0.25 ? 0.975 : 0.935)) {
            d[i] = p > 0.22 && seg > 0.46 ? (hash2(x, crest, 3) < 0.85 ? crestC : pal.foam[1]) : toneLight(d[i]);
            continue;
          }
          if (m > 1.75 && m < 2.9 && p > 0.05) d[i] = seg > 0.3 || bayer4(x, y) < 0.5 ? toneDark(d[i]) : d[i];
          else if (m > 0.2 && m < 1.4 && p > 0.12 && bayer4(x, y) < 0.6) d[i] = toneLight(d[i]);
          // spilling foam just in front of broken crests
          if (p > 0.45 && m > 1.57 && m < 2.05 && seg > 0.55 && vnoise(x * 0.16, y * 0.6 + crest * 7, 5) > 0.58) d[i] = pal.foam[(x + y) & 1 ? 0 : 2];
          // sun sparkles on the back slopes
          if (m > 0.4 && m < 1.3 && hash2(x, y, Math.floor(t * 3)) < 0.004 + p * 0.004) d[i] = hex('#ffffff');
        }
      }
    }

    function drawMudkip(fb, t) {
      const s = mk.last, [x0, y0] = mk.origin();
      const w = s.buf.w, h = s.buf.h, sd = s.buf.d;
      for (let sy = 0; sy < h; sy++) {
        const Y = y0 + sy;
        if (Y < 0 || Y >= H) continue;
        for (let sx = 0; sx < w; sx++) {
          const c = sd[sy * w + sx];
          if (!c) continue;
          const X = x0 + sx;
          const sY = surfAt(X, DEPTH, t);
          let col = c, xx = X;
          if (Y > sY + 0.5) {

        id: 'surf', no: 'III', title: 'Swell Season', time: '15:30', place: 'Off Route 109', poster: 9, period: 5.5,
        blurb: 'Out past the breakers the swell rolls in steadily. Mudkip swims after the ball, flicks it with its fin, and every third throw dives and leaps clear of the water after it.',
