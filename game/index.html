        if (d < LWH) return glow && d < 0.45 * LWH ? cCORE : cRED;
      }
      for (let i = 0; i < vols.length; i++) if (inVol(vols[i], X, Y, Z)) return cPALE;
      return ny < -0.55 ? cBELLY : cBODY;
    };
    // body ellipsoid: rest centre c, radii r, optional rest tilt about z (radians)
    const bodyEll = (frame, c, r, part, head, tilt = 0) => {
      const [cx, cy, cz] = c, [rx, ry, rz] = r;
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      const rm = Math.max(rx, ry);
      const vols = PATCHES.concat(SLITS).filter((V) => Math.abs(V.c[0] - cx) < rm + V.r[0] + 10 && Math.abs(V.c[1] - cy) < rm + V.r[1] + 10);
      const f = chain(frame, T(cx, cy, cz), R(M3.rz(tilt)));
      return ell(f, r, {
        part, grp: 1,
        mat: (s) => {
          const lx = rx * s[0], ly = ry * s[1];
          const X = cx + lx * ct - ly * st, Y = cy + lx * st + ly * ct;
          const gx = Math.floor(X - SG.u0), gy = Math.floor(Y - SG.v0);
          const gi = gx >= 0 && gy >= 0 && gx < SG.gw && gy < SG.gh ? gy * SG.gw + gx : -1;
          if (head && gi >= 0 && JAWA[gi]) return 0;
          const ax = s[0] / rx, ay = s[1] / ry, nz = s[2] / rz;
          const ny = ax * st + ay * ct, nx = ax * ct - ay * st;
          const il = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
          return skin(X, Y, cz + rz * s[2], ny * il, Math.abs(nz) * il, head, vols, gi);
        },
      });
    };

    // --- head group (pitches about the neck): the big front ellipsoid carries the head
    const mouthK = Math.max(0, Math.min(1, P.mouth || 0));
    const headF = chain(root, pivot([150, 96, 0], M3.rz(P.headPitch)));
    const headPrim = bodyEll(headF, HEAD.c, HEAD.r, 1, true, HEAD.tilt);
    prims.push(headPrim);
    // lower jaw hinged behind the mouth corner
    const jawF = chain(headF, pivot([208, 70, 0], M3.rz(-0.34 * mouthK)));
    prims.push(ell(chain(jawF, T(292, 50, 0)), [106, 48, 78], {
      part: 3, grp: 2,
      mat: (s) => (s[1] < -0.72 ? code(PALE, -1) : code(PALE)),
    }));
    // mouth interior (only needed while the jaw is open)
    if (mouthK > 0.02) prims.push(ell(chain(headF, T(290, 62, 0)), [96, 26, 70], {
      part: 4, grp: 3,
      mat: (s) => (s[1] < 0.1 && Math.abs(s[2]) < 0.6 && s[0] > -0.5 ? code(TONGUE) : code(MOUTH)),
    }));

    // --- body (static mid, rear chain waves with the tail phase)
    const ph = P.tail;
    prims.push(bodyEll(root, [40, 104, 0], [140, 84, 102], 5, false));
    const rearF = chain(root, pivot([-30, 112, 0], M3.rz(0.05 * Math.sin(ph))));
    prims.push(bodyEll(rearF, [-70, 114, 0], [84, 44, 50], 7, false));
    const stockF = chain(rearF, pivot([-110, 114, 0], M3.rz(0.08 * Math.sin(ph - 0.7))));
    prims.push(bodyEll(stockF, [-122, 114, 0], [52, 26, 28], 8, false));

    // --- dorsal fin
    {
      const E = DORSAL_E;
      const cEdge = code(FIN, -1);
      const DB = [code(FIN, -1), code(FIN, 0), code(FIN, 1)];
      prims.push(clipped(ell(chain(root, T(E.cx, E.cy, 0)), [E.rx, E.ry, E.rz], { part: 9, grp: 4, mat: null }), (a, b, c) => {
        const v = pk(DORSAL_PK, E.cx + E.rx * a, E.cy + E.ry * b);
        if (!v) return 0;
        const d = v >> 3;
        if (d < LW8) return glow && d < 0.45 * LW8 ? cCORE : cRED;
        const bv = ((v >> 1) & 3) - (c > -0.3 && c < 0.3 ? 1 : 0);
        return DB[bv < 0 ? 0 : bv];
      }, (a, b) => (pk(DORSAL_PK, E.cx + E.rx * a, E.cy + E.ry * b) ? cEdge : 0), 2, E.rx));
    }

    // --- pectoral fins (near, far = mirror); sweep: fin=+1 up/forward, -1 down/back
    const sw = Math.max(-1, Math.min(1, P.fin));
    const R0 = M3.mul(M3.ry(0.72), M3.mul(M3.rz(0.38), M3.rx(-0.95)));
    // k = extra tuck for the fin on the far side of the camera (side cheat), so it never spikes out
    const finFrame = (k) => {
      const lift = -0.55 * sw * (sw < 0 ? 1 - 0.85 * k : 1) - 0.2 * k;
      const sc = 1 - 0.42 * k;
      return { L: M3.mul(M3.mul(M3.ry(0.3 * sw - 0.45 * k), M3.rx(lift)), M3.mul(R0, M3.diag(sc, sc, sc))), t: [185, 48, 78 - 14 * k] };
    };
    const finParts = [];
    for (const sd of [1, -1]) {
      let f = finFrame(Math.max(0, -sd * (P.side ?? 1)) * (1 - 0.7 * Math.max(0, sw)));
      if (sd < 0) f = mirrorF(f);
      const fr = chain(root, f);
      const u = [-1, 0, 0], v = [0, 1, 0], w = [0, 0, 1];
      const E = FIN_E;
      const gid = sd > 0 ? 5 : 6;
      const cFinEdge = code(FIN, -1);
      const FB = [code(FIN, -1), code(FIN, 0), code(FIN, 1)], cFINU = code(FINU);
      prims.push(clipped(shell(fr, V3.add(V3.scale(u, E.cu), V3.scale(v, E.cv)), u, w, v, [E.ru, E.rw, E.rv], { part: 10 + (sd < 0 ? 1 : 0), grp: gid, mat: null }), (a, b, c) => {
        const pv = pk(FIN_PK, E.cu + E.ru * a, E.cv + E.rv * c);
        if (!pv) return 0;
        if (b < 0) return cFINU;
        const d = pv >> 3;
        if (d < LW8) return glow && d < 0.45 * LW8 ? cCORE : cRED;
        return FB[(pv >> 1) & 3];
      }, (a, b, c) => (pk(FIN_PK, E.cu + E.ru * a, E.cv + E.rv * c) ? cFinEdge : 0), 1, E.ru));
      // claws
      CLAWS.forEach((c, k) => {
        const ca = Math.cos(c.a), sa = Math.sin(c.a);
        const cu = V3.add(V3.scale(u, ca), V3.scale(v, sa));
        const cv = V3.add(V3.scale(u, -sa), V3.scale(v, ca));
        const ctr = V3.add(V3.add(V3.scale(u, c.u), V3.scale(v, c.v)), V3.add(V3.scale(cu, 16), V3.scale(w, -3)));
        const cClawEdge = code(CLAW, -1), CB = [code(CLAW, -1), code(CLAW, 0), code(CLAW, 1)];
        prims.push(clipped(shell(fr, ctr, cu, w, cv, [CLAW_E.ru, CLAW_E.rw, CLAW_E.rv], { part: 12 + k + (sd < 0 ? 4 : 0), grp: 7 + (sd < 0 ? 1 : 0), mat: null }), (a, b, c) => {
          const pv = pk(CLAW_PK, CLAW_E.ru * a, CLAW_E.rv * c);
          if (!pv) return 0;
          return b < 0 ? cClawEdge : CB[(pv >> 1) & 3];
        }, (a, b, c) => (pk(CLAW_PK, CLAW_E.ru * a, CLAW_E.rv * c) ? cClawEdge : 0), 1, CLAW_E.ru));
      });
      finParts.push(fr);
    }

    // --- tail streamers: vertical fan of four ribbons (upper hooked pair, lower pair)
    const tailFin = (parentF, rootP, pitch, splay, segs, gid, partBase) => {
      const base = chain(parentF, T(...rootP), R(M3.ry(splay)), R(M3.rz(pitch)));
      let fr = chain(base, R(M3.rz(0.1 * Math.sin(ph - 1.4))));
      segs.forEach((sg, k) => {
        if (k > 0) fr = chain(fr, pivot([sg.j[0], sg.j[1], 0], M3.rz(0.14 * Math.sin(ph - 2.1 - k * 0.5))));
        const E = sg.e;
        // fin space: u back (-x), v up (+y), w = z
        const cTailEdge = code(TAILF), TB = [code(TAILF, -1), code(TAILF, 0), code(TAILF, 1)];
        prims.push(clipped(shell(fr, [-E.cu, E.cv, 0], [-1, 0, 0], [0, 0, 1], [0, 1, 0], [E.ru, E.rw, E.rv], { part: partBase + k, grp: gid, mat: null }), (a, b, c) => {
          const pv = pk(E.pk, E.cu + E.ru * a, E.cv + E.rv * c);
          return pv ? TB[(pv >> 1) & 3] : 0;
        }, (a, b, c) => (pk(E.pk, E.cu + E.ru * a, E.cv + E.rv * c) ? cTailEdge : 0), 1, E.ru));
      });
      return fr;
    };
    const upSeg = [{ e: UP_A }, { e: UP_B, j: [-40, 76] }];
    const loSeg = [{ e: LO_A }, { e: LO_B, j: [-120, -6] }];
    tailFin(stockF, [-100, 134, 8], 0.1, 0.2, upSeg, 9, 20);
    tailFin(stockF, [-106, 132, -8], -0.12, -0.2, upSeg, 10, 22);
    const loN = tailFin(stockF, [-150, 114, 6], 0.03, 0.18, loSeg, 11, 24);
    tailFin(stockF, [-150, 110, -6], 0.22, -0.18, loSeg, 12, 26);

    // --- anchors
    const eyeS = (() => {
      const t = HEAD.tilt, dx = EYE.x - HEAD.c[0], dy = EYE.y - HEAD.c[1];
      const lx = dx * Math.cos(t) + dy * Math.sin(t), ly = -dx * Math.sin(t) + dy * Math.cos(t);
      const s0 = lx / HEAD.r[0], s1 = ly / HEAD.r[1];
      return [s0, s1, Math.sqrt(Math.max(0, 1 - s0 * s0 - s1 * s1))];
    })();
    const anchors = {
      eye: { p: V3.add(headPrim.c, M3.v(headPrim.L, eyeS)), s: eyeS },
      mouth: V3.scale(V3.add(V3.add(headF.t, M3.v(headF.L, [394, 70, 0])), V3.add(jawF.t, M3.v(jawF.L, [392, 66, 0]))), 0.5),
      finTipN: V3.add(finParts[0].t, M3.v(finParts[0].L, [-280, 0, 0])),
      finTipF: V3.add(finParts[1].t, M3.v(finParts[1].L, [-280, 0, 0])),
      tail: V3.add(loN.t, M3.v(loN.L, [-250, -6, 0])),
      head: V3.add(headF.t, M3.v(headF.L, [300, 110, 0])),
    };
    return {
      autoSide: !pose || pose.side === undefined,
      prims, anchors, pose: P, headPrim, stamps: [], dots: [],
      pri: { 1: 1, 2: 2, 3: 0, 4: 2, 5: 3, 6: 3, 7: 2, 8: 2, 9: 2, 10: 2, 11: 2, 12: 2 },
      glossy: GLOSSY, baseMat: BODY, shadowSteps: 0,
    };
  }

  // Render into a tight buffer around the model's projected bounds (same bbox maths as the
  // renderer, so the pixels are identical), then place it in the full sprite buffer. The shared
  // renderer's full-buffer passes then only touch pixels near Kyogre, not the whole big buffer.
  function render(model, opt) {
    // `side` mirrors the camera cheats; when the caller did not pass it, derive it from the yaw
    // exactly like the game does (side = clamp(3 cos yaw, -1, 1)) and rebuild if it differs
    if (model.autoSide) {
      const sd = Math.max(-1, Math.min(1, 3 * Math.cos(opt.yaw ?? 1.05)));
      if (Math.abs(sd - model.pose.side) > 1e-6) model = build(Object.assign({}, model.pose, { side: sd }));
    }
    const sc = opt.scale || 1;
    LWH = 0.5 * Math.max(5.4, 1.7 / sc) * (1 + 0.3 * Math.min(1, model.pose.glow || 0));
    LW8 = LWH * 8;
    let pal = opt.pal || PAL;
    const g = Math.min(1, model.pose.glow || 0);
    if (g > 0) {
      const e = pal[RED];
      pal = Object.assign({}, pal, { [RED]: { r: e.r.map((c, i) => PX.mix(c, GLOW[i], g)), od: PX.mix(e.od, GLOW[0], g * 0.5), ol: PX.mix(e.ol, GLOW[1], g * 0.6), ln: PX.mix(e.ln, GLOW[0], g * 0.5) } });
    }
    const { yaw = 1.05, pitch = 0.16, W = 96, H = 96, ox = 48, oy = 82 } = opt;
    const V = M3.mul(M3.rx(pitch), M3.mul(M3.ry(-yaw), M3.diag(sc, sc, sc)));
    // nearest primitives first: hidden pixels then fail the depth test before any mat() call
    // (draw order only affects overdraw, not the image)
    const zs = new Map();
    for (const p of model.prims) zs.set(p, V[6] * p.c[0] + V[7] * p.c[1] + V[8] * p.c[2]);
    model.prims.sort((a, b) => zs.get(b) - zs.get(a));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of model.prims) {
      const cv = M3.v(V, p.c), Lv = M3.mul(V, p.L);
      const rx = Math.hypot(Lv[0], Lv[1], Lv[2]), ry = Math.hypot(Lv[3], Lv[4], Lv[5]);
      x0 = Math.min(x0, ox + cv[0] - rx); x1 = Math.max(x1, ox + cv[0] + rx);
      y0 = Math.min(y0, oy - cv[1] - ry); y1 = Math.max(y1, oy - cv[1] + ry);
    }
    const X0 = Math.max(0, Math.floor(x0) - 3), Y0 = Math.max(0, Math.floor(y0) - 3);
    const X1 = Math.min(W - 1, Math.ceil(x1) + 3), Y1 = Math.min(H - 1, Math.ceil(y1) + 3);
    if (X1 < X0 || Y1 < Y0) return Creature.render(model, Object.assign({}, opt, { pal }));
    const w = X1 - X0 + 1, h = Y1 - Y0 + 1;
    const r = Creature.render(model, Object.assign({}, opt, { pal, W: w, H: h, ox: ox - X0, oy: oy - Y0 }));
    const buf = new PX.Buf(W, H), depth = new Float32Array(W * H).fill(-1e9), part = new Uint8Array(W * H);
    for (let y = 0; y < h; y++) {
      const src = y * w, dst = (y + Y0) * W + X0;
      buf.d.set(r.buf.d.subarray(src, src + w), dst);
      depth.set(r.depth.subarray(src, src + w), dst);
      part.set(r.part.subarray(src, src + w), dst);
    }
    const anchors = {};
    for (const k in r.anchors) { const a = r.anchors[k]; anchors[k] = [a[0] + X0, a[1] + Y0, a[2]]; }
    return { buf, depth, part, W, H, ox, oy, anchors };
  }

  // Pokédex 4.5 m = the model's length (~790 units); its body is ~1.2 m tall without fins
  return { build, render, PAL, MAT, DEFAULT, meta: { heightM: 4.5, lengthM: 4.5, bw: 880, bh: 650, oy: 0.575 } };
})();

/* ------------------------------------------------------------------
   Dialga — the Temporal Pokémon, as a super small chibi (~95 units
   tall at yaw 1.1 including the crest; the player's size exception to
   the 5.4 m Pokédex height) posable 3D model rendered to pixel art by
   the shared Creature renderer (src/creature.js).
   x = forward, y = up, z = near side at yaw 0; y = 0 is the ground.
   Navy body with glowing cyan lines, silver armour (swept crest, visor
   band across the red eyes, shoulder plates with a fan of blades,
   chest shield, claws, tail fin) and the big Adamant diamond.
   The crest and blades are thin ellipsoid "shells" clipped to 2D
   outlines; an edge-on fallback keeps them solid from every angle.
------------------------------------------------------------------- */
const Dialga = (() => {
  const { chain, T, R, code } = Creature;
  // prims as { kind, part, grp, c, L, mat } literals (same hidden class as Mudkip's)
  const ell = (f, r, o) => ({ kind: 'ell', part: o.part, grp: o.grp, c: f.t, L: M3.mul(f.L, M3.diag(r[0], r[1], r[2])), mat: o.mat });
  const plate = (f, shape, o) => ({ kind: 'plate', part: o.part, grp: o.grp, c: f.t, L: f.L, shape, thick: o.thick || 1.4 });
  // Clipped thin "shell" ellipsoid: test(s0,s1,s2) = material of the nearest surface point or 0.
  // When that point is clipped away, march the view ray's chord through the ellipsoid (direction
  // from the renderer's prim.Li) so edge-on fins keep their silhouette; face-on nothing changes.
  const clipped = (prim, test, edge, thin, R) => {
    let li = null, cw = 1, dx = 0, dy = 0, dz = 0, dt = 0;
    prim.mat = (s) => {
      const m = test(s[0], s[1], s[2]);
      if (m) return m;
      const Li = prim.Li;
      if (Li !== li) {
        // once per render: view direction in local space, and |cos| between view and fin normal
        li = Li;
        const t3 = thin * 3;
        cw = Math.abs(Li[t3 + 2]) / Math.hypot(Li[t3], Li[t3 + 1], Li[t3 + 2]);
        const il = 1 / Math.hypot(Li[2], Li[5], Li[8]);
        dx = Li[2] * il; dy = Li[5] * il; dz = Li[8] * il;
        dt = thin === 0 ? dx : thin === 1 ? dy : dz;
      }
      if (cw > 0.5) return 0; // within 60 degrees of face-on: the surface clip is already right
      const k = 2 * (s[0] * dx + s[1] * dy + s[2] * dz);
      // samples ~3 units apart along the chord's travel across the fin plane
      const n = Math.min(8, Math.floor((k * Math.sqrt(Math.max(0, 1 - dt * dt)) * R) / 3));
      for (let j = 1; j <= n; j++) {
        const t = (k * j) / (n + 1);
        const e = edge(s[0] - t * dx, s[1] - t * dy, s[2] - t * dz);
        if (e) return e;
      }
      return 0;
    };
    return prim;
  };

  // material ids
  const BODY = 1, SILVER = 2, CYAN = 3, GEM = 4, MOUTH = 5, TONGUE = 6, FANG = 7, HALO = 8;
  const MAT = { BODY, SILVER, CYAN, GEM, MOUTH, TONGUE, FANG, HALO };
  const PAL = Creature.palette({
    [BODY]:   { r: ['#0a1f45', '#113463', '#1b4f8a', '#2a6cad', '#5b9bd8'], od: '#06122e', ol: '#0e2b58', ln: '#0c2750' },
    [SILVER]: { r: ['#5e6d80', '#8797aa', '#b3c2d0', '#d6e2ec', '#ffffff'], od: '#38465a', ol: '#5c6d82', ln: '#667789' },
    [CYAN]:   { r: ['#0e9cc2', '#1bb8dc', '#3ad6f2', '#93eefc', '#e2fcff'], od: '#0a5f82', ol: '#0e7fa4', ln: '#0e7fa4' },
    [GEM]:    { r: ['#0b3c82', '#125fae', '#2a8de4', '#6ec8ff', '#ffffff'], od: '#082a5c', ol: '#0e4a90', ln: '#0c4282' },
    [HALO]:   { r: ['#3ad6f2', '#6ae4fa', '#9aeefe', '#c8f8ff', '#ffffff'], od: '#0e7fa4', ol: '#1bb8dc', ln: '#1bb8dc' },
    [MOUTH]:  { r: ['#4a1024', '#6a1a32', '#8c2a44', '#aa3c56', '#c85a6e'], od: '#2a0818', ol: '#4a1024', ln: '#3a0c1c' },
    [TONGUE]: { r: ['#b04a60', '#d05e74', '#ea7a8c', '#ff9eac', '#ffc4cc'], od: '#6a1a30', ol: '#8a2a40', ln: '#8a2a40' },
    [FANG]:   { r: ['#9aa8b8', '#c4d0dc', '#e8f0f6', '#ffffff', '#ffffff'], od: '#4a5a6e', ol: '#6a7a8e', ln: '#6a7a8e' },
  });
  const GLOSSY = { [BODY]: 1, [SILVER]: 1, [GEM]: 1 };
  const GEM_GLOW = ['#39b4ff', '#6fd4ff', '#a8ecff', '#dcfbff', '#ffffff'].map(PX.hex);

  /* ---------- 2D grid helpers ---------- */
  function grid(u0, v0, u1, v1, res, Type = Uint8Array, init = 0) {
    const gw = Math.ceil((u1 - u0) / res), gh = Math.ceil((v1 - v0) / res);
    const a = new Type(gw * gh);
    if (init) a.fill(init);
    return { u0, v0, res, gw, gh, a };
  }
  function at(g, u, v, def) {
    const x = Math.floor((u - g.u0) / g.res), y = Math.floor((v - g.v0) / g.res);
    return x < 0 || y < 0 || x >= g.gw || y >= g.gh ? def : g.a[y * g.gw + x];
  }
  function fill(g, poly, val) {
    const n = poly.length;
    for (let y = 0; y < g.gh; y++) {
      const vy = g.v0 + (y + 0.5) * g.res;
      const xs = [];
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const yi = poly[i][1], yj = poly[j][1];
        if (yi > vy !== yj > vy) xs.push(poly[i][0] + ((vy - yi) * (poly[j][0] - poly[i][0])) / (yj - yi));
      }
      xs.sort((p, q) => p - q);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const xa = Math.max(0, Math.ceil((xs[k] - g.u0) / g.res - 0.5));
        const xb = Math.min(g.gw - 1, Math.floor((xs[k + 1] - g.u0) / g.res - 0.5));
        for (let x = xa; x <= xb; x++) g.a[y * g.gw + x] = val;
      }
    }
  }
  function stroke(g, pts, maxD) {
    for (let k = 0; k < pts.length - 1; k++) {
      const [ax, ay] = pts[k], [bx, by] = pts[k + 1];
      const x0 = Math.max(0, Math.floor((Math.min(ax, bx) - maxD - g.u0) / g.res)), x1 = Math.min(g.gw - 1, Math.ceil((Math.max(ax, bx) + maxD - g.u0) / g.res));
      const y0 = Math.max(0, Math.floor((Math.min(ay, by) - maxD - g.v0) / g.res)), y1 = Math.min(g.gh - 1, Math.ceil((Math.max(ay, by) + maxD - g.v0) / g.res));
      for (let y = y0; y <= y1; y++)
        for (let x = x0; x <= x1; x++) {
          const d = Shape2D.segDist(g.u0 + (x + 0.5) * g.res, g.v0 + (y + 0.5) * g.res, ax, ay, bx, by);
          const i = y * g.gw + x;
          if (d < g.a[i]) g.a[i] = d;
        }
    }
  }
  const smooth = (pts, closed = false, seg = 6) => Shape2D.catmull(pts, closed, seg);
  const bevel = (g, u, v, dx, dy) => (!at(g, u + dx, v + dy, 0) ? 1 : !at(g, u - dx, v - dy, 0) ? -1 : 0);

  /* ---------- cyan lines (rest-pose side view, both sides) ---------- */
  const LINES = grid(-60, -5, 60, 110, 0.5, Float32Array, 99);
  // body flank swoosh

    openF: ['kk.', 'wrk', 'rrk', 'rdk', 'kk.'],
    happy: ['.kkk.', 'k...k', 'k...k'],
    happyN: ['.kk.', 'k..k', 'k..k'],
    happyF: ['.kk', 'k..', 'k..'],
    blink: ['.....', '.....', '.....', 'kkkkk', '.kkk.'],
    blinkN: ['....', '....', '....', 'kkkk', '.kk.'],
    blinkF: ['...', '...', '...', 'kkk', '.kk'],
    closed: ['k...k', '.kkk.'],
    closedN: ['k..k', '.kk.'],
    closedF: ['k..', '.kk'],
    angry: ['kk...', 'kkkk.', '.kkkk', 'kwrrk', 'krrdk', '.kkk.'],

/* ------------------------------------------------------------------

   Everything draws into a PX.Buf; static layers are baked once per

        const sw = sway * 0.05 + Math.sin(fr.ph + f * 0.52) * 0.025;
        const dx = Math.cos(fr.a + sw), dy = Math.sin(fr.a + sw);
        const N = 44;
        const pts = [];
        for (let k = 0; k <= N; k++) {
          const s = k / N;
          const d = fr.len * s;
          pts.push([ccx + dx * d, ccy + dy * d * 0.72 + fr.droop * fr.len * s * s * 0.75]);
        }
        for (let k = 1; k <= N; k++) {
          const s = k / N;
          const [x, y] = pts[k], [px0, py0] = pts[k - 1];
          const tx = x - px0, ty = y - py0, tl = Math.hypot(tx, ty) || 1;
          const ll = Math.sin(Math.PI * Math.min(1, s * 1.08)) * 10 + 2;
          for (const sd of [-1, 1]) {
            let lx = (-ty / tl) * sd - (tx / tl) * 0.7, ly = (tx / tl) * sd - (ty / tl) * 0.7 + 0.9;
            const ln = Math.hypot(lx, ly);
            lx /= ln; ly /= ln;
            const upper = ly < 0.1;
            const segs = Math.ceil(ll);
            for (let j = 0; j <= segs; j++) {
              const uu = j / segs;
              const X = Math.round(x + lx * ll * uu + (uu * uu * 1.5 * (sd * 0.2)));
              const Y = Math.round(y + ly * ll * uu + uu * uu * 2.2);
              let tone = upper ? (uu < 0.45 ? 3 : 2) : uu < 0.3 ? 2 : uu < 0.75 ? 1 : 0;
              if ((k & 1) && tone > 0 && !upper) tone -= 1;
              buf.set(X, Y, pal.leaf[tone]);
            }
          }
        }
        for (let k = 0; k < N; k++) buf.line(pts[k][0], pts[k][1] - 0.5, pts[k + 1][0], pts[k + 1][1] - 0.5, k < N * 0.7 ? pal.spine : pal.leaf[3]);
      }
      // coconuts
      for (const [ox, oy] of [[-3.5, 3], [2.5, 4], [-0.5, 6]]) {
        buf.ellipse(ccx + ox, ccy + oy, 2.8, 2.8, pal.nut[0]);
        buf.ellipse(ccx + ox - 0.6, ccy + oy - 0.7, 1.7, 1.7, pal.nut[1]);
        buf.set(Math.round(ccx + ox - 1.2), Math.round(ccy + oy - 1.4), pal.nut[2]);
      }
      if (outline) {
        const src = buf.d.slice();
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const i = y * w + x;
            if (src[i]) continue;
            const n = (x > 0 && src[i - 1]) || (x < w - 1 && src[i + 1]) || (y > 0 && src[i - w]) || (y < h - 1 && src[i + w]);
            if (n) buf.d[i] = pal.outline || pal.leaf[0];

      out.push(buf);
    }
    return out;
  }

  /* ---------- lighthouse on a headland ---------- */
  function headland(buf, o) {
    const { x, y, w, pal, seed = 11, lighthouse = true, lampOn = false } = o;
    const r = rng(seed);
    // rock silhouette: rounded hill with ledges
    const top = [];
    for (let i = 0; i <= w; i++) {
      const u = i / w;
      const hgt = Math.sin(Math.min(1, u * 1.25) * Math.PI) * 13 + fbm(i * 0.15, 0, seed, 3) * 5;
      top.push(Math.round(y - Math.max(0, hgt)));

    for (let i = 0; i <= w; i++) {
      const X = x + i;
      for (let Y = top[i]; Y < y; Y++) {
        const depth = Y - top[i];
        const n = hash2(X, Y, seed);
        let c = depth < 2 ? pal.grass[1] : depth < 3 ? pal.grass[0] : pal.rock[n > 0.8 ? 2 : Y > y - 3 ? 0 : 1];
        if (depth >= 3 && ((X + Y * 2) % 9 === 0)) c = pal.rock[0];
        buf.set(X, Y, c);
      }
    }
    if (!lighthouse) return null;
    const lx = x + Math.round(w * 0.46), ly = top[Math.round(w * 0.46)] + 1;
    const hgt = 22;
    for (let k = 0; k < hgt; k++) {
      const hw = lerp(3.4, 2.2, k / hgt);
      const Y = ly - k;
      const band = Math.floor(k / 5) % 2 === 1;
      for (let dx = -Math.ceil(hw); dx <= Math.ceil(hw); dx++) {
        if (Math.abs(dx) > hw) continue;
        const side = dx / hw;
        const base = band ? pal.stripe : pal.tower;
        buf.set(lx + dx, Y, side > 0.45 ? base[0] : side < -0.4 ? base[2] : base[1]);
      }

    // gallery + lantern
    const gy = ly - hgt;
    buf.hline(lx - 4, lx + 4, gy, pal.iron);
    for (let dx = -2; dx <= 2; dx++) for (let dy = 1; dy <= 3; dy++) buf.set(lx + dx, gy - dy, lampOn ? pal.lampOn[dy === 2 && Math.abs(dx) < 2 ? 1 : 0] : pal.glass);
    buf.hline(lx - 3, lx + 3, gy - 4, pal.iron);
    buf.hline(lx - 2, lx + 2, gy - 5, pal.roof);
    buf.set(lx, gy - 6, pal.roof);

  /* ---------- gull ---------- */
  function gull(buf, x, y, phase, col, colD) {

    buf.set(x, y, col);
    buf.set(x + 1, y, col);
    // wings
    buf.set(x - 1, y + lift * 0 - (lift < 0 ? 1 : 0), col);
    buf.set(x - 2, y - (lift < 0 ? 2 : lift > 0 ? -1 : 1), col);
    buf.set(x - 3, y - (lift < 0 ? 2 : lift > 0 ? -1 : 1), colD);
    buf.set(x + 2, y - (lift < 0 ? 1 : 0), col);
    buf.set(x + 3, y - (lift < 0 ? 2 : lift > 0 ? -1 : 1), col);
    buf.set(x + 4, y - (lift < 0 ? 2 : lift > 0 ? -1 : 1), colD);
  }

  /* ---------- particles ---------- */
  class Particles {
    constructor() { this.list = []; }
    add(p) { this.list.push(Object.assign({ age: 0, life: 1, vx: 0, vy: 0, g: 0 }, p)); }
    update(dt) {
      const out = [];
      for (const p of this.list) {
        p.age += dt;
        if (p.age >= p.life) { if (p.onDie) p.onDie(p); continue; }
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.floor !== undefined && p.vy > 0 && p.y >= p.floor) {
          if (p.onFloor) p.onFloor(p);

        if ((p.layer || 0) !== layer) continue;

          case 'drop': {
            const x = Math.round(p.x), y = Math.round(p.y);
            buf.set(x, y, p.c);
            if (p.size > 1) { buf.set(x, y - 1, p.c2 || p.c); if (p.size > 2) buf.set(x + 1, y, p.c2 || p.c); }
            break;
          }
          case 'ripple': {
            const rx = p.r0 + (p.r1 - p.r0) * (1 - (1 - k) * (1 - k));
            const ry = rx * (p.flat || 0.3);
            const fade = k;
            buf.ring(p.x, p.y, rx, ry, p.c, (x, y, a) => {
              if (p.test && !p.test(x, y)) return false;
              if (fade > 0.35 && bayer4(x, y) < (fade - 0.35) * 1.6) return false;
              if (Math.sin(a) < -0.2 && fade > 0.15) return (x + y) % 2 === 0; // far side fainter

            break;
          }
          case 'spark': {
            const tw = Math.sin(k * Math.PI);
            const s = Math.round(tw * p.size);
            if (s <= 0) buf.set(Math.round(p.x), Math.round(p.y), p.c2 || p.c);
            else star(buf, p.x, p.y, s, p.c, p.c2);

          }
          case 'crown': {
            const h = p.h * Math.pow(Math.sin(Math.min(1, k * 1.1) * Math.PI), 0.8);
            const w = p.w * (0.72 + k * 0.6);

            for (let dx = -wc; dx <= wc; dx++) {

              const th = Math.round(hx);
              const xx = Math.round(p.x + dx);
              for (let j = 0; j <= th; j++) {

          }
          case 'patch': {
            const rx = p.rx * (1 + k * 0.35), ry = p.ry * (1 + k * 0.35);

            for (let yy = y0; yy <= y1; yy++)

                const u = (xx + 0.5 - p.x) / rx, v = (yy + 0.5 - p.y) / ry;
                const d = u * u + v * v;
                if (d > 1) continue;
                if (p.test && !p.test(xx, yy)) continue;
                const nz = vnoise(xx * 0.55, yy * 1.1, p.seed);
                if (nz < 0.38 + k * 0.55 + d * 0.15) continue;
                buf.set(xx, yy, d > 0.6 ? p.c2 : p.c);
              }
            break;
          }
          case 'foam': {
            if (bayer4(Math.round(p.x), Math.round(p.y)) < k) break;
            buf.set(Math.round(p.x), Math.round(p.y), p.c);
            break;
          }
        }
      }
    }
  }

  return { vgrad, skyField, glow, makeCloud, makeGlints, drawGlints, star, makePalm, headland, gull, Particles, clamp, smooth, lerp, mixc };

/* ------------------------------------------------------------------
   Actors — Mudkip and the beach ball as living things on the canvas:
   springs for squash & secondary motion, sprite caching, shadows,
   reflections and splashes.
------------------------------------------------------------------- */
class Spring {
  constructor(k, c) { this.k = k; this.c = c; this.x = 0; this.v = 0; }
  kick(v) { this.v += v; return this; }
  step(dt, target = 0) {
    const n = Math.max(1, Math.ceil(dt / 0.008));
    const h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = -this.k * (this.x - target) - this.c * this.v;
      this.v += a * h;
      this.x += this.v * h;
    }
    return this.x;
  }
}

const Ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};

class MudkipActor {
  constructor(o) {
    this.x = o.x;
    this.gy = o.gy; // ground line (feet) in screen px
    this.h = 0; // height above ground
    this.yaw = o.yaw ?? 1.15;
    this.pitch = o.pitch ?? 0.16;
    this.scale = o.scale ?? 1;
    this.pal = o.pal;
    this.light = o.light;
    this.cache = new Map();
    this.sq = new Spring(300, 13);
    this.fin = new Spring(120, 6.5);
    this.tail = new Spring(80, 5);
    this.blinkAt = 1.5 + Math.random() * 2;
    this.blinkT = 0;
    this.pose = {};
    this.last = null;
    this.SW = Math.ceil((o.bw || 112) * this.scale);
    this.SH = Math.ceil((o.bh || 112) * this.scale);
    this.OX = Math.floor(this.SW / 2);
    this.OY = Math.floor(this.SH * (o.oy ?? 0.86));
  }
  // blink scheduler: returns true while eyes should be shut
  blink(t, dt) {
    if (this.blinkT > 0) {
      this.blinkT -= dt;
      return true;
    }
    if (t > this.blinkAt) {
      this.blinkT = 0.13;
      this.blinkAt = t + 2.2 + Math.random() * 2.8;
      return true;
    }
    return false;
  }
  sprite(pose) {
    const q = (v, s) => Math.round((v || 0) / s) * s;
    const P = {
      squash: q(pose.squash, 0.02), lean: q(pose.lean, 0.03), headPitch: q(pose.headPitch, 0.03),
      headYaw: q(pose.headYaw, 0.04), headRoll: q(pose.headRoll, 0.03), finSway: q(pose.finSway ?? 0.04, 0.03),
      finTwist: pose.finTwist ?? 0.32, tailLift: q(pose.tailLift, 0.04), tailWag: q(pose.tailWag, 0.05),
      tailTwist: pose.tailTwist ?? -0.85, legF: q(pose.legF, 0.08), legB: q(pose.legB, 0.08), legSplay: q(pose.legSplay, 0.06),
      mouth: q(pose.mouth ?? 0.6, 0.1), eyes: pose.eyes || 'open', gill: q(pose.gill, 0.04), look: q(pose.look, 0.05),
      bodyDip: q(pose.bodyDip, 0.5),
    };
    const yaw = q(this.yaw, 0.035);
    // fins are "cheated" toward the camera; mirror the cheat when Mudkip faces left
    const side = Math.max(-1, Math.min(1, Math.cos(yaw) * 3));
    P.finTwist = q((pose.finTwist ?? 0.32) * side, 0.04);
    P.tailTwist = q((pose.tailTwist ?? -0.85) * side, 0.04);
    const key = yaw + '|' + Object.values(P).join('|');
    let s = this.cache.get(key);
    if (!s) {
      s = Mudkip.render(Mudkip.build(P), {
        yaw, pitch: this.pitch, scale: this.scale, W: this.SW, H: this.SH, ox: this.OX, oy: this.OY, pal: this.pal, light: this.light,
      });
      this.cache.set(key, s);
      if (this.cache.size > 400) this.cache.delete(this.cache.keys().next().value);
    }
    this.last = s;
    return s;
  }
  // screen-space top-left of the sprite buffer
  origin() { return [Math.round(this.x) - this.OX, Math.round(this.gy - this.h) - this.OY]; }
  anchor(name) {
    const s = this.last;
    const [x0, y0] = this.origin();
    const a = s.anchors[name];
    return [x0 + a[0], y0 + a[1]];
  }
  // draw sprite; optional water line (screen y) below which pixels are tinted as submerged
  draw(fb, opts = {}) {
    const s = this.last;
    const [x0, y0] = this.origin();
    const { waterY = null, sub = null, subDeep = null } = opts;
    fb.blit(s.buf, x0, y0, {
      map: waterY === null ? null : (c, x, y) => {
        if (y < waterY) return c;
        if (subDeep && y > waterY + (opts.deepAfter ?? 3)) return subDeep(c);
        return sub(c);
      },
    });
  }
  // vertical mirror image into water pixels
  reflect(fb, axisY, t, opts) {
    const s = this.last;
    const [x0, y0] = this.origin();
    const { tint, test, gap = 0, fadeLen = 40, wobble = 1 } = opts;
    const W = s.buf.w, H = s.buf.h, d = s.buf.d;
    for (let sy = 0; sy < H; sy++) {
      const wy = y0 + sy; // world y of source row
      if (wy > axisY) continue;
      const ty = Math.round(2 * axisY - wy + gap);
      if (ty < 0 || ty >= fb.h) continue;
      const dist = ty - axisY;
      if (dist > fadeLen) continue;
      const off = Math.round(Math.sin(ty * 0.9 + t * 5.2) * wobble * (0.5 + dist / fadeLen));
      const fade = dist / fadeLen;
      // classic water reflection: solid near the surface, then alternating scanlines that thin out
      if (fade > 0.3 && (ty & 1)) continue;
      for (let sx = 0; sx < W; sx++) {
        const c = d[sy * W + sx];
        if (!c) continue;
        const tx = x0 + sx + off;
        if (tx < 0 || tx >= fb.w) continue;
        if (test && !test(tx, ty)) continue;
        if (fade > 0.55 && PX.bayer4(tx, ty) < (fade - 0.55) * 2) continue;
        fb.d[ty * fb.w + tx] = tint(c);
      }
    }
  }
}

class BallActor {
  constructor(o) {
    this.x = o.x; this.y = o.y; this.vx = 0; this.vy = 0;
    this.R = o.R ?? 12;
    this.rot = [1, 0, 0, 0, 1, 0, 0, 0, 1];
    this.axis = [0.3, 0.2, 1];
    this.w = 3;
    this.pal = o.pal;
    this.light = o.light;
    this.squashT = 0;
    this.sprite = null;
  }
  spin(dt) {
    this.rot = M3.mul(Ball.axisAngle(this.axis, this.w * dt), this.rot);
  }
  render() {
    let sx = 1, sy = 1;
    if (this.squashT > 0) {
      const k = Math.sin((this.squashT / 0.16) * Math.PI) * 0.16;
      sx = 1 + k; sy = 1 - k;
    }
    this.sprite = Ball.render({ R: this.R, rot: this.rot, light: this.light, sx, sy, pal: this.pal });
    return this.sprite;
  }
  draw(fb) {
    const s = this.sprite || this.render();
    fb.blit(s.buf, Math.round(this.x) - s.cx, Math.round(this.y) - s.cy);
  }
  reflect(fb, axisY, t, opts) {
    const s = this.sprite || this.render();
    const { tint, test, fadeLen = 40 } = opts;
    const x0 = Math.round(this.x) - s.cx, y0 = Math.round(this.y) - s.cy;
    const W = s.buf.w, H = s.buf.h;
    for (let sy = 0; sy < H; sy++) {
      const wy = y0 + sy;
      if (wy > axisY) continue;
      const ty = Math.round(2 * axisY - wy);
      const dist = ty - axisY;
      if (ty < 0 || ty >= fb.h || dist > fadeLen) continue;
      const off = Math.round(Math.sin(ty * 0.9 + t * 5.2) * (0.5 + dist / fadeLen));
      const fade = dist / fadeLen;
      if (fade > 0.3 && (ty & 1)) continue;
      for (let sx = 0; sx < W; sx++) {
        const c = s.buf.d[sy * W + sx];
        if (!c) continue;
        const tx = x0 + sx + off;
        if (tx < 0 || tx >= fb.w) continue;
        if (test && !test(tx, ty)) continue;
        if (fade > 0.55 && PX.bayer4(tx, ty) < (fade - 0.55) * 2) continue;
        fb.d[ty * fb.w + tx] = tint(c);
      }
    }
  }
}

// dithered elliptical shadow using a darkening colour map
function dropShadow(fb, cx, cy, rx, ry, dark, strength = 1, test = null) {
  const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx), y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      if (x < 0 || y < 0 || x >= fb.w || y >= fb.h) continue;
      const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry;
      const d = u * u + v * v;
      if (d > 1) continue;
      if (test && !test(x, y)) continue;
      const k = (d < 0.55 ? 1 : (1 - d) / 0.45) * strength;
      if (PX.bayer4(x, y) >= k) continue;
      const i = y * fb.w + x;
      fb.d[i] = dark(fb.d[i]);
    }
}

// Water splash: crown sheet, flung droplets, spray column, foam patch and expanding rings
function splash(parts, x, y, o = {}) {
  const n = o.n ?? 20, power = o.power ?? 1;
  const cDrop = o.c || PX.hex('#ffffff'), cDrop2 = o.c2 || PX.hex('#8fd6ee'), cRing = o.ring || PX.hex('#e8fbff');
  const test = o.test || null;
  const tiny = (p) => parts.add({ type: 'ripple', x: p.x, y: p.floor, r0: 0.5, r1: 2.5 + Math.random() * 2, flat: 0.4, life: 0.45, c: cRing, layer: 0, test });
  // flung droplets in every direction (perspective-flattened ring)
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
    const sp = (34 + Math.random() * 46) * power;
    const up = (80 + Math.random() * 100) * power;
    parts.add({
      type: 'drop', x: x + Math.cos(a) * 6, y: y + Math.sin(a) * 1.5 - 1, vx: Math.cos(a) * sp, vy: -up, g: 430,
      life: 2, c: cDrop, c2: cDrop2, size: Math.random() < 0.45 ? 2 : 1, layer: Math.sin(a) < -0.2 ? 0 : 1, floor: y + Math.sin(a) * 4 + 1, onFloor: tiny,
    });
  }
  // crown sheet: two tight fans rising from the rim of the impact
  const crown = Math.round((o.crown ?? 18) * power);
  for (let i = 0; i < crown; i++) {
    const side = i % 2 ? 1 : -1;
    const a = -Math.PI / 2 + side * (0.28 + Math.random() * 0.42);
    const sp = (120 + Math.random() * 80) * power;
    parts.add({
      type: 'drop', x: x + side * (5 + Math.random() * 7), y: y - 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 560,
      life: 2, c: cDrop, c2: cDrop2, size: 2, layer: 1, floor: y + 1 + Math.random() * 2, onFloor: tiny,
    });
  }
  // central spray column
  for (let i = 0; i < 7 * power; i++) {
    parts.add({
      type: 'drop', x: x + (Math.random() - 0.5) * 6, y: y - 2, vx: (Math.random() - 0.5) * 26, vy: -(130 + Math.random() * 90) * power, g: 470,
      life: 2, c: cDrop, c2: cDrop2, size: 2, layer: 1, floor: y + 1,
    });
  }
  parts.add({ type: 'crown', x, y: y + 1, w: 17 * power, h: 13 * power, life: 0.42, c: cDrop, c2: cDrop2, layer: 1, seed: Math.floor(Math.random() * 999) });
  parts.add({ type: 'patch', x, y: y + 1, rx: 15 * power, ry: 4.2 * power, life: 0.9, c: cDrop, c2: cRing, layer: 0, test, seed: Math.floor(Math.random() * 999) });
  parts.add({ type: 'ripple', x, y: y + 1, r0: 6, r1: 30 * power, flat: 0.32, life: 1.2, c: cRing, layer: 0, test });

/* ------------------------------------------------------------------
   Creature — generic "3D model straight to pixel art" renderer.
   A model is a list of primitives (analytic ellipsoids and flat plates
   with 2D outlines) posed in model space, plus optional eye stamps and
   single-pixel dots. Rendering ray-casts orthographically, toon-shades
   through per-material colour ramps, adds cast shadows, internal contour
   lines and a sel-out outer outline.
   Model space: x = forward, y = up, z = the creature's near side at yaw 0.

const M3 = {
  mul(a, b) {

      a[0] * b[0] + a[1] * b[3] + a[2] * b[6], a[0] * b[1] + a[1] * b[4] + a[2] * b[7], a[0] * b[2] + a[1] * b[5] + a[2] * b[8],
      a[3] * b[0] + a[4] * b[3] + a[5] * b[6], a[3] * b[1] + a[4] * b[4] + a[5] * b[7], a[3] * b[2] + a[4] * b[5] + a[5] * b[8],
      a[6] * b[0] + a[7] * b[3] + a[8] * b[6], a[6] * b[1] + a[7] * b[4] + a[8] * b[7], a[6] * b[2] + a[7] * b[5] + a[8] * b[8],
    ];
  },
  v(m, p) {
    return [m[0] * p[0] + m[1] * p[1] + m[2] * p[2], m[3] * p[0] + m[4] * p[1] + m[5] * p[2], m[6] * p[0] + m[7] * p[1] + m[8] * p[2]];
  },
  inv(m) {
    const [a, b, c, d, e, f, g, h, i] = m;
    const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
    const id = 1 / (a * A + b * B + c * C);
    return [
      A * id, -(b * i - c * h) * id, (b * f - c * e) * id,
      B * id, (a * i - c * g) * id, -(a * f - c * d) * id,
      C * id, -(a * h - b * g) * id, (a * e - b * d) * id,
    ];
  },
  rx(t) { const c = Math.cos(t), s = Math.sin(t); return [1, 0, 0, 0, c, -s, 0, s, c]; },
  ry(t) { const c = Math.cos(t), s = Math.sin(t); return [c, 0, s, 0, 1, 0, -s, 0, c]; },
  rz(t) { const c = Math.cos(t), s = Math.sin(t); return [c, -s, 0, s, c, 0, 0, 0, 1]; },
  diag(x, y, z) { return [x, 0, 0, 0, y, 0, 0, 0, z]; },
  I() { return [1, 0, 0, 0, 1, 0, 0, 0, 1]; },

  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],

/* ---------- 2D shape helpers for plates ---------- */
const Shape2D = {
  catmull(pts, closed = true, seg = 8) {
    const out = [], n = pts.length;
    const get = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
      for (let s = 0; s < seg; s++) {
        const t = s / seg, t2 = t * t, t3 = t2 * t;
        const f = (k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
        out.push([f(0), f(1)]);
      }
    }
    if (!closed) out.push(pts[n - 1]);
    return out;
  },
  inPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  },
  segDist(x, y, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((x - ax) * dx + (y - ay) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - ax - dx * t, y - ay - dy * t);
  },
  polyDist(x, y, pl) {
    let d = Infinity;
    for (let i = 0; i < pl.length - 1; i++) d = Math.min(d, Shape2D.segDist(x, y, pl[i][0], pl[i][1], pl[i + 1][0], pl[i + 1][1]));
    return d;
  },
  bbox(poly, pad = 0) {
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    for (const [x, y] of poly) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); }

  },
  inTri(px, py, a, b, c) {
    const s1 = (b[0] - a[0]) * (py - a[1]) - (b[1] - a[1]) * (px - a[0]);
    const s2 = (c[0] - b[0]) * (py - b[1]) - (c[1] - b[1]) * (px - b[0]);
    const s3 = (a[0] - c[0]) * (py - c[1]) - (a[1] - c[1]) * (px - c[0]);
    return (s1 >= 0 && s2 >= 0 && s3 >= 0) || (s1 <= 0 && s2 <= 0 && s3 <= 0);
  },
  // polygon shape from control points; `fn(u,v)` optionally returns a material code for inside points
  poly(ctrl, mat, seg = 8, fn = null) {
    const P = Shape2D.catmull(ctrl, true, seg);
    const bb = Shape2D.bbox(P, 0.5);
    return { bb, poly: P, test: (u, v) => (u < bb[0] || u > bb[2] || v < bb[1] || v > bb[3] || !Shape2D.inPoly(u, v, P) ? 0 : fn ? fn(u, v) : mat) };
  },
};

// Bake a 2D shape test into a lookup grid (0.25 unit cells) so per-pixel tests are O(1)
function bakeShape(shape, res = 0.25) {
  const [u0, v0, u1, v1] = shape.bb;
  const gw = Math.ceil((u1 - u0) / res), gh = Math.ceil((v1 - v0) / res);
  const g = new Uint8Array(gw * gh);
  for (let y = 0; y < gh; y++)
    for (let x = 0; x < gw; x++) g[y * gw + x] = shape.test(u0 + (x + 0.5) * res, v0 + (y + 0.5) * res);
  return {
    bb: shape.bb,
    test(u, v) {
      const x = Math.floor((u - u0) / res), y = Math.floor((v - v0) / res);
      if (x < 0 || y < 0 || x >= gw || y >= gh) return 0;
      return g[y * gw + x];
    },
  };
}

const Creature = (() => {
  const code = (m, bias = 0) => m | ((bias + 2) << 5);

  /* frames: { L: linear 3x3, t: translation } */
  const F = (L, t) => ({ L, t });
  const comp = (P, C) => ({ L: M3.mul(P.L, C.L), t: V3.add(M3.v(P.L, C.t), P.t) });

  const S = (x, y, z) => F(M3.diag(x, y, z), [0, 0, 0]);

  const onEll = (prim, s) => ({ p: V3.add(prim.c, M3.v(prim.L, s)), s, prim });

  const ell = (f, r, o) => Object.assign({ kind: 'ell', c: f.t, L: M3.mul(f.L, M3.diag(r[0], r[1], r[2])) }, o);

  const plate = (f, shape, o, axes = null) => Object.assign({ kind: 'plate', c: f.t, L: axes ? M3.mul(f.L, M3.cols(...axes)) : f.L, shape, thick: 1.6 }, o);

  /**
   * render(model, opt)
   * model: { prims, stamps?, dots?, anchors?, pri?, glossy?, shadow? }
   * opt:   { yaw, pitch, scale, W, H, ox, oy, pal, light }
   */
  function render(model, opt) {
    const { yaw = 1.05, pitch = 0.16, scale = 1, W = 96, H = 96, ox = 48, oy = 82, pal, light } = opt;
    const V = M3.mul(M3.rx(pitch), M3.mul(M3.ry(-yaw), M3.diag(scale, scale, scale)));
    const N = W * H;
    const depth = new Float32Array(N).fill(-1e9);
    const mat = new Uint8Array(N), part = new Uint8Array(N), grp = new Uint8Array(N), bias = new Int8Array(N);

    for (const p of model.prims) {
      p.cv = M3.v(V, p.c);

      p.Li = M3.inv(p.Lv);

      let x0, y0, x1, y1;

        const rx = Math.hypot(p.Lv[0], p.Lv[1], p.Lv[2]), ry = Math.hypot(p.Lv[3], p.Lv[4], p.Lv[5]);

        const [a, b, c, d] = p.shape.bb;
        x0 = y0 = Infinity; x1 = y1 = -Infinity;

          for (const w of [-p.thick, p.thick]) {
            const q = V3.add(cv, M3.v(p.Lv, [u, v, w]));
            x0 = Math.min(x0, ox + q[0]); x1 = Math.max(x1, ox + q[0]);
            y0 = Math.min(y0, oy - q[1]); y1 = Math.max(y1, oy - q[1]);
          }
        }
      }
      const px0 = Math.max(0, Math.floor(x0) - 1), px1 = Math.min(W - 1, Math.ceil(x1) + 1);
      const py0 = Math.max(0, Math.floor(y0) - 1), py1 = Math.min(H - 1, Math.ceil(y1) + 1);

          const Y = oy - (py + 0.5) - cv[1];
          for (let px = px0; px <= px1; px++) {
            const X = px + 0.5 - ox - cv[0];
            const s0x = Li[0] * X + Li[1] * Y + Li[2] * Z0;
            const s0y = Li[3] * X + Li[4] * Y + Li[5] * Z0;
            const s0z = Li[6] * X + Li[7] * Y + Li[8] * Z0;
            const b = 2 * (s0x * dx + s0y * dy + s0z * dz);
            const c = s0x * s0x + s0y * s0y + s0z * s0z - 1;

            if (disc < 0) continue;
            const t = (-b + Math.sqrt(disc)) / (2 * a);

            if (t <= depth[i]) continue;
            const s = [s0x + t * dx, s0y + t * dy, s0z + t * dz];

            let nx = Li[0] * s[0] + Li[3] * s[1] + Li[6] * s[2];
            let ny = Li[1] * s[0] + Li[4] * s[1] + Li[7] * s[2];
            let nz = Li[2] * s[0] + Li[5] * s[1] + Li[8] * s[2];

        for (let py = py0; py <= py1; py++) {
          const Y = oy - (py + 0.5) - cv[1];
          for (let px = px0; px <= px1; px++) {

            if (!edgeOn) {

              const v = Li[3] * X + Li[4] * Y + Li[5] * Zr;
              const m = p.shape.test(u, v);
              if (m) { hitZ = Zr + cv[2]; hitM = m; }
            } else {
              const half = p.thick / 2;
              const za = (-half - (r2x * X + r2y * Y)) / r2z, zb = (half - (r2x * X + r2y * Y)) / r2z;
              const zf = Math.max(za, zb), zk = Math.min(za, zb);

                const Zr = zf + ((zk - zf) * k) / (samples - 1);

                const v = Li[3] * X + Li[4] * Y + Li[5] * Zr;
                const m = p.shape.test(u, v);

            depth[i] = hitZ; mat[i] = hitM & 31; bias[i] = (hitM >> 5) - 2; part[i] = p.part; grp[i] = p.grp;

    }

    /* ---- screen-space cast shadows between parts ---- */
    const Lg = light || { dir: [-0.5, 0.72, 0.5] };
    const Ld = V3.norm(Lg.dir);
    const shadow = new Uint8Array(N);
    const steps = model.shadowSteps ?? 30;
    if (steps > 0) {
      const st = 1 / Math.max(Math.abs(Ld[0]), Math.abs(Ld[1]), 0.2);
      const zmax = (model.shadowDepth ?? 26) * scale;
      for (let y = 0; y < H; y++)

    /* ---- toon shading ---- */
    const Hh = V3.norm(V3.add(Ld, [0, 0, 1]));

    const tone = new Int8Array(N).fill(-1);
    const rimMask = new Uint8Array(N);
    for (let i = 0; i < N; i++) {

      if (!m) continue;

      }

    }

    /* ---- projected line decals ---- */
    const plotLine = (a, b, color, partId) => {
      let x0 = Math.floor(a[0]), y0 = Math.floor(a[1]);
      const x1 = Math.floor(b[0]), y1 = Math.floor(b[1]);
      const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;

    /* ---- stamps (eyes) ---- */
    const baseMat = new Uint8Array(N);
    for (const st of model.stamps || []) {
      const r = surf(st.at);
      if (!r.vis || r.n[2] < (st.minFacing ?? 0.12)) continue;
      const set = st.set;
      const kind = st.kind || 'open';
      let g = set[kind] || set.open;
      if (r.n[2] < (st.far ?? 0.5)) g = set[kind + 'F'] || set[kind] || set.open;
      else if (r.n[2] < (st.near ?? 0.78)) g = set[kind + 'N'] || set[kind] || set.open;

      const sh = g.length, sw = g[0].length;

      const x0 = r.xi - Math.floor(sw / 2), y0 = r.yi - Math.floor(sh / 2) + (st.dy || 0);
      for (let rr = 0; rr < sh; rr++)

          if (ch === '.') continue;
          const x = x0 + c, y = y0 + rr;

    for (const dt of model.dots || []) {
      const r = surf(dt.at);
      if (!r.vis || r.n[2] < (dt.minFacing ?? 0.35)) continue;
      const i = r.yi * W + r.xi;
      if (dt.onlyMat && mat[i] !== dt.onlyMat) continue;
      out[i] = dt.color !== undefined ? (typeof dt.color === 'string' ? PX.hex(dt.color) : dt.color) : pal[dt.mat].r[dt.tone ?? 0];
    }
    const mm = (i) => (mat[i] === 31 ? baseMat[i] || model.baseMat || 1 : mat[i]);

    /* ---- internal contour lines ---- */
    const PRI = model.pri || {};
    const lineCol = new Uint32Array(N);
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!grp[i]) continue;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1];
        for (const j of nb) {
          if (j < 0 || !grp[j] || grp[j] === grp[i]) continue;
          const m = mm(i);
          if (depth[j] > depth[i] + 1.2 * Math.max(1, scale * 0.8)) { lineCol[i] = pal[m].ln; break; }
          if (depth[j] >= depth[i] - 1.2 && (PRI[grp[i]] || 0) > (PRI[grp[j]] || 0)) { lineCol[i] = pal[m].ln; break; }
        }
      }
    for (let i = 0; i < N; i++) if (lineCol[i] && mat[i] !== 31) out[i] = lineCol[i];

    /* ---- outer outline (1px, sel-out) ---- */
    const final = new Uint32Array(N);
    final.set(out);
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (mat[i]) continue;
        let best = -1, bestTone = 9;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1];
        for (const j of nb) {
          if (j < 0 || !mat[j]) continue;
          const tj = tone[j] < 0 ? 2 : tone[j];
          if (best < 0 || depth[j] > depth[best]) { best = j; bestTone = tj; }
        }
        if (best < 0) continue;
        const m = mm(best);
        const P2 = rimMask[best] && rim && rim.pal ? rim.pal : pal;
        final[i] = bestTone >= 3 ? (P2[m] || pal[m]).ol : (P2[m] || pal[m]).od;
        depth[i] = depth[best] - 0.01;
        part[i] = part[best];
      }

    const A = {};
    for (const k in model.anchors || {}) {
      const a = model.anchors[k];
      const p = a.p || a;
      const q = M3.v(V, p);
      A[k] = [ox + q[0], oy - q[1], q[2]];
    }
    const buf = new PX.Buf(W, H);
    buf.d = final;
    return { buf, depth, part, W, H, ox, oy, anchors: A };
  }

  // Grade every colour of a palette through fn(colour, toneIndex); outlines get -2/-1
  function grade(base, fn) {
    const out = {};
    for (const k in base) {
      const e = base[k];
      out[k] = { r: e.r.map((c, i) => fn(c, i)), od: fn(e.od, -2), ol: fn(e.ol, -1), ln: fn(e.ln, -1) };
    }
    return out;
  }
  // Palette from hex strings: { id: { r:[5], od, ol, ln } }
  function palette(def) {
    const out = {};
    for (const k in def) {
      const e = def[k];
      out[k] = { r: e.r.map(PX.hex), od: PX.hex(e.od), ol: PX.hex(e.ol), ln: PX.hex(e.ln || e.ol) };
    }
    return out;
  }
  // measure the silhouette box of a rendered sprite (for sizing checks)
  function bounds(sprite) {
    const { buf } = sprite;
    let x0 = buf.w, y0 = buf.h, x1 = -1, y1 = -1;
    for (let y = 0; y < buf.h; y++) for (let x = 0; x < buf.w; x++) if (buf.d[y * buf.w + x]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    return { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }

  return { render, code, grade, palette, bounds, F, comp, T, R, S, chain, onEll, sph, ell, plate };
})();

/* ==== src/mudkip.js ==== */
/* ------------------------------------------------------------------
   Mudkip — a posable 3D model rendered straight to pixel art.
   Orthographic ray casting against analytic ellipsoids and flat
   "plates" (fins, gills), toon-shaded into hand-picked colour ramps,
   then finished with sel-out outlines and hand-drawn eye stamps.
------------------------------------------------------------------- */
const Mudkip = (() => {
  // material ids
  const BODY = 1, BELLY = 2, JAW = 3, FIN = 4, FINEDGE = 5, TAIL = 6, GILL = 7, MOUTH = 8, TONGUE = 9;
  const MAT = { BODY, BELLY, JAW, FIN, FINEDGE, TAIL, GILL, MOUTH, TONGUE };
  const code = (m, bias = 0) => m | ((bias + 2) << 5);

  /* Base ("noon") palette. Each ramp: [deep, shadow, base, light, highlight], plus
     od = outline on the shadow side, ol = outline on the lit side, ln = internal line. */
  const H = PX.hex;
  const BASE_PAL = {
    [BODY]:    { r: [H('#2b6db5'), H('#3a92d8'), H('#56bcf0'), H('#8ad7fa'), H('#d4f5ff')], od: H('#15336b'), ol: H('#2560a8'), ln: H('#2356a0') },
    [FIN]:     { r: [H('#2b6db5'), H('#3a92d8'), H('#56bcf0'), H('#8ad7fa'), H('#d4f5ff')], od: H('#15336b'), ol: H('#2560a8'), ln: H('#2d6cb8') },
    [FINEDGE]: { r: [H('#6aa9dc'), H('#8cc8ee'), H('#afe1f8'), H('#d2f1ff'), H('#f0fbff')], od: H('#1d4d8e'), ol: H('#3f7fc0'), ln: H('#4f8fcc') },
    [TAIL]:    { r: [H('#6aa6d8'), H('#88c2ea'), H('#a8dbf6'), H('#c8ecfc'), H('#e6f8ff')], od: H('#1f5596'), ol: H('#3674b8'), ln: H('#5b98cc') },
    [BELLY]:   { r: [H('#6fa9d4'), H('#93c8e8'), H('#bfe5f7'), H('#def4fd'), H('#f6fdff')], od: H('#1d4d8e'), ol: H('#3a74b4'), ln: H('#5a92c6') },
    [JAW]:     { r: [H('#8fb2cc'), H('#b6d4e6'), H('#e3f3fa'), H('#f6fcff'), H('#ffffff')], od: H('#284f7e'), ol: H('#5f8db4'), ln: H('#7ba3c4') },
    [GILL]:    { r: [H('#b8461a'), H('#d96520'), H('#f28a2a'), H('#ffae45'), H('#ffd584')], od: H('#6a2010'), ol: H('#9b3514'), ln: H('#a8401a') },
    [MOUTH]:   { r: [H('#7a1f2c'), H('#9a2f3a'), H('#bb4450'), H('#d45a62'), H('#e87a7a')], od: H('#4a0e1c'), ol: H('#6e1a28'), ln: H('#6e1a28') },
    [TONGUE]:  { r: [H('#c8505a'), H('#e06a6c'), H('#f58c84'), H('#ffaea0'), H('#ffcfc2')], od: H('#6e1428'), ol: H('#8e2038'), ln: H('#b04450') },
  };
  const GLOSSY = { [BODY]: 1, [FIN]: 1, [GILL]: 1, [BELLY]: 0, [JAW]: 1, [TAIL]: 0, [FINEDGE]: 0 };

  /* ---------- shapes ---------- */
  const FIN_CTRL = [[8.6, -5], [9.6, 1], [9.8, 7], [9, 13], [7.2, 18.6], [4.4, 23.6], [1, 27.4], [-2.6, 29.2], [-5.6, 28.4], [-7.3, 25.2], [-7.9, 19.6], [-8.1, 13], [-8.5, 6], [-9.1, 0], [-9.6, -5]];
  const FIN_POLY = Shape2D.catmull(FIN_CTRL, true, 8);
  const FIN_BACK = Shape2D.catmull([[-2.6, 29.2], [-5.6, 28.4], [-7.3, 25.2], [-7.9, 19.6], [-8.1, 13], [-8.5, 6], [-9.1, 0]], false, 8);
  const FIN_BB = Shape2D.bbox(FIN_POLY, 0.5);
  const FIN_RIDGES = [
    Shape2D.catmull([[3.2, 4], [3.6, 10], [2.6, 16], [0.4, 21.5], [-2.2, 25.2]], false, 5),
    Shape2D.catmull([[-2.4, 4], [-2.4, 10], [-3, 16], [-4.2, 21], [-5, 24]], false, 5),
  ];
  const finShape = {
    bb: FIN_BB,
    test(u, v) {
      if (u < FIN_BB[0] || u > FIN_BB[2] || v < FIN_BB[1] || v > FIN_BB[3]) return 0;
      if (!Shape2D.inPoly(u, v, FIN_POLY)) return 0;
      const d = Shape2D.polyDist(u, v, FIN_BACK);
      if (d < 1.7 && v > 4) return code(FINEDGE);
      return code(FIN);
    },
  };

  const TAIL_CTRL = [[-1, -2.6], [6, -4.4], [12.5, -6.4], [18.5, -7.8], [23.2, -7.2], [26.4, -4.4], [27.6, -0.2], [26.8, 4.6], [23.8, 8.8], [19.2, 11.4], [13.4, 10.6], [7.4, 6.8], [2.4, 3.8], [-1, 2.6]];
  const TAIL_POLY = Shape2D.catmull(TAIL_CTRL, true, 8);
  const TAIL_BB = Shape2D.bbox(TAIL_POLY, 0.5);
  const tailShape = {
    bb: TAIL_BB,
    test(u, v) {
      if (u < TAIL_BB[0] || u > TAIL_BB[2] || v < TAIL_BB[1] || v > TAIL_BB[3]) return 0;
      return Shape2D.inPoly(u, v, TAIL_POLY) ? code(TAIL) : 0;
    },
  };
  const TAIL_VEINS = [
    Shape2D.catmull([[3, -0.6], [10, -2.2], [17, -3.6], [23.5, -4.2]], false, 5),
    Shape2D.catmull([[4, 1.4], [10, 3.6], [16, 6.2], [21, 8]], false, 5),
  ];

  // Gill: rounded cheek base with three pointed, faceted spikes (u = outward, v = up)
  const GILL_SPIKES = [
    { a: 1.02, len: 12.6, w: 3.5, bend: -0.12 },
    { a: 0.2, len: 13.4, w: 3.7, bend: -0.06 },
    { a: -0.66, len: 11.2, w: 3.4, bend: 0.1 },
  ].map((s) => {
    const r0 = 3;
    const a2 = s.a + s.bend;
    const ca = Math.cos(s.a), sa = Math.sin(s.a);
    return {
      tip: [Math.cos(a2) * s.len, Math.sin(a2) * s.len],
      b1: [ca * r0 - sa * s.w, sa * r0 + ca * s.w],
      b2: [ca * r0 + sa * s.w, sa * r0 - ca * s.w],
      root: [ca * r0, sa * r0],
      dir: [Math.cos(a2), Math.sin(a2)],
    };
  });
  const GILL_R = 5.6;
  const gillShape = {
    bb: [-7, -11, 14, 13.5],
    test(u, v) {
      for (const s of GILL_SPIKES) {
        if (Shape2D.inTri(u, v, s.tip, s.b1, s.b2)) {
          const cr = s.dir[0] * (v - s.root[1]) - s.dir[1] * (u - s.root[0]);
          return code(GILL, cr > 0.3 ? 1 : 0);
        }
      }
      const r2 = u * u + v * v;
      if (r2 < GILL_R * GILL_R) return code(GILL, r2 < 2.6 * 2.6 && u < 0.5 ? 0 : 0);
      return 0;
    },
  };

  const FIN_G = bakeShape(finShape), TAIL_G = bakeShape(tailShape), GILL_G = bakeShape(gillShape);

  /* ---------- frames ---------- */
  const F = (L, t) => ({ L, t });
  const comp = (P, C) => ({ L: M3.mul(P.L, C.L), t: V3.add(M3.v(P.L, C.t), P.t) });
  const T = (x, y, z) => F(M3.I(), [x, y, z]);
  const R = (m) => F(m, [0, 0, 0]);
  const chain = (...fs) => fs.reduce((a, b) => comp(a, b));

  const DEFAULT_POSE = {
    squash: 0, lean: 0, headPitch: 0, headYaw: 0, headRoll: 0,
    finSway: 0.04, finTwist: 0.32, tailLift: 0, tailWag: 0, tailTwist: -0.85,
    legF: 0, legB: 0, legSplay: 0, mouth: 0.6, eyes: 'open', gill: 0, look: 0,
    bodyDip: 0,
  };
  const HEAD_R = [14.6, 14, 16.4];

  function build(pose) {
    const P = Object.assign({}, DEFAULT_POSE, pose);
    if (pose && pose.side !== undefined) { P.finTwist = 0.32 * pose.side; P.tailTwist = -0.85 * pose.side; }
    const prims = [];
    const sq = P.squash;
    const root = F(M3.diag(1 + sq * 0.55, 1 - sq, 1 + sq * 0.55), [0, 0, 0]);
    const body = chain(root, T(-6, 13 - P.bodyDip, 0), R(M3.rz(P.lean)));

    // --- body
    prims.push({
      kind: 'ell', part: 1, grp: 1, c: body.t, L: M3.mul(body.L, M3.diag(14.5, 9.6, 10.2)),
      mat: (s) => (s[1] < -0.34 + 0.3 * Math.max(0, s[0]) ? code(BELLY) : code(BODY)),
    });

    // --- legs (front/back, near/far): stubby cylinders-ish with a paw
    const legs = [
      { hip: [7.6, -4.5, 7.4], sw: P.legF, id: 2 },
      { hip: [7.6, -4.5, -7.4], sw: -P.legF, id: 3 },
      { hip: [-8.4, -4.5, 7.1], sw: P.legB, id: 4 },
      { hip: [-8.4, -4.5, -7.1], sw: -P.legB, id: 5 },
    ];
    for (const lg of legs) {
      const side = Math.sign(lg.hip[2]);
      const f = chain(body, T(...lg.hip), R(M3.rz(lg.sw)), R(M3.rx(-side * P.legSplay)));
      prims.push({ kind: 'ell', part: lg.id, grp: lg.id, c: V3.add(f.t, M3.v(f.L, [0, -3.2, 0])), L: M3.mul(f.L, M3.diag(3.4, 5.2, 3.2)), mat: () => code(BODY) });
      const paw = { kind: 'ell', part: lg.id, grp: lg.id, c: V3.add(f.t, M3.v(f.L, [1.0, -6.8, 0])), L: M3.mul(f.L, M3.diag(3.9, 2.3, 3.5)), mat: () => code(BODY) };
      paw.lines = [-0.3, 0.3].map((w) => ({ pts: [[0.9 * Math.sqrt(1 - w * w), -0.05, w], [0.8 * Math.sqrt(1 - w * w), -0.55, w]], tone: 1, mat: BODY }));
      prims.push(paw);
    }

    // --- tail fin
    const tail = chain(body, T(-12.5, 3.2, 0), R(M3.rz(-(0.86 + P.tailLift))), R(M3.ry(P.tailWag)), R(M3.rx(P.tailTwist)));
    prims.push({
      kind: 'plate', part: 6, grp: 6, c: tail.t, L: M3.mul(tail.L, M3.cols([-1, 0, 0], [0, 1, 0], [0, 0, -1])),
      shape: TAIL_G, thick: 1.6,
      lines: TAIL_VEINS.map((pl) => ({ pts: pl.map(([u, v]) => [u, v, 0]), tone: 1, mat: TAIL, useLn: true })),
    });

    // --- head
    const head = chain(body, T(8, 4.4, 0), R(M3.rz(P.headPitch)), R(M3.ry(P.headYaw)), R(M3.rx(P.headRoll)), T(3.4, 10.4, 0));
    const open = P.mouth;
    const headMat = (s) => {
      const az = Math.atan2(s[2], s[0]), v = s[1], a = Math.abs(az);
      if (a < 1.3) {
        const k = az / 1.16;
        const vm = -0.4 + 0.25 * k * k;
        const h = open * 0.3 * Math.max(0, 1 - (az / 1.1) ** 2);
        if (h > 0.03 && v < vm && v > vm - h) return v < vm - h * 0.55 && a < 0.85 ? code(TONGUE) : code(MOUTH);
        const chin = 0.2 * Math.max(0, 1 - k * k) + 0.06;
        if (v <= vm - h && v > vm - h - chin) return code(JAW);
        if (v <= vm - h - chin) return code(BELLY);
      }
      return code(BODY);
    };
    const headPrim = { kind: 'ell', part: 7, grp: 7, c: head.t, L: M3.mul(head.L, M3.diag(...HEAD_R)), mat: headMat };
    prims.push(headPrim);

    // --- head fin
    const fin = chain(head, T(-1, 10.5, 0), R(M3.rz(P.finSway)), R(M3.ry(P.finTwist)));
    prims.push({
      kind: 'plate', part: 8, grp: 8, c: fin.t, L: fin.L, shape: FIN_G, thick: 1.8,
      lines: FIN_RIDGES.map((pl) => ({ pts: pl.map(([u, v]) => [u, v, 0]), tone: 1, mat: FIN, useLn: true })),
    });

    // --- gills (frontal plates on the cheeks at the mouth corners)
    for (const side of [1, -1]) {
      const az = 1.22, v = -0.22;
      const cv = Math.sqrt(1 - v * v);
      const pos = [HEAD_R[0] * cv * Math.cos(az) * 1.0, HEAD_R[1] * v, side * HEAD_R[2] * cv * Math.sin(az) * 1.0];
      const o = V3.norm([-0.3, 0.08, side]);
      const n0 = V3.norm([1, 0, side * 0.42]);
      const up = V3.norm(V3.cross(n0, o));
      const upF = up[1] < 0 ? V3.scale(up, -1) : up;
      const w = V3.cross(o, upF);
      const g = chain(head, T(...pos));
      prims.push({
        kind: 'plate', part: side > 0 ? 9 : 10, grp: side > 0 ? 9 : 10, c: g.t,
        L: M3.mul(g.L, M3.mul(M3.cols(o, upF, w), M3.rz(P.gill))), shape: GILL_G, thick: 1.4,
      });
    }

    // --- anchors (model space)
    const onHead = (az, v) => {
      const cv = Math.sqrt(1 - v * v);
      const s = [cv * Math.cos(az), v, cv * Math.sin(az)];
      return { p: V3.add(head.t, M3.v(headPrim.L, s)), s };
    };
    const look = P.look;
    const anchors = {
      eyeN: onHead(0.5 + look, -0.06),
      eyeF: onHead(-0.5 + look, -0.06),
      nosN: onHead(0.13, -0.27),
      nosF: onHead(-0.13, -0.27),
      mouth: onHead(0, -0.42),
      headTop: V3.add(head.t, M3.v(head.L, [0, HEAD_R[1], 0])),
      finTip: V3.add(fin.t, M3.v(fin.L, [-2.6, 29, 0])),
      head: head.t,
      body: body.t,
    };
    return {
      prims, anchors, pose: P, headPrim,
      stamps: [
        { at: Object.assign({ prim: headPrim }, anchors.eyeN), set: EYES_S, colors: EYEC, kind: P.eyes },
        { at: Object.assign({ prim: headPrim }, anchors.eyeF), set: EYES_S, colors: EYEC, kind: P.eyes },
      ],
      dots: P.noNostrils ? [] : [
        { at: Object.assign({ prim: headPrim }, anchors.nosN), mat: BODY, tone: 0, onlyMat: BODY },
        { at: Object.assign({ prim: headPrim }, anchors.nosF), mat: BODY, tone: 0, onlyMat: BODY },
      ],
      pri: { 1: 0, 2: 1, 3: 1, 4: 1, 5: 1, 6: 2, 7: 1, 8: 2, 9: 3, 10: 3 },
      glossy: GLOSSY,
      baseMat: BODY,
    };
  }

  /* ---------- eye stamps ---------- */
  // k = black, w = white, b = deep-blue glint, '.' = skip
  const EYES_S = {
    open: ['.kk.', 'kwwk', 'kwkk', 'kkkk', 'kkbk', '.kk.'],
    openN: ['.k.', 'kwk', 'kwk', 'kkk', 'kkk', '.k.'],
    openF: ['kk', 'wk', 'kk', 'kk', '.k'],
    happy: ['.kk.', 'k..k', 'k..k'],
    happyN: ['.k.', 'k.k', 'k.k'],
    happyF: ['.k', 'k.', 'k.'],
    blink: ['....', '....', 'kkkk', '.kk.'],
    blinkN: ['...', '...', 'kkk', '.k.'],
    blinkF: ['..', '..', 'kk', '.k'],
    sleep: ['k..k', '.kk.'],
    sleepN: ['k.k', '.k.'],
    sleepF: ['k.', '.k'],
  };
  const EYES_L = {
    open: ['.kkk.', 'kwwkk', 'kwwkk', 'kkkkk', 'kkkbk', 'kkbbk', '.kkk.'],
    openN: ['.kk.', 'kwwk', 'kwkk', 'kkkk', 'kkbk', 'kkbk', '.kk.'],
    openF: ['kk.', 'wkk', 'kkk', 'kkk', 'kbk', '.k.'],
    happy: ['.kkk.', 'k...k', 'k...k'],
    happyN: ['.kk.', 'k..k', 'k..k'],
    happyF: ['.kk', 'k..', 'k..'],
    blink: ['.....', '.....', '.....', 'kkkkk', '.kkk.'],
    blinkN: ['....', '....', '....', 'kkkk', '.kk.'],
    blinkF: ['...', '...', '...', 'kkk', '.kk'],
    sleep: ['k...k', '.kkk.'],
    sleepN: ['k..k', '.kk.'],
    sleepF: ['k..', '.kk'],
  };
  const EYES = EYES_S;

  /* ---------- renderer: shared Creature pipeline with Mudkip's eye stamps ---------- */
  const EYEC = { k: '#101826', w: '#ffffff', b: '#2e4a78' };
  function render(model, opt) {
    const set = (opt.scale || 1) >= 1.2 ? EYES_L : EYES_S;
    for (const st of model.stamps) st.set = set;
    return Creature.render(model, opt);
  }

  // Build a graded palette from BASE_PAL through a colour function
  function gradePalette(fn) {
    const out = {};
    for (const k in BASE_PAL) {
      const e = BASE_PAL[k];
      out[k] = { r: e.r.map((c, i) => fn(c, i)), od: fn(e.od, -2), ol: fn(e.ol, -1), ln: fn(e.ln, -1) };
    }
    return out;
  }

  return { build, render, BASE_PAL, PAL: BASE_PAL, gradePalette, MAT, EYES, meta: { heightM: 0.4, bw: 112, bh: 112, oy: 0.86 } };
})();

/* ==== src/ball.js ==== */
/* ------------------------------------------------------------------
   Beach ball — a true spinning sphere, shaded into pixel ramps.
   Six gores (red / white / yellow / white / blue / white) and white
   pole caps with a small valve, sel-out outline.
------------------------------------------------------------------- */
const Ball = (() => {
  const H = PX.hex;
  const BASE = {
    red: [H('#8e1c2c'), H('#c42f3a'), H('#ea4b42'), H('#ff7b64')],
    white: [H('#9faac2'), H('#c9d3e3'), H('#f1f4f7'), H('#ffffff')],
    yellow: [H('#b0701a'), H('#dca126'), H('#f7c93c'), H('#ffe486')],
    blue: [H('#1a3c94'), H('#285fc4'), H('#3b85ea'), H('#7cb8ff')],
    spec: H('#ffffff'),
    od: H('#2b2140'),
    ol: H('#58476e'),
  };
  const GORES = ['red', 'white', 'yellow', 'white', 'blue', 'white'];

  function grade(fn) {
    const o = {};
    for (const k of ['red', 'white', 'yellow', 'blue']) o[k] = BASE[k].map((c, i) => fn(c, i));
    o.spec = fn(BASE.spec, 4);
    o.od = fn(BASE.od, -2);
    o.ol = fn(BASE.ol, -1);
    return o;
  }

  // rotation helpers
  const axisAngle = (ax, a) => {
    const [x, y, z] = V3.norm(ax), c = Math.cos(a), s = Math.sin(a), t = 1 - c;
    return [t * x * x + c, t * x * y - s * z, t * x * z + s * y, t * x * y + s * z, t * y * y + c, t * y * z - s * x, t * x * z - s * y, t * y * z + s * x, t * z * z + c];
  };

  /**
   * render({R, rot, light:{dir,rim?}, sx, sy, pal}) -> {buf, cx, cy}
   * sx/sy squash the silhouette (impact), rot is a 3x3 (local->view).
   */
  function render(o) {
    const R = o.R, pal = o.pal || BASE;
    const sx = o.sx || 1, sy = o.sy || 1;
    const rw = Math.ceil(R * sx) + 2, rh = Math.ceil(R * sy) + 2;
    const W = rw * 2 + 1, Hh = rh * 2 + 1;
    const cx = rw + 0.5, cy = rh + 0.5;
    const buf = new PX.Buf(W, Hh);
    const Ld = V3.norm((o.light && o.light.dir) || [-0.5, 0.72, 0.5]);
    const Hv = V3.norm(V3.add(Ld, [0, 0, 1]));
    const rot = o.rot;
    const tone = new Int8Array(W * Hh).fill(-1);
    const rim = o.light && o.light.rim;
    for (let y = 0; y < Hh; y++)
      for (let x = 0; x < W; x++) {
        const u = (x + 0.5 - cx) / (R * sx), v = (y + 0.5 - cy) / (R * sy);
        const r2 = u * u + v * v;
        if (r2 > 1) continue;
        const nz = Math.sqrt(1 - r2);
        const n = [u, -v, nz];
        // local direction = rot^T n
        const lx = rot[0] * n[0] + rot[3] * n[1] + rot[6] * n[2];
        const ly = rot[1] * n[0] + rot[4] * n[1] + rot[7] * n[2];
        const lz = rot[2] * n[0] + rot[5] * n[1] + rot[8] * n[2];
        let key;
        if (Math.abs(ly) > 0.9) key = 'white';
        else {
          const lon = Math.atan2(lz, lx) + Math.PI;
          key = GORES[Math.floor((lon / (Math.PI * 2)) * 6) % 6];
        }
        const valve = ly > 0.975;
        const d = V3.dot(n, Ld);
        let t = d < -0.12 ? 0 : d < 0.32 ? 1 : d < 0.78 ? 2 : 3;
        if (rim) {
          const rr = (1 - nz) * Math.max(0, n[0] * rim.dir[0] + n[1] * rim.dir[1]);
          if (rr > rim.k) t = Math.max(t, 2) + 1;
        }
        t = Math.min(3, t);
        let c = pal[valve ? 'red' : key][t];
        if (V3.dot(n, Hv) > 0.972) c = pal.spec;
        const i = y * W + x;
        buf.d[i] = c;
        tone[i] = t;
      }
    // outline
    const src = buf.d.slice();
    for (let y = 0; y < Hh; y++)
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (src[i]) continue;
        let best = -1;
        if (x > 0 && src[i - 1]) best = Math.max(best, tone[i - 1]);
        if (x < W - 1 && src[i + 1]) best = Math.max(best, tone[i + 1]);
        if (y > 0 && src[i - W]) best = Math.max(best, tone[i - W]);
        if (y < Hh - 1 && src[i + W]) best = Math.max(best, tone[i + W]);
        if (best < 0) continue;
        buf.d[i] = best >= 3 ? pal.ol : pal.od;
      }
    return { buf, cx: rw, cy: rh };
  }

  return { render, grade, axisAngle, BASE };
})();

/* ==== src/beach.js ==== */
/* ------------------------------------------------------------------
   Beach — shared stage for every painting in the series: the same
   stretch of shore (lighthouse on the right headland) at a different
   hour. Bakes sky/sea/sand, then animates the swash every frame.
------------------------------------------------------------------- */
const Beach = (() => {
  const { hex, Buf, bayer4, bayer8, hash2, vnoise, fbm, rng } = PX;
  const { vgrad, glow, clamp, smooth, lerp, mixc } = Scenery;

  const H = (o) => {
    // recursively convert '#rrggbb' strings in palette objects to packed colours
    if (typeof o === 'string') return o[0] === '#' ? hex(o) : o;
    if (Array.isArray(o)) return o.map(H);
    if (o && typeof o === 'object') {
      const r = {};
      for (const k in o) r[k] = typeof o[k] === 'number' ? o[k] : H(o[k]);
      return r;
    }
    return o;
  };
  const stops = (arr) => arr.map(([t, c]) => [t, typeof c === 'string' ? hex(c) : c]);

  const SPRITES = {
    starfish: ['...d...', '..dld..', 'ddrlrdd', 'drlllrd', '.drlrd.', '.dr.rd.', 'dd...dd'],
    shell: ['.dddd.', 'dlrlrd', 'dlrlrd', '.drrd.', '..dd..'],
    pebble: ['.dd.', 'dlrd', 'drrd', '.dd.'],
    conch: ['..dd..', '.dlld.', 'dlrrld', 'drrrrd', '.drrd.', '..dd..'],
  };
  function stamp(buf, spr, x, y, cols) {
    for (let r = 0; r < spr.length; r++)
      for (let c = 0; c < spr[r].length; c++) {
        const ch = spr[r][c];
        if (ch === '.') continue;
        buf.set(x + c, y + r, cols[ch]);
      }
  }

  function create(cfg) {
    const W = cfg.W, Hh = cfg.H, hz = cfg.hz;
    const pal = cfg.pal;
    const seed = cfg.seed || 7;
    const bg = new Buf(W, Hh);

    // --- sky + sea gradients
    if (cfg.sun) Scenery.skyField(bg, 0, hz, stops(pal.sky), cfg.sun, cfg.skyBand ?? 0.3);
    else vgrad(bg, 0, hz, stops(pal.sky), cfg.skyBand ?? 0.34);
    vgrad(bg, hz, Hh, stops(pal.sea), cfg.seaBand ?? 0.4);
    if (pal.horizon) bg.hline(0, W - 1, hz, pal.horizon);

    // --- sand layers (baked once)
    const sandDry = new Buf(W, Hh), sandWet = new Buf(W, Hh);
    const sandTop = cfg.sandTop ?? hz + 20;
    for (let y = sandTop; y < Hh; y++)
      for (let x = 0; x < W; x++) {
        const persp = (y - hz) / (Hh - hz);
        const n = fbm(x * 0.04, y * (0.12 - persp * 0.05), seed, 3) + (bayer4(x, y) - 0.5) * 0.06;
        let t = n > 0.57 ? 3 : n > 0.43 ? 2 : 1;
        const hh = hash2(x, y, seed);
        if (hh > 0.972) t = 0;
        else if (hh > 0.95) t = Math.max(0, t - 1);
        else if (hh < 0.018) t = 3;
        const rp = Math.sin(x * 0.2 + y * (1.1 + persp * 0.5) + fbm(x * 0.03, y * 0.05, seed + 3) * 7);
        if (rp > 0.94 && t > 1) t -= 1;
        sandDry.d[y * W + x] = pal.sand[t];
        sandWet.d[y * W + x] = pal.sandWet[t];
      }
    // shells & starfish scattered on the dry sand (both layers so they show when wet)
    const props = cfg.props || [];
    for (const p of props) {
      const cols = { d: pal.prop[p.kind].d, l: pal.prop[p.kind].l, r: pal.prop[p.kind].r };
      stamp(sandDry, SPRITES[p.kind], p.x, p.y, cols);
      const wc = { d: pal.prop[p.kind].d, l: mixc(cols.l, pal.sandWet[1], 0.35), r: mixc(cols.r, pal.sandWet[1], 0.35) };
      stamp(sandWet, SPRITES[p.kind], p.x, p.y, wc);
    }

    // --- swash state
    const edge = new Float32Array(W), wet = new Float32Array(W), lace = new Float32Array(W);
    const mask = new Uint8Array(W * Hh);
    const wave = Object.assign({ period: 6.4, reach: 16, far: hz + 36, skew: 0.004, jitter: 1.4 }, cfg.wave || {});
    const shore = cfg.shore;
    const baseMin = (() => { let m = Infinity; for (let x = 0; x < W; x++) m = Math.min(m, shore(x)); return m; })();
    let waveInfo = new Array(W);
    let time = 0;
    for (let x = 0; x < W; x++) { edge[x] = shore(x); wet[x] = shore(x); }

    function phaseAt(t, x) {
      const u = (t - x * wave.skew) / wave.period;
      return { p: u - Math.floor(u), cyc: Math.floor(u) };
    }
    function update(t, dt) {
      time = t;
      for (let x = 0; x < W; x++) {
        const { p, cyc } = phaseAt(t, x);
        const base = shore(x);
        const big = 0.8 + 0.35 * hash2(cyc, 3, seed); // wave-to-wave variety
        const R = wave.reach * big * (1 + 0.18 * Math.sin(x * 0.021 + cyc * 1.7));
        let reach, br = null;
        if (p < 0.38) {
          const k = p / 0.38;
          reach = R * 0.0;
          br = lerp(wave.far, base - 2, k * k);
        } else if (p < 0.56) reach = R * Ease.outCubic((p - 0.38) / 0.18);
        else reach = R * (1 - Ease.inOut((p - 0.56) / 0.44));
        reach += Math.sin(x * 0.09 + t * 0.9) * wave.jitter * 0.5 + Math.sin(x * 0.031 - t * 0.4) * wave.jitter * 0.5;
        const e = base + Math.max(-1.5, reach);
        edge[x] = e;
        wet[x] = Math.max(wet[x] - dt * (wave.dry ?? 2.6), e);
        waveInfo[x] = { p, br, cyc, R };
      }
    }

    function causticAt(x, y, t) {
      const a = vnoise(x * 0.12 + t * 0.32, y * 0.34 - t * 0.22, seed);
      const b = vnoise(x * 0.1 - t * 0.27, y * 0.3 + t * 0.19, seed + 9);
      return Math.abs(a - b) < 0.034;
    }

    // Draw the shallows, swash, foam and sand. `fb` already holds bg.
    function drawShore(fb, t, opts = {}) {
      const glowFoam = opts.glowFoam || null;
      const yTop = Math.max(hz + 1, Math.floor(baseMin - 34));
      mask.fill(0, 0, yTop * W);
      for (let x = 0; x < W; x++) {
        const e = edge[x], wv = wet[x];
        const inf = waveInfo[x];
        for (let y = yTop; y < Hh; y++) {
          const i = y * W + x;
          if (y >= e) {
            mask[i] = 0;
            if (y < wv) {
              let c = sandWet.d[i];
              // sky sheen streaks on the freshly wet sand
              const dd = wv - y;
              if (dd > 1 && hash2(x >> 2, y, seed + 5) > 0.9 && pal.sheen) c = pal.sheen;
              fb.d[i] = c;
            } else fb.d[i] = sandDry.d[i];
            continue;
          }
          const depth = e - y;
          mask[i] = 1;
          if (depth > 34) continue;
          // fade from the open-sea colour into the shallow ramp
          if (depth > 22 && bayer8(x, y) < (depth - 22) / 12) continue;
          const f = depth / 32 + (bayer8(x, y) - 0.5) * 0.12;
          const sh = pal.shallow;
          let idx = f < 0.08 ? 4 : f < 0.2 ? 3 : f < 0.42 ? 2 : f < 0.72 ? 1 : 0;
          let c = sh[idx];
          if (depth < 6) c = mixc(sandWet.d[i] || sh[4], sh[Math.min(4, idx)], 0.58);
          if (depth > 2 && depth < 26 && pal.caustic && causticAt(x, y, t)) c = depth < 12 ? pal.caustic : mixc(pal.caustic, sh[1], 0.45);
          fb.d[i] = c;
        }
      }
      // incoming breaker lines
      for (let x = 0; x < W; x++) {
        const inf = waveInfo[x];
        if (inf.br === null) continue;
        const k = inf.p / 0.38;
        const y = Math.round(inf.br);
        const gap = hash2(x >> 1, inf.cyc, seed) < 0.12 + (1 - k) * 0.35;
        const th = k < 0.35 ? 1 : k < 0.75 ? 2 : 3;
        if (!gap) {
          for (let j = 0; j < th; j++) fb.set(x, y - j, j === th - 1 ? (glowFoam ? glowFoam[0] : pal.foam[0]) : glowFoam ? glowFoam[1] : pal.foam[1]);
        }
        // wave face under the crest
        for (let j = 1; j <= 1 + Math.round(k * 2); j++) {
          const ii = (y + j) * W + x;
          if (y + j < Hh && mask[ii]) fb.d[ii] = mixc(fb.d[ii], pal.face || pal.shallow[0], 0.45);
        }
      }
      // swash foam: leading edge + dissolving lace
      for (let x = 0; x < W; x++) {
        const inf = waveInfo[x];
        const e = edge[x];
        const ey = Math.floor(e);
        const rushing = inf.p >= 0.38 && inf.p < 0.62;
        const th = rushing ? 3 + Math.round(hash2(x, inf.cyc, seed + 1) * 2) : 1 + Math.round(hash2(x >> 1, inf.cyc, seed + 2) * 1.4);
        const F = glowFoam || pal.foam;
        for (let j = 1; j <= th; j++) {
          const y = ey - j + 1;
          if (y < 0 || y >= Hh) continue;
          if (j === th && hash2(x, y, seed + 3) < 0.4) continue;
          fb.d[y * W + x] = j === 1 ? F[0] : j < th ? F[0] : F[1];
        }
        if (ey + 1 < Hh && hash2(x, 1, seed) < 0.7) fb.set(x, ey + 1, F[2]);
        // lace: foam netting in the thin sheet behind the edge while it recedes
        if (inf.p > 0.5) {
          const fade = (inf.p - 0.5) / 0.5;
          for (let j = 2; j < 13; j++) {
            const y = ey - j;
            if (y < 0) continue;
            const n = vnoise(x * 0.35, (y - e) * 0.7 + inf.cyc * 13.7, seed + 4);
            const n2 = vnoise(x * 0.18 + 5, (y - e) * 0.36 + inf.cyc * 7.1, seed + 8);
            if (Math.abs(n - n2) < 0.07 - fade * 0.05 - j * 0.002) fb.d[y * W + x] = j < 6 ? F[1] : F[2];
          }
        }
        // wrack line: bubbly line left at the high-water mark
        const wy = Math.floor(wet[x]);
        if (wy > ey + 2 && wy < Hh && hash2(x, wy, seed + 6) < 0.34) fb.set(x, wy, F[2]);
      }
    }

    update(0, 0);
    const isWater = (x, y) => x >= 0 && y >= 0 && x < W && y < Hh && mask[y * W + x] === 1;
    return { bg, sandDry, sandWet, edge, wet, mask, update, drawShore, isWater, shore, waveInfo: () => waveInfo, stamp };
  }

  /* Light shafts: precomputed angle/falloff, animated band pattern (dithered lighten) */
  function makeRays(W, Hh, o) {
    const { x: ox, y: oy, a0, a1, reach, color, strength = 0.35, test } = o;
    const ang = new Float32Array(W * Hh), fall = new Float32Array(W * Hh);
    for (let y = 0; y < Hh; y++)
      for (let x = 0; x < W; x++) {
        const dx = x - ox, dy = y - oy;
        const a = Math.atan2(dy, dx);
        const d = Math.hypot(dx, dy);
        const i = y * W + x;
        ang[i] = (a - a0) / (a1 - a0);
        fall[i] = test && !test(x, y) ? 0 : Math.max(0, 1 - d / reach) * (a > a0 && a < a1 ? 1 : 0);
      }
    const LUT = new Float32Array(512);
    return function draw(fb, t) {
      for (let k = 0; k < 512; k++) {
        const u = k / 511;
        let v = 0;
        v += Math.max(0, Math.sin(u * 23 + t * 0.21)) ** 6;
        v += Math.max(0, Math.sin(u * 37 - t * 0.13 + 1.3)) ** 8 * 0.8;
        v += Math.max(0, Math.sin(u * 11 + t * 0.07 + 2.1)) ** 4 * 0.6;
        LUT[k] = v * Math.sin(Math.PI * u);
      }
      const d = fb.d;
      for (let i = 0; i < d.length; i++) {
        const f = fall[i];
        if (f <= 0) continue;
        const u = ang[i];
        if (u <= 0 || u >= 1) continue;
        const v = LUT[(u * 511) | 0] * f * strength;
        if (v <= 0.02) continue;
        const x = i % W, y = (i / W) | 0;
        if (bayer8(x, y) < v) d[i] = mixc(d[i], color, 0.22);
      }
    };
  }

  /* Corner vignette via a darkening map */
  function makeVignette(W, Hh, strength = 0.5, color = hex('#1a1030')) {
    const lvl = new Uint8Array(W * Hh);
    for (let y = 0; y < Hh; y++)
      for (let x = 0; x < W; x++) {
        const u = (x / W - 0.5) * 2, v = (y / Hh - 0.5) * 2;
        const d = Math.pow(Math.max(0, Math.hypot(u * 0.85, v) - 0.72) / 0.6, 1.6) * strength;
        lvl[y * W + x] = bayer8(x, y) < d ? (d > 0.8 && bayer4(x, y) < d - 0.6 ? 2 : 1) : 0;
      }
    return (fb) => {
      const d = fb.d;
      for (let i = 0; i < d.length; i++) if (lvl[i]) d[i] = mixc(d[i], color, lvl[i] === 2 ? 0.3 : 0.16);
    };
  }

  return { create, makeRays, makeVignette, H, stops, SPRITES, stamp };
})();
