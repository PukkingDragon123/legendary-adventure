})();

/* ==== src/game/friends.js ==== */
/* ------------------------------------------------------------------
   Friends — Spheal, Sealeo, Walrein, Corphish and Pelipper, with the
   little games they play with Mudkip and each other.
------------------------------------------------------------------- */
const Friends = (() => {
  const { clamp, lerp } = Scenery;
  const { Mon, Nuts, wait, until, rnd, pick, chance, gy, sy, wet, approach } = Life;
  const TAU = Math.PI * 2;
  const SP = {
    Spheal: typeof Spheal !== 'undefined' ? Spheal : null, Sealeo: typeof Sealeo !== 'undefined' ? Sealeo : null,
    Walrein: typeof Walrein !== 'undefined' ? Walrein : null, Corphish: typeof Corphish !== 'undefined' ? Corphish : null,
    Pelipper: typeof Pelipper !== 'undefined' ? Pelipper : null,
  };
  const sp = (name) => SP[name];
  const mudkip = () => Game.mudkip;

  function rockTop(r, x) {
    const col = clamp(Math.round(x - r.x0), 0, r.spr.w - 1);
    for (let y = 0; y < r.spr.h; y++) if (r.spr.get(col, y)) return r.y0 + y;
    return r.y0 + r.spr.h;
  }
  // arc velocity that lands at (tx, ty) after T seconds under gravity g
  const lob = (x, y, tx, ty, T, g = 560) => [(tx - x) / T, (ty - y - 0.5 * g * T * T) / T];

  /* ================================================================
     SPHEAL — rolls, claps, bounces the ball back to Mudkip
  ================================================================ */
  class SphealMon extends Mon {
    constructor(o) {
      super(sp('Spheal'), { kind: 'spheal', x: o.x, y: gy(o.x), yaw: Math.PI - 1.1, z: 2.2, scale: 0.5, qPose: 0.05, qFields: { roll: 0.2, clap: 0.2, mouth: 0.25, squash: 0.03 } });
      this.roll = 0; this.sq = new Spring(220, 10); this.happyT = 0; this.floatT = 0;
    }
    headPt() { return this.at('top', 0, -4); }
    holdPt() { return this.at('nose', 0, -8); }
    physics(dt, t) {
      if (this.mode === 'swim') {
        this.y = lerp(this.y, sy(this.x) + 54 + Math.sin(t * 2 + this.seed) * 2, Math.min(1, dt * 5));
        if (!wet(this.x, 40)) this.mode = 'land';
      } else {
        if (wet(this.x, 40)) { this.mode = 'swim'; FX.splashAt(this.x, sy(this.x), { power: 0.6 }); Game.sfx('splash', this.x, 0.6); }
        if (this.air > 0 || this.vair !== 0) {
          this.vair -= 900 * dt; this.air += this.vair * dt;
          if (this.air <= 0) { this.air = 0; if (this.vair < -120) { this.sq.kick(0.8); Game.sfx('pat', this.x, 0.5); } this.vair = 0; }
        }
        this.y = gy(this.x) - this.air;
      }
      this.x = clamp(this.x, 60, 1500);
    }
    animate(dt, t) {
      const P = {};
      P.roll = this.roll;
      P.squash = this.sq.step(dt) * 0.5 + Math.sin(t * 2.1 + this.seed) * 0.02;
      P.clap = 0; P.mouth = 0.25; P.headPitch = 0; P.tailWag = Math.sin(t * 3 + this.seed) * 0.4;
      P.eyes = this.blink(t, dt) ? 'blink' : 'open';
      if (this.happyT > 0) { this.happyT -= dt; P.eyes = 'happy'; P.mouth = 1; }
      if (this.sleeping) { P.eyes = 'closed'; P.mouth = 0; P.squash = Math.sin(t * 1.2) * 0.04; }
      Object.assign(P, this.o);
      this.pose = P;
    }
    *rollTo(tx, speed = 70) {
      tx = clamp(tx, 80, 1450);
      for (let g = 0; g < 3000; g++) {
        const dt = yield;
        const dx = tx - this.x;
        if (Math.abs(dx) < 3) break;
        const d = Math.sign(dx);
        this.turn(this.face(d, false), dt, 6);
        const step = d * Math.min(Math.abs(dx), speed * dt);
        this.x += step;
        this.roll += Math.abs(step) / 58;
        this.moving = speed;
      }
      // settle upright (nearest full turn)
      const target = Math.round(this.roll / TAU) * TAU;
      for (let g = 0; g < 200 && Math.abs(this.roll - target) > 0.02; g++) { const dt = yield; this.roll = approach(this.roll, target, dt * 4); }
      this.roll = target;
    }
    brain() { return this.life(); }
    *life() {
      yield* wait(rnd(0.5, 1.5));
      for (;;) {
        if (Game.hour() === 'night') { yield* this.sleep(); continue; }
        const r = Math.random();
        const m = mudkip();
        if (m && m.mode === 'land' && Math.abs(m.x - this.x) > 360 && r < 0.35) yield* this.rollTo(m.x + (m.x < this.x ? 200 : -200));
        else if (r < 0.55) yield* this.clapAbout();
        else if (r < 0.8) yield* this.rollTo(this.x + rnd(-260, 260));
        else if (r < 0.92) yield* this.floatTrip();
        else { let e = 0; const T = rnd(1.5, 3); while (e < T) { const dt = yield; e += dt; this.o.headPitch = Math.sin(e * 2) * 0.1; } }
        yield* wait(rnd(0.3, 1.2));
      }
    }
    *clapAbout() {
      yield* this.faceTo(mudkip() && mudkip().x < this.x ? -1 : 1);
      let e = 0, n = 0;
      const T = rnd(1.2, 2.4);
      while (e < T) {
        const dt = yield; e += dt;
        const c = Math.abs(Math.sin(e * 9));
        this.o.clap = c; this.o.eyes = 'happy'; this.o.mouth = 1;
        if (Math.floor(e * 9 / Math.PI) > n) { n++; Game.sfx('clap', this.x, 0.6); }
      }
      if (chance(0.5)) { Game.sfx('spheal', this.x, 0.8); FX.emote(pick(['note', 'music2', 'heart']), () => this.headPt()); }
    }
    *floatTrip() {
      yield* this.rollTo(World.shoreX + 150, 80);
      let e = 0;
      while (e < rnd(3, 5)) { const dt = yield; e += dt; this.o.eyes = 'happy'; this.o.mouth = 0.6; this.roll = Math.sin(e * 1.5) * 0.25; }
      this.roll = 0;
      yield* this.rollTo(World.shoreX - rnd(150, 300), 70);
    }
    *sleep() {
      yield* this.rollTo(clamp(this.x, 700, 1000), 50);
      this.sleeping = true;
      while (Game.hour() === 'night') yield;
      this.sleeping = false;
      this.happyT = 1;
    }
    onBall(b) {
      // bump it back toward Mudkip (or a friend) with the belly
      if (b.lastTouch === this && b.touchT < 0.5) return true;
      const m = mudkip();
      let tx = m && m.mode === 'land' && Math.abs(m.x - this.x) < 700 ? m.x + (m.x < this.x ? 20 : -20) : this.x + (chance(0.5) ? -1 : 1) * rnd(120, 220);
      tx = clamp(tx, 100, World.shoreX - 20);
      const [vx, vy] = lob(b.x, b.y, tx, gy(tx) - 50, 1.15);
      b.kick(vx, vy, this);
      this.sq.kick(0.7); this.happyT = 0.8;
      Game.sfx('boing', b.x, 0.9);
      if (chance(0.4)) Game.sfx('spheal', this.x, 0.7);
      FX.add({ type: 'burst', x: b.x, y: b.y + 4, r: 6, life: 0.2, layer: 3 });
      return true;
    }
    onPoke() {
      this.doTask((function* (s) {
        Game.sfx('spheal', s.x, 1); s.happyT = 1.4; s.sq.kick(0.9);
        FX.emote(pick(['heart', 'note', 'star']), () => s.headPt());
        s.vair = 200; s.air = 0.5;
        yield* until(() => s.air <= 0, 2);
        if (chance(0.6)) yield* s.rollTo(s.x + (chance(0.5) ? 1 : -1) * rnd(90, 160), 110);
        else yield* s.clapAbout();
      })(this), 2);
    }
    onBonk() { this.sq.kick(1); this.happyT = 0; FX.add({ type: 'dizzy', x: 0, y: 0, at: () => this.at('top', 0, -6), rx: 16, life: 1.6, layer: 3 }); this.doTask((function* (s) { let e = 0; while (e < 1.6) { const dt = yield; e += dt; s.o.eyes = 'dizzy'; s.o.mouth = 0.4; } })(this), 3); }
    greet() { this.happyT = 1.2; Game.sfx('spheal', this.x, 0.8); this.emote('heart'); }
    newHour(h) {
      if (h !== 'night') this.sleeping = false;
      if (h !== 'night' && this.mode === 'land') this.doTask((function* (s) { yield* wait(0.8); FX.emote('sparkle', () => s.headPt()); yield* s.clapAbout(); })(this), 2);
    }
  }

  /* ================================================================
     SEALEO — juggles things on its nose on the pier
  ================================================================ */
  class SealeoMon extends Mon {
    constructor(o) {
      super(sp('Sealeo'), { kind: 'sealeo', x: o.x, y: World.PIER.deck, yaw: Math.PI - 1.05, z: 1.6, scale: 0.55, qPose: 0.05, qFields: { headPitch: 0.06, clap: 0.2, flipper: 0.2, mouth: 0.25 } });
      this.item = null; this.happyT = 0; this.sq = new Spring(240, 11);
    }
    headPt() { return this.at('top', 0, -4); }
    holdPt(obj) {
      const n = this.at('nose');
      const r = obj && obj.R ? obj.R : 7;
      const wob = Math.sin(Game.t * 5) * 2;
      return [n[0] + wob, n[1] - r + 1];
    }
    physics(dt) { this.y = World.PIER.deck; this.x = clamp(this.x, World.PIER.x0 + 80, World.PIER.x1 - 60); }
    animate(dt, t) {
      const P = {};
      P.squash = this.sq.step(dt) * 0.5 + Math.sin(t * 1.8 + this.seed) * 0.015;
      P.headPitch = 0.05; P.headYaw = 0; P.mouth = 0.2; P.flipper = 0; P.clap = 0; P.tailWag = Math.sin(t * 2.2) * 0.3; P.lean = 0;
      P.eyes = this.blink(t, dt) ? 'blink' : 'open';
      if (this.item) { P.headPitch = 0.62 + Math.sin(t * 5) * 0.05; P.flipper = 0.4 + Math.sin(t * 3) * 0.2; P.eyes = 'happy'; }
      if (this.happyT > 0) { this.happyT -= dt; P.eyes = 'happy'; P.mouth = 1; }
      if (this.sleeping) { P.eyes = 'closed'; P.headPitch = -0.15; P.mouth = 0; }
      Object.assign(P, this.o);
      this.pose = P;
    }
    catchIt(obj) {
      if (this.item) return false;
      this.item = obj;
      if (obj.kind === 'ball') { obj.holder = this; obj.vx = obj.vy = 0; }
      else { obj.state = 'held'; obj.holder = this; }
      Game.sfx('boing', this.x, 0.7);
      this.doTask(this.juggle(), 3);
      return true;
    }
    *juggle() {
      this.happyT = 0.6;
      Game.sfx('bark', this.x, 0.7);
      let e = 0;
      const T = rnd(3.5, 6);
      while (e < T && this.item) {
        const dt = yield; e += dt;
        if (Math.random() < dt * 0.8) FX.floatIcon(pick(['note', 'music2']), this.x + rnd(-20, 20), this.y - 200);
      }
      if (!this.item) return;
      // flick it back to the beach (toward Mudkip if possible)
      const obj = this.item;
      this.item = null;
      const m = mudkip();
      const tx = m && m.mode === 'land' ? clamp(m.x, 500, World.shoreX - 40) : rnd(700, 1050);
      this.o.headPitch = 0.9;
      yield* wait(0.08);
      const p = this.holdPt(obj);
      const [vx, vy] = lob(p[0], p[1], tx, gy(tx) - 40, 1.6);
      if (obj.kind === 'ball') { obj.holder = null; obj.x = p[0]; obj.y = p[1]; obj.kick(vx, vy, this); }
      else { obj.holder = null; obj.state = 'fall'; obj.x = p[0]; obj.y = p[1]; obj.vx = vx; obj.vy = vy; }
      Game.sfx('boing', this.x, 0.8);
      this.happyT = 1;
      yield* this.clap(1.2);
    }
    *clap(T = 1.4) {
      let e = 0, n = 0;
      while (e < T) {
        const dt = yield; e += dt;
        this.o.clap = Math.abs(Math.sin(e * 8)); this.o.eyes = 'happy'; this.o.mouth = 0.8;
        if (Math.floor((e * 8) / Math.PI) > n) { n++; Game.sfx('clap', this.x, 0.5); }
      }
    }
    dropBall() { if (this.item && this.item.kind === 'ball') { this.item.holder = null; this.item = null; } }
    dropNut() { if (this.item && this.item.kind !== 'ball') { this.item.holder = null; this.item.state = 'fall'; this.item.vy = -80; this.item = null; } }
    brain() { return this.life(); }
    *life() {
      yield* wait(rnd(0.5, 2));
      for (;;) {
        if (Game.hour() === 'night') { this.sleeping = true; while (Game.hour() === 'night') yield; this.sleeping = false; }
        const r = Math.random();
        if (r < 0.3) yield* this.clap(rnd(1, 2));
        else if (r < 0.55) {
          // belly-scoot along the pier
          const tx = clamp(this.x + rnd(-200, 200), World.PIER.x0 + 80, World.PIER.x1 - 60);
          const d = Math.sign(tx - this.x);
          yield* this.faceTo(d, true);
          while (Math.abs(tx - this.x) > 3) {
            const dt = yield;
            this.x += d * Math.min(Math.abs(tx - this.x), 40 * dt);
            this.o.lean = 0.1; this.o.flipper = Math.abs(Math.sin(Game.t * 6)) * 0.6; this.moving = 40;
            this.o.squash = Math.abs(Math.sin(Game.t * 6)) * 0.05;
          }
        } else if (r < 0.75) {
          Game.sfx('bark', this.x, 0.7); this.happyT = 0.8;
          let e = 0; while (e < 1) { const dt = yield; e += dt; this.o.headPitch = 0.35; this.o.mouth = Math.abs(Math.sin(e * 10)); }
        } else {
          let e = 0; const T = rnd(1.5, 3); while (e < T) { const dt = yield; e += dt; this.o.headYaw = Math.sin(e * 1.4) * 0.4; }
        }
        yield* wait(rnd(0.5, 1.5));
      }
    }
    onBall(b) {
      const n = this.at('nose');
      if (!this.item && b.vy > 0 && b.y < n[1] && Math.abs(b.x - n[0]) < 26) return this.catchIt(b);
      return false;
    }
    catchNut(c) {
      if (this.item || this.sleeping || c.cracked) return false;

  /* ================================================================
     CORPHISH — sideways scuttler, coconut cracker, tail pincher

  class CorphishMon extends Mon {
    constructor(o) {

      this.underwater = !!o.under; this.min = o.min; this.max = o.max; this.angry = 0; this.happyT = 0; this.wantNut = null; this.sq = new Spring(260, 12);

    }
    animate(dt, t) {
      const P = {};
      if (this.moving) this.phase += dt * 12;
      P.walk = this.moving ? this.phase % TAU : 0;
      P.tilt = this.moving ? Math.sin(this.phase) * 0.08 : 0;

    }
    *scuttle(tx, speed = 45) {
      tx = clamp(tx, this.min, this.max);
      const d0 = Math.sign(tx - this.x);

    }
    brain() { return this.life(); }
    *life() {
      yield* wait(rnd(0.3, 1.5));
      for (;;) {
        const m = mudkip();
        const nut = this.wantNut && this.wantNut.state === 'ground' && !this.wantNut.cracked ? this.wantNut : (!this.underwater ? Nuts.near(this.x, 420, (c) => c.state === 'ground' && !c.cracked && c.x > this.min && c.x < this.max && (!c.claim || c.claim.kind === 'mudkip')) : null);
        if (nut) { yield* this.crackNut(nut); this.wantNut = null; continue; }
        const r = Math.random();
        if (!this.underwater && m && m.mode === 'land' && !m.sleeping && Math.abs(m.x - this.x) < 260 && r < 0.18 && !m.busy(2)) { yield* this.pinch(m); continue; }
        if (r < 0.55) yield* this.scuttle(this.x + rnd(-160, 160), rnd(35, 55));
        else if (r < 0.75) {
          let e = 0, n = 0;
          while (e < 1.2) { const dt = yield; e += dt; this.o.clawN = Math.abs(Math.sin(e * 9)); this.o.armN = 0.5; if (Math.floor(e * 9 / Math.PI) > n) { n++; Game.sfx('snip', this.x, 0.3); } }
        } else if (r < 0.85 && this.underwater) {

        } else yield* wait(rnd(0.8, 2));

    }

    onBall() { this.angry = 1.2; return false; }
    bubbleNear(x, y) { if (this.underwater && Math.hypot(x - this.x, y - this.y) < 120) { this.happyT = 0.8; } }

  /* ================================================================
     PELIPPER — flies, fishes, perches, carries things (and Mudkip)
  ================================================================ */
  class PelipperMon extends Mon {
    constructor(o) {
      super(sp('Pelipper'), { kind: 'pelipper', x: o.x, y: o.y, yaw: Math.PI - 1.0, scale: 0.65, z: 4, qPose: 0.05, qFields: { flap: 0.2, spread: 0.25, bill: 0.2, pitch: 0.1, feet: 0.34, pouch: 0.34 } });
      this.mode = 'perch'; this.layer = 'mid'; this.vx = 0; this.vy = 0; this.flapPh = 0; this.cargo = null; this.happyT = 0; this.perchX = o.x; this.perchY = o.y;
      this.shadow = false;
    }
    headPt() { return this.at('top', 0, -4); }
    holdPt(obj) {
      const p = this.at('pouch');
      return [p[0], p[1] + (obj && obj.kind === 'mudkip' ? 26 : obj && obj.R ? 2 : 0)];
    }
    physics(dt, t) {
      if (this.mode === 'fly') {
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.layer = 'top';
      } else if (this.mode === 'swim') {
        this.y = lerp(this.y, sy(this.x) + 40, Math.min(1, dt * 5)); this.layer = 'mid';
      } else this.layer = 'mid';
      if (this.cargo && this.cargo.kind === 'mudkip') { const p = this.holdPt(this.cargo); this.cargo.x = p[0]; this.cargo.y = p[1] + 30; }
    }
    animate(dt, t) {
      const P = {};
      const fly = this.mode === 'fly';
      const speed = Math.hypot(this.vx, this.vy);
      if (fly) {
        const glide = this.vy > 30 && speed > 60;
        this.flapPh += dt * (glide ? 2 : 8.5);
        P.spread = 1; P.flap = glide ? 0.25 + Math.sin(this.flapPh) * 0.1 : Math.sin(this.flapPh);
        P.pitch = clamp(-this.vy / 260, -0.9, 0.6); P.feet = 1;
        const want = this.vx >= 0 ? 0.5 : Math.PI - 0.5;
        if (Math.abs(this.vx) > 12) this.turn(want, dt, 3);
      } else {
        P.spread = 0; P.flap = 0; P.pitch = 0; P.feet = 0;
      }
      P.bill = 0.12; P.pouch = this.cargo ? (this.cargo.kind === 'mudkip' ? 1 : 0.6) : 0;
      P.eyes = this.blink(t, dt) ? 'blink' : 'open';
      if (this.happyT > 0) { this.happyT -= dt; P.eyes = 'happy'; }
      if (this.sleeping) { P.eyes = 'closed'; P.bill = 0.05; }
      Object.assign(P, this.o);
      this.pose = P;
    }
    // steer toward a point; resolves when close
    *flyTo(tx, ty, speed = 130, tol = 10) {
      this.mode = 'fly';
      for (let g = 0; g < 4000; g++) {
        const dt = yield;
        const target = typeof tx === 'function' ? tx() : [tx, ty];
        const dx = target[0] - this.x, dy = target[1] - this.y;
        const d = Math.hypot(dx, dy);
        if (d < tol) break;
        const sp2 = Math.min(speed, d * 2.2 + 20);
        const k = 1 - Math.exp(-dt * 2.4);

    *takeOff() {

      this.mode = 'fly'; this.vy = -90; this.vx = this.dir * 40;

    }
    *land(x, y) {

      this.mode = 'perch'; this.vx = this.vy = 0; this.x = x; this.y = y;

    }
    brain() { return this.life(); }
    *life() {

        const b = Game.ball, sealeo = Game.mons.find((m) => m.kind === 'sealeo');
        const walrein = Game.mons.find((m) => m.kind === 'walrein');
        const m = mudkip();
        const opts = [];
        if (b && !b.holder && b.rest > 1.5 && !wet(b.x, 6) && sealeo && !sealeo.item) opts.push([2.5, () => this.carryBall(b, sealeo)]);
        if (walrein && !walrein.sleeping) opts.push([1.8, () => this.carryNut(walrein)]);
        if (m && m.mode === 'land' && !m.busy(1) && !m.sleeping) opts.push([1.2, () => this.rideMudkip(m)]);
        opts.push([2, () => this.fish()]);
        opts.push([2, () => this.patrol()]);
        opts.push([1.2, () => this.perchAbout()]);
        let tot = opts.reduce((a, o) => a + o[0], 0), r = Math.random() * tot;
        for (const [w, f] of opts) { r -= w; if (r <= 0) { yield* f(); break; } }

    }
    *perchAbout() {

      const T = rnd(4, 8);
      while (e < T) {

        if (e > T * 0.6 && e < T * 0.6 + 0.8) { this.o.spread = 0.6; this.o.flap = Math.sin(e * 16) * 0.8; }

    }
    *patrol() {
      yield* this.takeOff();
      const n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) yield* this.flyTo(rnd(300, 2500), rnd(170, 360), 140, 30);
      if (chance(0.5)) Game.sfx('squawk', this.x, 0.6);
      yield* this.land(this.perchX, this.perchY);
    }
    *fish() {

      while (this.y < sy(this.x) - 10 && e < 3) { const dt = yield; e += dt; this.vy += 700 * dt; this.vx *= Math.pow(0.5, dt); this.o.spread = 0.3; this.o.pitch = -0.9; }
      FX.splashAt(this.x, sy(this.x), { power: 1.1 }); Game.sfx('splash', this.x, 1);
      this.mode = 'swim'; this.vx = this.vy = 0;
      yield* wait(0.4);
      e = 0;
      while (e < 1.8) { const dt = yield; e += dt; this.o.pouch = 1; this.o.bill = 0.3; this.o.eyes = 'happy'; }
      Game.sfx('gulp', this.x, 0.7);
      e = 0; while (e < 0.5) { const dt = yield; e += dt; this.o.pitch = 0.4; this.o.bill = 0; }
      this.happyT = 1;

    }
    *carryBall(b, sealeo) {
      yield* this.takeOff();

/* ------------------------------------------------------------------

  /* ================================================================

  const HEART = { cx: 2280, cy: 770, sx: 10.5, sy: 6.2 };

    fish: [], u: 0, scatterT: 0, kissT: 6, cx: HEART.cx, cy: HEART.cy,
    init(G) {

    scatterFrom(wx, wy) {

  /* ========================== Luvdisc Love Reef ========================== */
  function reef() {

    const floorY = (x) => 190 + Math.sin(x * 0.025) * 4 + Math.sin(x * 0.07 + 1) * 2;

        if (y > h1) c = mix(c, hex('#1e5c86'), 0.45);

    const rock = [hex('#2e5a74'), hex('#3f7890'), hex('#6aa2b4')];
    for (const [cx, rw] of [[30, 40], [320, 52], [180, 26]]) { const fy = floorY(cx); bg.ellipse(cx, Math.round(fy), rw, 14, rock[0]); bg.ellipse(cx - 3, Math.round(fy) - 3, rw - 4, 10, rock[1]); bg.ellipse(cx - 8, Math.round(fy) - 7, rw * 0.4, 4, rock[2]); }
    for (let i = 0; i < 16; i++) {
      const x = Math.round(hash2(i, 5) * W), fy = Math.round(floorY(x)) - 2, c = coral[i % 4], hgt = 8 + Math.round(hash2(i, 6) * 14);
      for (let k = 0; k < 4; k++) { const bx = x + (k - 1.5) * 3; bg.line(Math.round(bx), fy, Math.round(bx + (k - 1.5) * 2), fy - hgt + k * 2, c[0]); bg.ellipse(Math.round(bx + (k - 1.5) * 2), fy - hgt + k * 2, 2, 2, c[1]); bg.set(Math.round(bx + (k - 1.5) * 2) - 1, fy - hgt + k * 2 - 1, c[2]); }
    }
    const kelp = [[14, 0], [62, 1.3], [250, 2.1], [276, 0.7], [370, 1.7]].map(([x, ph]) => ({ x, ph, n: 28 + Math.floor(ph * 6) }));
    const kelpC = [hex('#1a4a30'), hex('#2e8a4a'), hex('#4ab860')], rayC = hex('#c8f4ff'), causC = hex('#fff6c8');
    const kip = mud(190, 120, { scale: 0.55, haze: 0.18, hazeC });
    const M = { x: 190, y: 120, tx: 200, ty: 110, loop: 0, happy: 0 };
    const fish = [];
    for (let i = 0; i < 6; i++) { const f = crit(Luvdisc, { kind: 'luvdisc', x: 250, y: 80, yaw: 0.3, scale: 0.26, qPose: 0.25, qYaw: 0.08, qFields: { wiggle: 0.25, tilt: 0.1, kiss: 0.5, blush: 0.5 }, haze: 0.12, hazeC }); f.i = i; f.kiss = 0; fish.push(f); }
    const ky = crit(Kyogre, { kind: 'kyogre', x: -200, y: 80, yaw: 0.25, scale: 0.18, qPose: 0.25, qYaw: 0.1, qFields: { tail: TAU / 8, fin: 0.25, glow: 0.5 }, haze: 0.5, hazeC });

    let U = 0, kyX = -220, kyGlow = 0;

        for (const f of fish) {
          const u = U + f.i * (TAU / 6);

  /* ========================== Pelipper Sky Ride ========================== */
  function sky() {
    const P = lit('dusk');
    const bg = new PX.Buf(W, H);
    const stops = ['#2a1a5a', '#5a2a7a', '#b04a7a', '#f07a5a', '#ffb45a', '#ffe0a0'].map(hex);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

      step(dt) {

        if (hv || hop > 0) { hv -= 500 * dt; hop = Math.max(0, hop + hv * dt); if (hop === 0) hv = 0; }

      },
      draw(fb) {

        fb.ellipse(sunX, sunY, 22, 22, hex('#ffe8a0')); fb.ellipse(sunX - 3, sunY - 3, 17, 17, hex('#fff6d0'));

        for (let a = -2.9; a < -0.3; a += 0.006) cols.forEach((c, j) => { const r = 150 - j * 3, x = Math.round(90 + Math.cos(a) * r), y = Math.round(190 + Math.sin(a) * r); if (x >= 0 && y >= 0 && x < W && y < H && bayer4(x, y) < 0.35) fb.d[y * W + x] = mix(fb.d[y * W + x], hex(c), 0.45); });

/* ==== src/game/gallery.js ==== */
/* ------------------------------------------------------------------
   Time Gallery — step through one of Dialga's portals into a galaxy
   where the cove's moments float as living paintings in gold frames.
   Poke a painting to fall back into the world at that time of day;
   poke empty space to go home. Also: the soft vignette that makes the
   world read like a framed picture.
------------------------------------------------------------------- */
const Gallery = (() => {
  const { hex, mix, hash2, fbm, bayer4 } = PX;
  const W0 = 384, H0 = 216;
  const PIECES = [
    { make: () => Paintings.dawn() }, { make: () => Paintings.noon() }, { make: () => Fun.party() }, { make: () => Fun.volley() }, { make: () => Paintings.surf() },
    { make: () => Fun.launch() }, { make: () => Fun.reef() }, { make: () => Fun.sky() }, { make: () => Paintings.dusk() }, { make: () => Paintings.night() },
  ];
  const SND = { boing: ['boing', 0.7], cry: ['mud', 0.9], jump: ['whoosh', 0.3], plip: ['plop', 0.5], splash: ['splash', 0.5], twinkle: ['twinkle', 0.6] };
  // run a scene step without letting it leave particles in the shared list
  const quiet = (fn) => { const n = FX.list.length; fn(); FX.list.length = n; };
  const S = { on: false, t: 0, in: 0, out: 0, target: null, flash: 0, rr: 0, bg: null, bgW: 0, bgH: 0, hover: -1 };
  const gold = [hex('#5a3a12'), hex('#a8701e'), hex('#e0a83a'), hex('#ffe08a'), hex('#fff6d0')];
  const glowC = hex('#8fdcff'), white = hex('#ffffff');

  function ensure() {
    for (const p of PIECES) {
      if (p.inst) continue;
      p.inst = p.make();
      quiet(() => { if (p.inst.warm) p.inst.warm(1.2); else p.inst.step(1 / 30); });
      p.buf = new PX.Buf(W0, H0);
      p.acc = 0;
      p.inst.draw(p.buf);
    }
  }
  function nebula(w, h) {
    const b = new PX.Buf(w, h);
    const c0 = hex('#05061a'), c1 = hex('#1a1050'), c2 = hex('#4a1e78'), c3 = hex('#b04a9a'), c4 = hex('#3a8ad8');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const n = fbm(x * 0.006, y * 0.009, 3, 5), m = fbm(x * 0.012 + 40, y * 0.012, 7, 4);
      const band = Math.exp(-(((y - h * 0.5) - (x - w * 0.5) * 0.35) ** 2) / (h * h * 0.06));
      let c = mix(c0, c1, Math.min(1, n * 1.2));
      const k = Math.max(0, n * band * 1.6 - 0.3);
      c = mix(c, c2, Math.min(1, k * 1.4));
      if (m > 0.62) c = mix(c, c3, Math.min(0.6, (m - 0.62) * 3 * band));
      if (m < 0.3) c = mix(c, c4, Math.min(0.35, (0.3 - m) * 2 * band));
      // posterise with a dither so it stays pixel art
      const q = bayer4(x, y) * 0.06;
      if (hash2(x, y) > 0.994 - q) c = mix(c, white, 0.8);
      b.d[y * w + x] = c;
    }
    return b;
  }
  function layout(w, h) {
    const cols = 5, gap = Math.max(8, Math.round(w * 0.025));
    const fw = Math.min(W0, Math.floor((w - gap * (cols + 1)) / cols)), s = fw / W0, fh = Math.round(H0 * s);
    const rowY = [Math.round(h * 0.33 - fh / 2), Math.round(h * 0.68 - fh / 2)];
    const out = [];
    for (let i = 0; i < PIECES.length; i++) {
      const row = i < cols ? 0 : 1, col = i % cols, total = cols * fw + (cols - 1) * gap;
      out.push({ x: Math.round((w - total) / 2 + col * (fw + gap)), y: rowY[row], w: fw, h: fh, s });
    }
    return out;
  }
  /* ---- full-screen scene mode ---- */
  let layer = null, scv = null, sctx = null, simg = null, sbuf = null, cur = null, saved = null;
  function buildLayer() {
    layer = document.createElement('div');
    layer.id = 'scene-layer';
    layer.style.cssText = 'position:absolute;inset:0;z-index:4;display:none;place-items:center;background:#05061a;touch-action:none';
    scv = document.createElement('canvas'); scv.width = W0; scv.height = H0;
    scv.style.cssText = 'image-rendering:pixelated;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;cursor:pointer';
    const back = document.createElement('button');
    back.className = 'hb'; back.type = 'button'; back.setAttribute('aria-label', 'Back to the gallery');
    back.style.cssText = 'position:absolute;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left))';
    back.innerHTML = '<svg viewBox="-1 -1 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="4" width="10" height="2" fill="#ffffff"/><rect x="1" y="3" width="2" height="4" fill="#ffffff"/><rect x="2" y="2" width="2" height="6" fill="#ffffff"/><rect x="3" y="1" width="2" height="8" fill="#ffffff"/><rect x="4" y="0" width="1" height="10" fill="#9ff3ff"/></svg>';
    back.addEventListener('click', (e) => { e.stopPropagation(); closeScene(); });
    layer.append(scv, back);
    document.getElementById('game').appendChild(layer);
    sctx = scv.getContext('2d'); simg = sctx.createImageData(W0, H0); sbuf = new PX.Buf(W0, H0); sbuf.d = new Uint32Array(simg.data.buffer);
    scv.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (!cur) return;
      const r = scv.getBoundingClientRect();
      cur.inst.tap(((e.clientX - r.left) / r.width) * W0, ((e.clientY - r.top) / r.height) * H0);
    });
  }
  function openScene(p) {
    if (!layer) buildLayer();
    cur = p; saved = FX.list.splice(0);
    layer.style.display = 'grid';
    Game.sfx('portal', null, 0.8); Game.sfx('chime', null, 0.5);
    S.sceneIn = 1;
  }
  function closeScene() {
    if (!cur) return;
    cur = null; layer.style.display = 'none';
    FX.list.length = 0; if (saved) FX.list.push(...saved); saved = null;
    Game.sfx('whoosh', null, 0.7);
    S.in = 0.6;
  }
  function enter() {
    ensure();
    S.on = true; S.t = 0; S.in = 1; S.out = 0; S.target = null;
    Game.gallery = true;
    document.getElementById('game').classList.add('in-gallery');
    Game.sfx('portal', null, 1); Game.sfx('chime', null, 0.7);
    Sound.setUnder(0);
  }
  function leave(hour) {
    if (S.out > 0) return;
    S.out = 0.9; S.target = hour;
    Game.sfx('timewave', null, 1); Game.sfx('whoosh', null, 0.7);
  }
  function update(dt) {
    S.t += dt;
    if (S.in > 0) S.in = Math.max(0, S.in - dt * 1.4);
    if (cur) {
      const evs = cur.inst.step(dt) || [];
      for (const e of evs) { const m = SND[e.name]; if (m) Game.sfx(m[0], null, m[1]); }
      FX.update(dt);
      cur.inst.draw(sbuf);
      if (S.sceneIn > 0) { S.sceneIn = Math.max(0, S.sceneIn - dt * 2); const k = S.sceneIn; if (k > 0) for (let i = 0; i < sbuf.d.length; i++) sbuf.d[i] = mix(sbuf.d[i], white, k * 0.9); }
      sctx.putImageData(simg, 0, 0);
      return;
    }
    for (const p of PIECES) p.acc += dt;
    for (let k = 0; k < 2; k++) {
      const p = PIECES[S.rr++ % PIECES.length];
      const a = Math.min(p.acc, 0.25); p.acc = 0;
      quiet(() => p.inst.step(a));
      p.inst.draw(p.buf);
    }
    if (S.out > 0) {
      S.out -= dt;
      if (S.out <= 0) {
        S.on = false; Game.gallery = false; S.flash = 1;
        document.getElementById('game').classList.remove('in-gallery');
        if (S.target) Game.setHour(Times.ORDER.indexOf(S.target));
        const d = typeof Magic !== 'undefined' && Magic.S.dialga;
        if (d) { d.say && d.say(); FX.sparkles(d.x, d.y - 60, 12, 40, white, glowC); }
      }
    }
  }
  function draw(fb) {
    if (cur) return;
    const w = fb.w, h = fb.h, t = S.t;
    if (!S.bg || S.bgW !== w || S.bgH !== h) { S.bg = nebula(w, h); S.bgW = w; S.bgH = h; }
    // drifting nebula + twinkling stars
    const dx = Math.round(t * 3) % w;
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) fb.d[row + x] = S.bg.d[row + ((x + dx) % w)];
    }
    for (let i = 0; i < 70; i++) {
      const x = Math.floor(hash2(i, 1) * w), y = Math.floor(hash2(i, 2) * h), tw = Math.sin(t * (1 + hash2(i, 3) * 3) + i);
      if (tw > 0.2) { fb.set(x, y, white); if (tw > 0.85) { fb.set(x - 1, y, glowC); fb.set(x + 1, y, glowC); fb.set(x, y - 1, glowC); fb.set(x, y + 1, glowC); } }
    }
    // a slow clock ring behind everything — Dialga's time
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.46;
    for (let j = 0; j < 60; j++) {
      const a = j * 0.1047 + t * 0.05, big = j % 5 === 0, len = big ? 7 : 3;
      for (let k = 0; k < len; k++) {
        const x = Math.round(cx + Math.cos(a) * (R - k)), y = Math.round(cy + Math.sin(a) * (R - k));
        if (x >= 0 && y >= 0 && x < w && y < h) fb.d[y * w + x] = mix(fb.d[y * w + x], big ? glowC : white, big ? 0.7 : 0.35);
      }
    }
    const hand = (a, L, c) => { for (let k = 0; k < L; k++) { const x = Math.round(cx + Math.cos(a) * k), y = Math.round(cy + Math.sin(a) * k); if (x >= 0 && y >= 0 && x < w && y < h) fb.d[y * w + x] = mix(fb.d[y * w + x], c, 0.35); } };
    hand(t * 0.4 - 1.57, R * 0.8, glowC); hand(t * 0.033 - 1.57, R * 0.55, white);
    // floating framed paintings
    const L = layout(w, h);
    PIECES.forEach((p, i) => {
      const f = L[i], bob = Math.round(Math.sin(t * 0.9 + i * 1.3) * 3), X = f.x, Y = f.y + bob, hov = S.hover === i;
      p.rect = { x: X, y: Y, w: f.w, h: f.h };
      // soft glow halo
      for (let r = 10; r >= 1; r--) {
        const k = (hov ? 0.5 : 0.28) * (1 - r / 11);
        for (let x = X - 4 - r; x < X + f.w + 4 + r; x++) for (const y of [Y - 4 - r, Y + f.h + 3 + r]) if (x >= 0 && y >= 0 && x < w && y < h && bayer4(x, y) < k * 2) fb.d[y * w + x] = mix(fb.d[y * w + x], glowC, 0.3);
        for (let y = Y - 4 - r; y < Y + f.h + 4 + r; y++) for (const x of [X - 4 - r, X + f.w + 3 + r]) if (x >= 0 && y >= 0 && x < w && y < h && bayer4(x, y) < k * 2) fb.d[y * w + x] = mix(fb.d[y * w + x], glowC, 0.3);
      }
      // gilded frame
      for (let k = 0; k < 4; k++) {
        const c = gold[[1, 3, 2, 0][k]];
        for (let x = X - 4 + k; x < X + f.w + 4 - k; x++) { fb.set(x, Y - 4 + k, c); fb.set(x, Y + f.h + 3 - k, gold[[0, 1, 1, 0][k]]); }
        for (let y = Y - 4 + k; y < Y + f.h + 4 - k; y++) { fb.set(X - 4 + k, y, c); fb.set(X + f.w + 3 - k, y, gold[[0, 1, 1, 0][k]]); }
      }
      for (const [ox, oy] of [[-4, -4], [f.w + 1, -4], [-4, f.h + 1], [f.w + 1, f.h + 1]]) for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) fb.set(X + ox + a, Y + oy + b, gold[a + b > 2 ? 2 : 4]);
      // the living painting, sampled down into the frame
      const s = f.s, src = p.buf.d;
      for (let y = 0; y < f.h; y++) {
        const sy = Math.min(H0 - 1, Math.floor(y / s)), py = Y + y;
        if (py < 0 || py >= h) continue;
        for (let x = 0; x < f.w; x++) {
          const px = X + x;
          if (px < 0 || px >= w) continue;
          fb.d[py * w + px] = src[sy * W0 + Math.min(W0 - 1, Math.floor(x / s))];
        }
      }
      // glass glint sweeping across
      const g = ((t * 0.25 + i * 0.19) % 1.6) * (f.w + f.h) - f.h;
      for (let y = 0; y < f.h; y++) for (let k = 0; k < 3; k++) { const x = Math.round(g + y * 0.6) + k; if (x >= 0 && x < f.w) { const i2 = (Y + y) * w + X + x; if (Y + y >= 0 && Y + y < h) fb.d[i2] = mix(fb.d[i2], white, 0.25); } }
    });
    // arrival / departure swirl: the world dissolves in from a ring of light
    const k = S.in > 0 ? S.in : S.out > 0 ? 1 - S.out / 0.9 : 0;
    if (k > 0) {
      const rr = (1 - k) * Math.hypot(w, h) * 0.6;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (S.in > 0 ? d > rr : d < Math.hypot(w, h) * 0.6 * k) fb.d[y * w + x] = S.in > 0 ? mix(fb.d[y * w + x], white, Math.min(1, (d - rr) / 30)) : mix(fb.d[y * w + x], white, 0.85);
        else if (Math.abs(d - rr) < 3) fb.d[y * w + x] = glowC;
      }
    }
  }
  function poke(x, y) {
    if (S.in > 0.3 || S.out > 0) return;
    for (let i = 0; i < PIECES.length; i++) {
      const r = PIECES[i].rect;
      if (r && x >= r.x - 4 && y >= r.y - 4 && x < r.x + r.w + 4 && y < r.y + r.h + 4) {
        S.hover = i; Game.sfx('twinkle', null, 0.8);
        openScene(PIECES[i]);
        return;
      }
    }
    leave(null);
  }
  // soft picture-frame vignette and the white flash after a warp
  let vig = null, vw = 0, vh = 0;
  function post(fb) {
    const w = fb.w, h = fb.h, d = fb.d;
    if (!vig || vw !== w || vh !== h) {
      vig = new Uint8Array(w * h); vw = w; vh = h;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const u = (x / w - 0.5) * 2, v = (y / h - 0.5) * 2, r = Math.max(0, Math.hypot(u * 0.9, v) - 0.72);
        vig[y * w + x] = Math.round(Math.min(0.32, r * r * 0.9) * 255 + bayer4(x, y) * 6);
      }
    }
    for (let i = 0; i < d.length; i++) {
      const k = vig[i];
      if (k < 8) continue;
      const c = d[i], f = 255 - k;
      d[i] = (c & 0xff000000) | ((((c >>> 16) & 255) * f >> 8) << 16) | ((((c >>> 8) & 255) * f >> 8) << 8) | ((c & 255) * f >> 8);
    }
    if (S.flash > 0) {
      S.flash = Math.max(0, S.flash - 0.03);
      for (let i = 0; i < d.length; i++) d[i] = mix(d[i], white, S.flash * 0.8);
    }
  }
  return { S, enter, leave, update, draw, poke, post, openScene, closeScene, PIECES };
})();

Game.boot();
