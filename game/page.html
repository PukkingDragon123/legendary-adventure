<title>Mudkip Cove</title>
<div id="game" tabindex="-1">
  <canvas id="cv"></canvas>
  <div class="hud hud-tl">
    <button id="b-orb" class="hb" type="button"></button>
    <div id="scenes" hidden></div>
  </div>
  <div class="hud hud-tr">
    <button id="b-sound" class="hb" type="button" aria-pressed="false"></button>
    <button id="b-full" class="hb" type="button" aria-label="Fullscreen"></button>
  </div>
  <div id="start">
    <button id="b-start" type="button" aria-label="Play">
      <span class="pb-top"></span><span class="pb-bot"></span>
    </button>
    <span class="tap" aria-hidden="true"></span>
  </div>
</div>
